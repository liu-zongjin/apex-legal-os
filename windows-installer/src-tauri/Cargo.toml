[package]
name = "stella-windows"
version = "0.1.0"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

[[bin]]
name = "Stella"
path = "src/main.rs"
