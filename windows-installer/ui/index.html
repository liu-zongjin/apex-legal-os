<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安装 Stella</title><link rel="stylesheet" href="installer.css"><script defer src="installer.js"></script></head>
<body><main><div class="brand" aria-hidden="true">✦</div><p class="eyebrow">STELLA · WINDOWS</p><h1 id="title">准备好你的工作空间</h1><p class="intro">自动检查电脑环境，准备办案所需组件。你的资料始终保存在本机。</p><section aria-label="安装状态"><ol class="stages" aria-label="准备步骤"><li id="stage-download">下载</li><li id="stage-verify">校验</li><li id="stage-launch">启动</li></ol><p id="status" role="status" aria-live="polite">正在检测系统…</p><div id="overall" hidden><p class="note" id="overall-label"></p><progress id="overall-progress" value="0" max="100" aria-labelledby="overall-label"></progress></div><p class="note" id="step-label" hidden></p><progress id="progress" value="0" max="100" aria-labelledby="step-label" hidden></progress><p class="note" id="transfer" hidden></p><p class="note" id="detail" hidden></p><ul id="components"></ul><p class="note" id="size"></p></section><div class="actions"><button id="repair" hidden>检查更新与修复</button><button id="primary" disabled>正在检测</button></div><p class="footnote">下载期间需要联网，中断后可重试续传。校验与启动在本机进行；安装完成前不会覆盖已有版本和业务资料。</p></main></body></html>
