<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据保全与恢复</title>
<link rel="stylesheet" href="/static/apex-design-tokens.css?v=2"><link rel="stylesheet" href="/static/color-theme.css?v=11"><script src="/static/color-theme.js?v=7"></script>
<style>
*{box-sizing:border-box}body{font:14px -apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:var(--bg,#f4f6fa);color:var(--text,#243044)}main{max-width:1000px;margin:40px auto;padding:24px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:24px}p{line-height:1.7;color:var(--text-secondary,#64748b)}article{padding:20px;margin:16px 0;border:1px solid var(--border,#dae1eb);border-radius:16px;background:var(--surface,#fff)}button,a.action{border:1px solid var(--border,#d5ddea);background:var(--surface,#fff);color:inherit;padding:9px 14px;border-radius:10px;cursor:pointer;text-decoration:none}button:focus-visible,input:focus-visible{outline:2px solid #3478df;outline-offset:3px}pre{white-space:pre-wrap;word-break:break-word;font:13px/1.7 ui-monospace,monospace;max-height:360px;overflow:auto}input{font:inherit;padding:9px;border:1px solid var(--border,#cbd5e1);border-radius:8px;width:160px;background:var(--surface,#fff);color:inherit}.overlay{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:20px}.overlay[hidden]{display:none}.dialog{padding:28px;background:var(--surface,#fff);border-radius:18px;max-width:440px}.actions{display:flex;gap:12px;flex-wrap:wrap}.error{color:#b42330}
@media(prefers-color-scheme:dark){body{background:#111720;color:#e5e7eb}article,button,a.action,input,.dialog{background:#1a2432;border-color:#3a4658}}@media(max-width:600px){main{margin:0;padding:16px}header{align-items:flex-start;flex-direction:column}}
</style><script src="/static/apex-downloads.js?v=2026101902"></script></head><body><main><header><h1>数据保全与恢复</h1><a class="action" href="/api/maintenance/recovery/export" download>导出全部保全记录</a></header><p>缺少原关联记录的内容已完整保留在这里。核实并选择正确的文章、研究项目或案件后，可以重新关联恢复；编号冲突时不会覆盖已有内容。</p><p id="status" role="status">正在读取…</p><section id="records"></section></main>
<div id="confirm" class="overlay" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title"><h2 id="confirm-title">恢复此记录</h2><p id="confirm-text"></p><div class="actions"><button id="cancel">取消</button><button id="restore">确认恢复</button></div></div></div>
<script>
const labels={notes:'文章笔记',research_memos:'研究备忘',knowledge_claim_evidence:'知识证据',knowledge_extraction_jobs:'提取任务',article_paragraphs:'文章段落',research_project_articles:'文章关联',case_manager_audit_logs:'案件变更记录'};
let pending=null;
async function load(){try{const r=await fetch('/api/maintenance/recovery',{cache:'no-store'});if(!r.ok)throw Error('无法读取保全记录，请确认登录状态');const data=await r.json();document.getElementById('status').textContent=`共 ${data.items.length} 条保全记录`;const host=document.getElementById('records');host.replaceChildren();for(const row of data.items){const card=document.createElement('article'),title=document.createElement('h2'),pre=document.createElement('pre');title.textContent=`${labels[row.source_table]||row.source_table} · 原编号 ${row.original_rowid}${row.restored_at?' · 已恢复':''}`;const original=JSON.parse(row.row_json);pre.textContent=original.content||original.quote||original.statement||original.title||'关联信息已保全，可导出查看完整内容';card.append(title,pre);if(!row.restored_at){const controls=document.createElement('div'),input=document.createElement('input'),button=document.createElement('button');controls.className='actions';input.type='search';input.placeholder='搜索并选择关联内容';input.setAttribute('aria-label','搜索并选择关联内容');const choices=document.createElement('div');choices.className='actions';let revision=0;async function find(){const version=++revision;input.dataset.parentId='';const r=await fetch(`/api/maintenance/recovery/${row.id}/parents?q=${encodeURIComponent(input.value)}`);if(!r.ok||version!==revision)return;const data=await r.json();choices.replaceChildren();for(const item of data.items){const pick=document.createElement('button');pick.type='button';pick.textContent=`${data.parent_type} · ${item.title||'未命名'}`;pick.onclick=()=>{input.value=item.title||'未命名';input.dataset.parentId=String(item.id);choices.replaceChildren();button.focus()};choices.append(pick)}}input.oninput=()=>{clearTimeout(input.timer);input.timer=setTimeout(()=>find().catch(()=>{}),250)};input.onfocus=()=>find().catch(()=>{});button.textContent='重新关联并恢复';button.onclick=()=>{const id=Number(input.dataset.parentId);if(!Number.isSafeInteger(id)||id<1){document.getElementById('status').textContent='请先选择经过核实的关联内容';input.focus();return}pending={row,parent_id:id,button};document.getElementById('confirm-text').textContent=`将此内容关联到“${input.value}”。请核对父记录的类型与内容，原保全副本会继续留存。`;document.getElementById('confirm').hidden=false;document.getElementById('cancel').focus()};const originalButton=document.createElement('button');originalButton.type='button';originalButton.textContent='沿用原关联恢复';originalButton.title='全部依赖记录已恢复后可用';originalButton.onclick=()=>{pending={row,parent_id:null,button:originalButton};document.getElementById('confirm-text').textContent='将按保全时的原关联恢复此记录。只有全部依赖记录已存在时才会执行，编号冲突时保留现有内容。';document.getElementById('confirm').hidden=false;document.getElementById('cancel').focus()};controls.append(input,button,originalButton);card.append(controls,choices)}host.append(card)}}catch(e){document.getElementById('status').textContent=e.message}}
function closeConfirm(){document.getElementById('confirm').hidden=true;pending?.button.focus();pending=null}
document.getElementById('cancel').onclick=closeConfirm;
document.getElementById('restore').onclick=async()=>{if(!pending)return;const task=pending;closeConfirm();try{const r=await fetch(`/api/maintenance/recovery/${task.row.id}/restore`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({parent_id:task.parent_id})});const data=await r.json();if(!r.ok)throw Error(data.detail||'恢复失败');await load()}catch(e){document.getElementById('status').textContent=e.message}};
document.addEventListener('keydown',e=>{if(document.getElementById('confirm').hidden)return;if(e.key==='Escape')closeConfirm();if(e.key==='Tab'){e.preventDefault();const a=document.getElementById('cancel'),b=document.getElementById('restore');(document.activeElement===a?b:a).focus()}});load();
</script></body></html>
