  <style>

<body><main class="page">
  <header class="head"><div><div class="eyebrow">效率中心 · 工具</div><h1>会议室预定</h1><p>连接明思智慧律所，查询可用会议室并直接提交会议申请。</p></div><button id="connectionButton" class="status-control" type="button" aria-haspopup="dialog"><i id="statusDot" class="dot"></i><span id="statusText">正在检查连接…</span></button></header>
  <div class="grid"><div class="stack"><section class="card"><h2>我的会议申请</h2><div class="table-wrap"><table class="table meeting-list-table"><thead><tr><th>会议事宜</th><th>会议室</th><th>日期</th><th>时段</th><th>状态</th></tr></thead><tbody id="meetingRows"><tr><td colspan="5" class="empty">连接后显示</td></tr></tbody></table></div></section></div>
  <section class="card"><h2>新建会议申请</h2><div class="fields">
    <div><label>会议事宜</label><select id="subject"><option>接待客户</option><option selected>内部会议</option><option>底稿整理</option></select></div>
    <div><label>会议室</label><div class="room-picker"><button id="roomChoice" class="room-choice" type="button" disabled>请先连接明思</button><div id="roomOptions" class="room-options"></div></div><div id="roomMeta" class="room-meta"></div></div>
    <div><label>预定日期</label><div id="datePicker" class="date-picker" data-value=""><input id="meetingDate" type="hidden"><button id="dateTrigger" class="date-trigger" type="button"></button><div id="calendarPopover" class="calendar-popover"><div class="calendar-head"><select id="calendarYear"></select><select id="calendarMonth"></select><span class="calendar-spacer"></span><button id="calendarPrev" class="calendar-nav" type="button" aria-label="上月">‹</button><button id="calendarNext" class="calendar-nav" type="button" aria-label="下月">›</button></div><div class="calendar-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="calendarDays" class="calendar-days"></div><div class="calendar-footer"><button id="calendarClear" type="button">清空</button><span class="spacer"></span><button id="calendarToday" type="button">今天</button><button id="calendarConfirm" class="confirm" type="button">确定</button></div></div></div></div><div><label>参会人员／部门</label><div class="suggestion-wrap"><input id="members" autocomplete="off" value="示丁某"><div id="memberSuggestions" class="suggestions"></div></div></div>
    <div class="time-picker"><div id="timeRangeSummary" class="time-summary">已选 09:00–10:00</div><div id="timeTip" class="time-tip">从 08:00 至 20:00，连续点击两次即可确定预约时段。</div><div class="time-legend"><span><i class="legend-dot"></i>可选</span><span><i class="legend-dot booked"></i>已预定，不可选</span></div><div id="timeAxis" class="time-axis" aria-label="选择会议时间段"></div></div>
    <div><label>审批人</label><input id="approverText" readonly value="连接后自动显示"></div><div><label>备注</label><input id="remark" placeholder="可选"></div>
  </div><div id="availability" class="room-status"></div><div class="actions"><button id="checkBtn" class="secondary" type="button">检查可用性</button><button id="submitBtn" type="button">直接提交申请</button></div><div id="meetingNotice" class="notice"></div></section></div>
  <section class="card schedule-card"><div class="schedule-head"><div><h2>当日会议室时段总览</h2><div id="scheduleNote" class="schedule-note">选择预定日期后自动同步。已预定与空闲时段均以明思数据为准。</div></div><button id="refreshScheduleBtn" class="secondary" type="button">刷新时段</button></div><div class="table-wrap"><table class="table schedule-table"><thead><tr><th>会议室</th><th>已预定时段</th><th>空闲时段</th></tr></thead><tbody id="scheduleRows"><tr><td colspan="3" class="empty">连接后显示当日时段</td></tr></tbody></table></div></section>
</main>
<div id="connectionModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="connectionTitle"><section class="modal-card"><div class="modal-head"><h2 id="connectionTitle">明思账号</h2><button id="closeConnectionButton" class="icon-button" type="button" aria-label="关闭">×</button></div><p id="accountHint" class="muted">首次使用时输入一次账号密码，凭据仅保存在本机钥匙串。</p><div id="connectedAccount" class="connection-state"></div><div id="credentialFields" class="fields"><div class="span2"><label>账号</label><input id="account" autocomplete="username" placeholder="明思账号"></div><div class="span2"><label>密码</label><input id="password" type="password" autocomplete="current-password" placeholder="明思密码"></div><div id="corpBox" class="span2" hidden><label>所属机构</label><select id="corpId"></select></div></div><div class="actions"><button id="clearBtn" class="secondary" type="button">清除连接</button><button id="editConnectionBtn" class="secondary" type="button" hidden>更换账号</button><button id="connectBtn" type="button">连接明思</button></div><div id="accountNotice" class="notice"></div></section></div>
<script src="/static/apex-page-lifecycle.js?v=2"></script><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),api=async(p,o={})=>{const r=await fetch('/api/mingsi-meetings'+p,{headers:{'Content-Type':'application/json'},...o}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:(d.detail?.message||'操作失败'));return d},show=(id,msg,type='')=>{const e=$(id);e.textContent=msg;e.className='notice '+type;e.style.display=msg?'block':'none'};
let connected=false,rooms=[],lawyers=[],approverIds=[],roomId='',start='09:00',end='10:00',bookingsByRoom=new Map(),scheduleRequest=0;const initialDate=new Date().toISOString().slice(0,10);$('meetingDate').value=initialDate;$('datePicker').dataset.value=initialDate;const bookingDate=()=>String($('datePicker').dataset.value||$('meetingDate').value||'').slice(0,10),tm=v=>{const [h,m]=v.slice(0,5).split(':').map(Number);return h*60+m},tt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'),label=x=>x.personname||x.name||x.roomname||x.meetingroomname||'未命名',range=(a,b)=>a+'–'+b;

function roomBookings(){return bookingsByRoom.get(String(roomId))||[]}function isBooked(value){const n=tm(value);return roomBookings().some(x=>n>=tm(x.start)&&n<tm(x.end))}function overlaps(a,b){if(!a||!b)return false;const lo=Math.min(tm(a),tm(b)),hi=Math.max(tm(a),tm(b));return roomBookings().some(x=>lo<tm(x.end)&&hi>tm(x.start))}function timeOrder(){return Array.from({length:49},(_,index)=>tt(480+index*15))}
