<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OA系统</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }
    html.dark-mode, body.dark-mode { color-scheme: dark; }
    html.dark-mode body, body.dark-mode { background: #0f1724; }
    html.dark-mode iframe, body.dark-mode iframe { background: #0f1724; }
  </style>
  <link rel="stylesheet" href="/static/color-theme.css?v=11">
  <script src="/static/color-theme.js?v=6"></script>
</head>
<body>
  <iframe
    src="https://mingsi.elawoffice.net/#/"
    allow="clipboard-read; clipboard-write; fullscreen"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>
</body>
</html>
