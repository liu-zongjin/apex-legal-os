<html lang="zh-CN">
<head>

  <title>案件文件</title>
  <script src="/static/color-theme.js?v=7"></script>
  <style>
    :root{color-scheme:light;--bg:#f5f5f7;--panel:rgba(255,255,255,.9);--solid:#fff;--soft:#f2f2f4;--line:rgba(30,30,35,.1);--text:#1d1d1f;--muted:#6e6e73;--blue:#0878f9;--blue-soft:#e8f2ff;--danger:#c9342d;--shadow:0 18px 50px rgba(35,35,40,.12)}

    *{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:radial-gradient(circle at 15% -10%,#fff 0,#f5f5f7 42%,#eeeff2 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding:16px 18px 14px;gap:10px}
    .titlebar,.toolbar,.statusbar{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%)}

    .identity{display:flex;align-items:center;gap:13px;min-width:0}.app-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,#62b2ff,#0878f9);display:grid;place-items:center;box-shadow:0 7px 18px rgba(8,120,249,.23)}
    .identity h1{font-size:18px;line-height:1.2;margin:0;font-weight:730;letter-spacing:-.2px}.identity p{margin:5px 0 0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
    .connection{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#30b35b;box-shadow:0 0 0 4px rgba(48,179,91,.12)}.dot.offline{background:#d64841;box-shadow:0 0 0 4px rgba(214,72,65,.11)}
    .toolbar{min-height:48px;border-radius:14px;padding:7px;display:flex;align-items:center;gap:7px;overflow-x:auto}.divider{width:1px;height:24px;background:var(--line);margin:0 2px;flex:none}
    .btn,.select{height:34px;border:1px solid rgba(30,30,35,.11);border-radius:9px;background:rgba(255,255,255,.78);color:var(--text);padding:0 11px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;cursor:pointer;transition:.16s ease}.btn:hover,.select:hover{background:#fff;border-color:rgba(30,30,35,.19)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.38;cursor:default;transform:none}.btn.primary{background:var(--blue);border-color:var(--blue);color:white;box-shadow:0 4px 12px rgba(8,120,249,.2)}.btn.danger{color:var(--danger)}.btn.icon{width:34px;padding:0}.select{appearance:none;padding-right:29px;background-image:linear-gradient(45deg,transparent 50%,#6e6e73 50%),linear-gradient(135deg,#6e6e73 50%,transparent 50%);background-position:calc(100% - 13px) 14px,calc(100% - 9px) 14px;background-size:4px 4px;background-repeat:no-repeat}

    .workspace{min-height:0;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.82);box-shadow:var(--shadow);overflow:hidden;position:relative}.columns{height:100%;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity}.column{height:100%;width:310px;min-width:260px;max-width:360px;border-right:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr);scroll-snap-align:start;background:rgba(255,255,255,.52)}.column:last-child{border-right:0}.column-head{height:42px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);font-weight:650}.column-name{display:inline-flex;align-items:center;gap:7px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.column-list{overflow:auto;padding:6px}.file-row{height:34px;border-radius:8px;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:7px;align-items:center;padding:0 8px;cursor:default;user-select:none;border:1px solid transparent}.file-row:hover{background:rgba(60,60,67,.06)}.file-row.active{background:var(--blue);color:#fff}.file-row.checked:not(.active){background:var(--blue-soft);border-color:rgba(8,120,249,.12)}.file-row.path-active,.file-row.checked.path-active{background:var(--soft);border-color:rgba(60,60,67,.07);color:var(--text)}.file-row.path-active .chevron{opacity:.72}.file-row.drop-target{background:#ddecff;border-color:#0878f9;color:var(--text)}.file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.file-meta{display:inline-flex;align-items:center;justify-content:flex-end;gap:5px;min-width:0;font-size:10px;opacity:.64;white-space:nowrap}.file-row.active .file-meta{opacity:.82}.chevron{font-size:16px;opacity:.42}.finder-tags{display:inline-flex;align-items:center;gap:3px;flex:none}.finder-tag-dot{width:7px;height:7px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18),0 0 0 .5px rgba(255,255,255,.5)}/* These fixed colors mirror Finder's seven tag colors. */.finder-tag-dot.red{background:#ff3b30}.finder-tag-dot.orange{background:#ff9500}.finder-tag-dot.blue{background:#0a84ff}.finder-tag-dot.yellow{background:#ffcc00}.finder-tag-dot.green{background:#34c759}.finder-tag-dot.purple{background:#af52de}.finder-tag-dot.gray{background:#8e8e93}.selection-marquee{position:fixed;z-index:24;pointer-events:none;border:1px solid rgba(8,120,249,.72);background:rgba(8,120,249,.13);border-radius:3px}.empty{height:100%;display:grid;place-items:center;text-align:center;padding:28px;color:var(--muted);font-size:13px;line-height:1.7}.empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:4px}.icon-svg{display:block;width:19px;height:19px}
    .unbound{height:100%;display:grid;place-items:center;padding:30px}.hero{max-width:520px;text-align:center}.hero-icon{width:76px;height:64px;margin:0 auto 22px}.hero h2{font-size:26px;letter-spacing:-.6px;margin:0 0 10px}.hero p{font-size:14px;line-height:1.7;color:var(--muted);margin:0 auto 24px;max-width:440px}.hero-actions{display:flex;justify-content:center;gap:9px}
    .search-view{height:100%;display:grid;grid-template-rows:44px minmax(0,1fr);background:rgba(255,255,255,.58)}.search-head{display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.search-list{overflow:auto;padding:8px}.search-row{min-height:42px;border:1px solid transparent;border-radius:9px;display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:8px;padding:4px 10px;cursor:default;user-select:none}.search-row:hover{background:rgba(60,60,67,.06)}.search-row.active{background:var(--blue);color:#fff}.search-row.checked:not(.active){background:var(--blue-soft);border-color:rgba(8,120,249,.12)}.search-row-copy{min-width:0;display:flex;flex-direction:column;gap:2px}.search-row-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.search-row-path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:10px}.search-row.active .search-row-path{color:rgba(255,255,255,.76)}.search-row-kind{display:inline-flex;align-items:center;justify-content:flex-end;gap:6px;min-width:0;font-size:10px;opacity:.65;white-space:nowrap}.search-row.active .finder-tag-dot{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18),0 0 0 .5px rgba(255,255,255,.58)}
    .statusbar{min-height:38px;border-radius:12px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px;color:var(--muted)}.selection-summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.path-summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
    .menu{position:fixed;z-index:30;min-width:210px;padding:6px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.97);box-shadow:0 16px 45px rgba(30,30,35,.18);backdrop-filter:blur(22px)}.menu button{width:100%;height:32px;border:0;border-radius:7px;background:transparent;display:flex;align-items:center;justify-content:space-between;padding:0 9px;cursor:pointer;color:var(--text)}.menu button:hover{background:var(--blue);color:#fff}.menu .danger{color:var(--danger)}.menu .sep{height:1px;background:var(--line);margin:5px}.menu-folder-label{padding:5px 9px 3px;color:var(--muted);font-size:11px}.menu-color-group{display:flex;align-items:center;gap:7px;padding:6px 8px 5px}.menu-color-option{width:22px!important;height:22px!important;justify-content:center!important;padding:0!important;border-radius:50%!important}.menu-color-option:hover{background:var(--soft)!important;color:var(--text)!important}.menu-color-option .finder-tag-dot{width:17px;height:17px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2),0 0 0 .5px rgba(255,255,255,.65)}.menu-color-option.clear{font-size:18px;line-height:1;color:var(--muted)}.menu-color-option.clear:hover{color:var(--text)!important}
    .mask{position:fixed;inset:0;z-index:40;background:rgba(20,20,24,.24);backdrop-filter:blur(5px);display:none;place-items:center;padding:20px}.mask.show{display:grid}.dialog{width:min(440px,94vw);border:1px solid rgba(255,255,255,.6);border-radius:18px;background:#fff;box-shadow:0 28px 80px rgba(20,20,25,.28);padding:20px}.dialog h3{margin:0 0 8px;font-size:18px}.dialog p{margin:0 0 15px;color:var(--muted);font-size:13px;line-height:1.6}.dialog input,.dialog select{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 11px;outline:none}.dialog input:focus,.dialog select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(8,120,249,.12)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.ocr-list{max-height:150px;overflow:auto;background:var(--soft);border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:12px;line-height:1.8}.toast{position:fixed;z-index:60;left:50%;bottom:28px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:rgba(35,35,39,.94);color:#fff;border-radius:11px;padding:10px 15px;font-size:12px;box-shadow:0 12px 35px rgba(0,0,0,.2);transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0)}
    .preview-mask{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:34px;background:rgba(22,24,29,.42);backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%)}.preview-mask.show{display:grid}.preview-panel{width:min(1040px,92vw);height:min(760px,88vh);display:grid;grid-template-rows:52px minmax(0,1fr) 34px;overflow:hidden;border:1px solid rgba(255,255,255,.62);border-radius:20px;background:rgba(250,250,252,.96);box-shadow:0 32px 110px rgba(15,18,24,.34)}.preview-head{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line)}.preview-head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font-size:13px}.preview-close{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}.preview-close:hover{background:var(--soft);color:var(--text)}.preview-body{min-height:0;overflow:auto;display:grid;place-items:center;background:#e9eaed}.preview-body iframe{width:100%;height:100%;border:0;background:#fff}.preview-body img{display:block;max-width:100%;max-height:100%;object-fit:contain}.preview-text{align-self:stretch;justify-self:stretch;margin:0;padding:28px 34px;overflow:auto;background:var(--solid);color:var(--text);font:13px/1.75 ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;white-space:pre-wrap;word-break:break-word}.preview-folder{display:grid;place-items:center;text-align:center;gap:10px;padding:28px}.preview-folder .icon-svg{width:78px;height:64px}.preview-folder strong{font-size:20px}.preview-folder span{color:var(--muted);font-size:12px}.preview-unsupported{max-width:420px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7;padding:30px}.preview-foot{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
    @media(max-width:760px){.app{padding:10px}.titlebar{border-radius:15px}.identity p{max-width:55vw}.connection span:last-child{display:none}.source-toggle span{display:none}.toolbar{padding-bottom:8px}.btn .label{display:none}}
    .column{width:var(--column-width,310px);min-width:var(--column-width,310px);max-width:var(--column-width,310px);flex:0 0 var(--column-width,310px);position:relative}.column-resizer{position:absolute;top:0;right:-5px;width:10px;height:100%;z-index:12;cursor:col-resize;touch-action:none}.column-resizer::after{content:"";position:absolute;top:8px;bottom:8px;left:4px;width:2px;border-radius:2px;background:transparent}.column-resizer:hover::after,.column-resizer.resizing::after{background:var(--blue)}.file-row.renaming{background:var(--blue-soft);border-color:rgba(8,120,249,.18);color:var(--text)}.inline-rename-input{width:100%;min-width:0;height:25px;border:1px solid var(--blue);border-radius:5px;padding:0 5px;outline:0;background:var(--solid);color:var(--text);font-size:13px;box-shadow:0 0 0 2px rgba(8,120,249,.14)}.search-row.renaming{background:var(--blue-soft);border-color:rgba(8,120,249,.18);color:var(--text)}
    .statusbar{display:grid;grid-template-columns:minmax(180px,1fr) minmax(0,2fr);align-items:center}.selection-summary,.path-summary{min-width:0}.statusbar.multiple-selection{min-height:64px;align-items:start;padding-top:8px;padding-bottom:8px;grid-template-columns:minmax(220px,1fr) minmax(0,2.2fr)}.statusbar.multiple-selection .selection-summary,.statusbar.multiple-selection .path-summary{display:flex;flex-direction:column;gap:3px;overflow:hidden;text-align:left;white-space:normal;line-height:1.35}.statusbar.multiple-selection .selection-label,.statusbar.multiple-selection .path-label{color:var(--text);font-weight:650}.statusbar.multiple-selection .selection-names,.statusbar.multiple-selection .path-list{min-width:0;overflow:auto;overflow-wrap:anywhere;word-break:break-word;white-space:pre-line}.statusbar.multiple-selection .selection-names{max-height:36px}.statusbar.multiple-selection .path-list{max-height:46px;font-size:10px}
    @media(max-width:760px){.statusbar{grid-template-columns:minmax(0,1fr);gap:5px;padding-top:7px;padding-bottom:7px}.statusbar.multiple-selection{grid-template-columns:minmax(0,1fr);max-height:120px;overflow:auto}}
    .archive-selection-count,#archiveAssignBtn{display:none}
    html.archive-picker .app{grid-template-rows:auto minmax(0,1fr) auto;padding:0;gap:0}
    html.archive-picker .titlebar{display:none}
    html.archive-picker .toolbar{position:relative;z-index:20;border-radius:0;border-left:0;border-right:0;border-top:0;box-shadow:none;flex-wrap:wrap;overflow:visible;padding:9px 12px}
    html.archive-picker .toolbar .divider,html.archive-picker #finderBtn,html.archive-picker #bindBtn,html.archive-picker #openBtn,html.archive-picker #renameBtn,html.archive-picker #moveBtn,html.archive-picker #trashBtn,html.archive-picker #askBtn,html.archive-picker .source-toggle{display:none}
    html.archive-picker .file-search{flex:1;min-width:180px;width:auto}
    html.archive-picker .archive-picker-actions{display:flex;align-items:center;gap:8px;position:relative}
    html.archive-picker .archive-selection-count,html.archive-picker #archiveAssignBtn{display:inline-flex}
    html.archive-picker .archive-selection-count{color:var(--muted);font-size:11px;white-space:nowrap}
    html.archive-picker .archive-assignment-menu{position:absolute;z-index:80;right:0;top:calc(100% + 7px);width:min(320px,82vw);max-height:min(55vh,420px);overflow:auto;padding:6px;border:1px solid rgba(255,255,255,.8);border-radius:14px;background:rgba(250,250,252,.985);box-shadow:0 18px 48px rgba(30,34,42,.2);backdrop-filter:blur(24px) saturate(155%);-webkit-backdrop-filter:blur(24px) saturate(155%)}
    html.archive-picker .archive-assignment-menu[hidden]{display:none}
    html.archive-picker .archive-assignment-menu button{display:block;width:100%;min-height:32px;padding:7px 10px;border:0;border-radius:9px;background:transparent;color:#1d1d1f;text-align:left;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;font-size:12px;font-weight:550;line-height:1.4;cursor:pointer}
    html.archive-picker .archive-assignment-menu button:hover,html.archive-picker .archive-assignment-menu button:focus-visible{background:rgba(0,122,255,.11);outline:none}
    html.dark-mode.archive-picker .archive-assignment-menu{background:rgba(39,39,42,.985);border-color:rgba(255,255,255,.13)}html.dark-mode.archive-picker .archive-assignment-menu button{color:#f5f5f7}
    @media(prefers-reduced-transparency:reduce){html.archive-picker .archive-assignment-menu{backdrop-filter:none;-webkit-backdrop-filter:none;background:#fafafc}html.dark-mode.archive-picker .archive-assignment-menu{background:#27272a}}
    html.archive-picker .workspace{border:0;border-radius:0;box-shadow:none;background:rgba(248,248,250,.985)}html.archive-picker .column{background:rgba(255,255,255,.985)}html.archive-picker .search-view{background:rgba(255,255,255,.985)}html.dark-mode.archive-picker .workspace{background:rgba(29,29,31,.985)}html.dark-mode.archive-picker .column,html.dark-mode.archive-picker .search-view{background:rgba(38,38,41,.985)}
    html.archive-picker .statusbar{border:0;border-top:1px solid var(--line);border-radius:0;backdrop-filter:none;min-height:30px}
    html.archive-picker .file-row{cursor:pointer}

    .archive-file-status.confirmed{color:#198153;background:rgba(36,148,93,.12)}
    .archive-file-status.excluded{color:var(--danger);background:rgba(201,88,60,.1)}
    html.dark-mode body{background:radial-gradient(circle at 15% -10%,#2b2b2e 0,#19191b 48%,#121214 100%)}html.dark-mode .workspace{background:rgba(29,29,31,.86)}html.dark-mode .column{background:rgba(34,34,37,.58)}html.dark-mode .btn,html.dark-mode .select{background:rgba(53,53,57,.82);color:var(--text)}html.dark-mode .btn:hover,html.dark-mode .select:hover{background:#414145}html.dark-mode .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}html.dark-mode .btn.danger{color:var(--danger)}html.dark-mode .dialog{background:#27272a;border-color:var(--line)}html.dark-mode .menu{background:rgba(39,39,42,.97)}html.dark-mode .file-row:hover{background:rgba(255,255,255,.07)}html.dark-mode .preview-panel{background:rgba(35,35,38,.97);border-color:rgba(255,255,255,.13)}html.dark-mode .preview-body{background:#151518}

<body>
<main class="app">
  <header class="titlebar">
    <div class="identity"><div class="app-icon" id="appIcon"></div><div><h1 id="caseTitle">案件文件</h1><p id="folderPath">正在读取案件文件夹…</p></div></div>
    <div class="connection"><span class="dot" id="statusDot"></span><span id="statusText">正在连接</span></div>
  </header>
  <nav class="toolbar" id="toolbar">
    <button class="btn icon" id="backBtn" title="返回上一层">‹</button>
    <button class="btn" id="finderBtn">在访达中打开</button>
    <button class="btn" id="bindBtn">重新绑定</button>
    <span class="divider"></span>
    <select class="select" id="sortKey" title="排列方式"><option value="name">名称</option><option value="kind">种类</option><option value="last_opened_at">上次打开日期</option><option value="added_at">添加日期</option><option value="modified_at">修改日期</option><option value="created_at">创建日期</option><option value="size">大小</option></select>
    <button class="btn icon" id="sortDirection" title="升序">↑</button>
    <label class="source-toggle"><input type="checkbox" id="showHidden"><span>显示隐藏项目</span></label>
    <span class="divider"></span>
    <div class="file-search"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><input type="search" id="fileSearch" placeholder="搜索文件夹与文件名称" autocomplete="off"><label class="fuzzy-toggle" title="允许近似名称匹配"><input type="checkbox" id="fuzzySearch"><span>模糊</span></label></div>
    <span class="divider"></span>
    <button class="btn" id="openBtn" disabled>打开</button><button class="btn" id="renameBtn" disabled>重命名</button><button class="btn" id="moveBtn" disabled>移动到</button><button class="btn danger" id="trashBtn" disabled>移到废纸篓</button>

<script>
  const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const caseId=Number(params.get('case_id')||0);const suppliedTitle=params.get('title')||'案件文件';const archivePicker=params.get('archive_picker')==='1';if(archivePicker)document.documentElement.classList.add('archive-picker');

  const icons={folder:`<svg class="icon-svg" viewBox="0 0 22 18" aria-hidden="true"><path d="M1.5 4.2c0-1 .8-1.7 1.7-1.7h5l1.7 2h8.9c1 0 1.7.8 1.7 1.7v8.6c0 1-.8 1.7-1.7 1.7H3.2c-1 0-1.7-.8-1.7-1.7z" fill="#52a9ff"/><path d="M2.2 6h17.6" stroke="#fff" stroke-opacity=".48"/></svg>`,file:`<svg class="icon-svg" viewBox="0 0 18 21" aria-hidden="true"><path d="M3 1h7l5 5v12.5A1.5 1.5 0 0113.5 20h-10A1.5 1.5 0 012 18.5v-16A1.5 1.5 0 013.5 1z" fill="#f4f4f5" stroke="#b8b8bd"/><path d="M10 1v5h5" fill="#fff" stroke="#b8b8bd"/></svg>`,link:`<svg class="icon-svg" viewBox="0 0 20 20"><path d="M7.5 12.5l5-5M6 15H4a3 3 0 010-6h3M14 5h2a3 3 0 010 6h-3" fill="none" stroke="#7c7c82" stroke-width="1.6" stroke-linecap="round"/></svg>`};
  const finderIconColorMap={red:'#ff3b30',orange:'#ff9500',blue:'#0a84ff',yellow:'#ffcc00',green:'#34c759',purple:'#af52de',gray:'#8e8e93'};
  $('appIcon').innerHTML=icons.folder;$('caseTitle').textContent=suppliedTitle+' · 案件文件';
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

  async function api(url,options={}){const response=await fetch(url,options);const data=await response.json().catch(()=>({}));if(!response.ok){const detail=typeof data.detail==='object'?data.detail:({message:data.detail||data.message});const error=new Error(detail.message||`请求失败（${response.status}）`);error.detail=data.detail;error.status=response.status;throw error}return data}
  function notify(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.remove('show'),2600)}

  function compareText(a,b){return String(a||'').localeCompare(String(b||''),'zh-CN',{numeric:true,sensitivity:'base'})}
  function sorted(items){const dir=state.direction==='asc'?1:-1;return [...items].sort((a,b)=>{if(a.is_directory!==b.is_directory)return a.is_directory?-1:1;if(state.sortKey==='size'&&a.is_directory)return compareText(a.name,b.name);let av=a[state.sortKey],bv=b[state.sortKey];if(state.sortKey==='name'||state.sortKey==='kind')return compareText(av,bv)*dir;const am=av===null||av==='',bm=bv===null||bv==='';if(am!==bm)return am?1:-1;if(am&&bm)return compareText(a.name,b.name);const diff=(Number(av)||Date.parse(av)||0)-(Number(bv)||Date.parse(bv)||0);return (diff||compareText(a.name,b.name))*dir})}
  function formatSize(value){if(value==null)return'';const units=['B','KB','MB','GB','TB'];let n=Number(value),i=0;while(n>=1024&&i<units.length-1){n/=1024;i++}return`${n>=10||i===0?n.toFixed(0):n.toFixed(1)} ${units[i]}`}
  function formatDate(value){if(!value)return'—';const d=new Date(value);return Number.isNaN(d.getTime())?'—':new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}

  const finderTagColors=new Set(['red','orange','blue','yellow','green','purple','gray']);

  const finderColorOptions=[{index:6,color:'red',label:'红色'},{index:7,color:'orange',label:'橙色'},{index:3,color:'blue',label:'蓝色'},{index:5,color:'yellow',label:'黄色'},{index:4,color:'green',label:'绿色'},{index:2,color:'purple',label:'紫色'},{index:1,color:'gray',label:'灰色'}];
  function finderColorMenuHtml(folderPath){const targetCall=folderPath===undefined?'':`,decodeURIComponent('${encodePath(folderPath)}')`,label=folderPath===undefined?'设置颜色':'设置当前文件夹及全部内容颜色';return`<div class="menu-folder-label">${label}</div><div class="menu-color-group" role="group" aria-label="设置访达颜色">${finderColorOptions.map(option=>`<button type="button" class="menu-color-option" title="${option.label}" aria-label="设置为${option.label}" onclick="setFinderColor(${option.index}${targetCall})"><span class="finder-tag-dot ${option.color}" aria-hidden="true"></span></button>`).join('')}<button type="button" class="menu-color-option clear" title="移除颜色" aria-label="移除访达颜色" onclick="setFinderColor(null${targetCall})">×</button></div>`}
  function scrollKey(path){return path||'__case_root__'}
  function captureScrollPositions(){const columns=$('columns');if(columns)state.horizontalScroll=columns.scrollLeft;document.querySelectorAll('.column[data-column-path]').forEach(column=>{const list=column.querySelector('.column-list');if(list)state.scrollPositions.set(scrollKey(column.dataset.columnPath||''),list.scrollTop)})}
  function applyScrollPositions(){document.querySelectorAll('.column[data-column-path]').forEach(column=>{const list=column.querySelector('.column-list'),saved=state.scrollPositions.get(scrollKey(column.dataset.columnPath||''));if(list&&Number.isFinite(saved))list.scrollTop=saved});const columns=$('columns');if(columns)columns.scrollLeft=state.horizontalScroll}
  function restoreScrollPositions(){applyScrollPositions();requestAnimationFrame(applyScrollPositions)}
  async function loadColumn(path,index=0,focusPath=''){captureScrollPositions();const data=await api(`/api/case-manager/cases/${caseId}/local-files/list?path=${encodeURIComponent(path||'')}&show_hidden=${state.showHidden?'true':'false'}`);if(!path)$('appIcon').innerHTML=finderFolderIcon(data.folder_finder_tags);state.columns=state.columns.slice(0,index);state.columns.push({path:data.path,folderFinderTags:data.folder_finder_tags||[],items:data.items||[]});renderColumns();if(focusPath){const row=document.querySelector(`[data-path="${CSS.escape(focusPath)}"]`);row?.scrollIntoView({block:'nearest'})}requestAnimationFrame(()=>{const columns=$('columns');if(columns)columns.scrollLeft=columns.scrollWidth})}
  function renderColumns(){if(state.searchQuery)return renderSearchResults();captureScrollPositions();const host=$('workspace');host.innerHTML=`<div class="columns" id="columns">${state.columns.map((column,index)=>columnHtml(column,index)).join('')}</div>`;updateActions();restoreScrollPositions()}
  function columnHtml(column,index){const items=sorted(column.items);const rootName=state.binding?.real_path?.split('/').filter(Boolean).pop()||'案件文件夹',name=column.path?column.path.split('/').pop():rootName,fullPath=column.path?`${state.binding?.real_path||rootName}/${column.path}`:(state.binding?.real_path||rootName);return`<section class="column" data-column="${index}" data-column-path="${esc(column.path)}" style="--column-width:${columnWidth(column.path)}px"><header class="column-head" title="${esc(fullPath)}" oncontextmenu="openFolderContext(event,'${encodePath(column.path)}')"><span class="column-name">${esc(name)}${finderTagHtml(column.folderFinderTags)}</span><span>${items.length} 项</span></header><div class="column-list">${items.length?items.map(item=>rowHtml(item,index)).join(''):'<div class="empty"><span>此文件夹为空</span></div>'}</div><div class="column-resizer" data-column-path="${esc(column.path)}" title="拖动调整分栏宽度" role="separator" aria-orientation="vertical" aria-label="拖动调整分栏宽度"></div></section>`}
  function archiveStatusHtml(item){if(!archivePicker||item.is_directory)return'';const value=state.archiveStatuses[item.path];if(!value)return'';const label=value==='confirmed'?'已入卷':value==='excluded'?'不入卷':'待核对';return`<span class="archive-file-status ${esc(value)}">${label}</span>`}
  function rowHtml(item,index){const checked=state.selected.has(item.path),pathActive=state.columns[index+1]?.path===item.path,active=state.active?.path===item.path&&!pathActive,renaming=state.rename?.path===item.path,nameHtml=renaming?`<input class="inline-rename-input" data-inline-rename="1" value="${esc(item.name)}" maxlength="240" aria-label="重命名 ${esc(item.name)}" onclick="event.stopPropagation()" ondblclick="event.stopPropagation()" onkeydown="handleInlineRenameKey(event)">`:`<span class="file-name">${esc(item.name)}</span>`,encodedPath=encodePath(item.path);return`<div class="file-row ${checked?'checked':''} ${pathActive?'path-active':''} ${active?'active':''} ${renaming?'renaming':''}" draggable="${archivePicker||renaming?'false':'true'}" data-path="${esc(item.path)}" data-index="${index}" data-dir="${item.is_directory?'1':'0'}" title="${esc(item.name)}" onclick="selectItem(event,${index},'${encodedPath}')" ondblclick="openItem('${encodedPath}')" oncontextmenu="openContext(event,${index},'${encodedPath}')" ondragstart="dragStart(event,'${encodedPath}')" ondragover="dragOver(event)" ondragleave="this.classList.remove('drop-target')" ondrop="dropItem(event,'${encodedPath}',${item.is_directory?'true':'false'})">${item.is_symlink?icons.link:(item.is_directory?finderFolderIcon(item.finder_tags):icons.file)}${nameHtml}<span class="file-meta">${finderTagHtml(item.finder_tags)}${archiveStatusHtml(item)}${item.is_directory?'<span class="chevron">›</span>':esc(itemMeta(item))}</span></div>`}
  function findItem(index,path){return state.columns[index]?.items.find(item=>item.path===path)}
  function searchRowHtml(item){const active=state.active?.path===item.path,checked=state.selected.has(item.path),renaming=state.rename?.path===item.path,nameHtml=renaming?`<input class="inline-rename-input" data-inline-rename="1" value="${esc(item.name)}" maxlength="240" aria-label="重命名 ${esc(item.name)}" onclick="event.stopPropagation()" ondblclick="event.stopPropagation()" onkeydown="handleInlineRenameKey(event)">`:`<span class="search-row-name">${esc(item.name)}</span>`,encodedPath=encodePath(item.path);return`<div class="search-row ${checked?'checked':''} ${active?'active':''} ${renaming?'renaming':''}" data-path="${esc(item.path)}" title="${esc(item.path)}" onclick="selectSearchResult(event,'${encodedPath}')" ondblclick="openSearchResult('${encodedPath}')" oncontextmenu="openContext(event,-1,'${encodedPath}')">${item.is_symlink?icons.link:(item.is_directory?finderFolderIcon(item.finder_tags):icons.file)}<span class="search-row-copy">${nameHtml}<span class="search-row-path">${esc(parentPath(item.path)||'案件根目录')}</span></span><span class="search-row-kind">${finderTagHtml(item.finder_tags)}${archiveStatusHtml(item)}<span>${esc(item.kind||'')}</span></span></div>`}
  function renderSearchResults(){const host=$('workspace');const total=state.searchResults.length;host.innerHTML=`<div class="search-view"><header class="search-head"><span>“${esc(state.searchQuery)}” · ${total} 个结果${state.searchTruncated?'（仅显示前 200 项）':''}</span><span>${$('fuzzySearch').checked?'模糊搜索':'名称包含'}</span></header><div class="search-list">${total?state.searchResults.map(searchRowHtml).join(''):'<div class="empty"><span><strong>没有找到匹配项目</strong>请调整关键词或开启模糊搜索</span></div>'}</div></div>`;updateActions()}
  async function performSearch(resetSelection=false){const query=$('fileSearch').value.trim(),queryChanged=query!==state.searchQuery;state.searchQuery=query;if(!query){state.searchResults=[];state.searchTruncated=false;state.active=null;state.selected.clear();state.selectionAnchor=null;renderColumns();return}try{const result=await api(`/api/case-manager/cases/${caseId}/local-files/search?q=${encodeURIComponent(query)}&fuzzy=${$('fuzzySearch').checked?'true':'false'}&show_hidden=${state.showHidden?'true':'false'}`);if(query!==$('fileSearch').value.trim())return;state.searchResults=result.items||[];state.searchTruncated=!!result.truncated;if(queryChanged||resetSelection){state.active=null;state.selected.clear();state.selectionAnchor=null}else{const available=new Set(state.searchResults.map(item=>item.path));for(const path of state.selected.keys())if(!available.has(path))state.selected.delete(path);if(state.active&&!available.has(state.active.path))state.active=null}renderSearchResults()}catch(e){notify(e.message)}}
  function scheduleSearch(){clearTimeout(scheduleSearch.timer);scheduleSearch.timer=setTimeout(performSearch,280)}
  function selectWithModifiers(event,item,items,scope){const additive=event.metaKey||event.ctrlKey;if(event.shiftKey&&state.selectionAnchor?.scope===scope){const start=items.findIndex(entry=>entry.path===state.selectionAnchor.path),end=items.findIndex(entry=>entry.path===item.path);if(!additive)state.selected.clear();if(start>=0&&end>=0)items.slice(Math.min(start,end),Math.max(start,end)+1).forEach(entry=>state.selected.set(entry.path,entry));else state.selected.set(item.path,item)}else if(additive){state.selected.has(item.path)?state.selected.delete(item.path):state.selected.set(item.path,item);state.selectionAnchor={scope,path:item.path}}else{state.selected.clear();state.selected.set(item.path,item);state.selectionAnchor={scope,path:item.path}}const selected=[...state.selected.values()];state.active=state.selected.has(item.path)?item:(selected[selected.length-1]||null)}
  window.selectSearchResult=function(event,encoded){if(document.activeElement===$('fileSearch'))$('fileSearch').blur();const path=decodeURIComponent(encoded),item=state.searchResults.find(entry=>entry.path===path);if(!item)return;selectWithModifiers(event,item,state.searchResults,'search');syncSelectionClasses()}
  window.openSearchResult=function(encoded){const path=decodeURIComponent(encoded),item=state.searchResults.find(entry=>entry.path===path);if(!item)return;if(item.is_directory)return revealSearchResult(path);openItem(encoded)}
  async function revealSearchResult(path){const item=state.searchResults.find(entry=>entry.path===path);if(!item)return;state.searchQuery='';state.searchResults=[];$('fileSearch').value='';state.columns=[];state.selected.clear();state.active=null;await loadColumn('',0);const folderPath=item.is_directory?item.path:parentPath(item.path);let current='';for(const part of folderPath.split('/').filter(Boolean)){current=current?`${current}/${part}`:part;const parentIndex=state.columns.length-1;const folder=state.columns[parentIndex]?.items.find(entry=>entry.path===current);if(folder)state.active=folder;await loadColumn(current,parentIndex+1)}if(!item.is_directory){const visible=state.columns.at(-1)?.items.find(entry=>entry.path===item.path);if(visible){state.active=visible;state.selected.set(visible.path,visible);renderColumns();requestAnimationFrame(()=>document.querySelector(`[data-path="${CSS.escape(visible.path)}"]`)?.scrollIntoView({block:'nearest'}))}}}
  window.selectItem=async function(event,index,encoded){if(document.activeElement===$('fileSearch'))$('fileSearch').blur();const path=decodeURIComponent(encoded),item=findItem(index,path);if(!item)return;const items=sorted(state.columns[index]?.items||[]),scope=`column:${state.columns[index]?.path||''}`;selectWithModifiers(event,item,items,scope);if(item.is_directory||(!event.metaKey&&!event.ctrlKey&&!event.shiftKey)){state.columns=state.columns.slice(0,index+1);document.querySelectorAll('.column[data-column]').forEach(column=>{if(Number(column.dataset.column)>index)column.remove()})}syncSelectionClasses();if(item.is_directory)await loadColumn(item.path,index+1)}
  window.openItem=async function(encoded){const path=decodeURIComponent(encoded),item=state.columns.flatMap(c=>c.items).find(x=>x.path===path)||(state.active?.path===path?state.active:null);if(archivePicker&&item&&!item.is_directory){state.active=item;return previewActive()}if(item?.is_directory){if(state.searchQuery)return revealSearchResult(path);const index=state.columns.findIndex(c=>c.items.some(x=>x.path===path));return loadColumn(path,index+1)}try{await api(`/api/case-manager/cases/${caseId}/local-files/open`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path})});setTimeout(refreshColumns,700)}catch(e){notify(e.message)}}
  window.revealInFinder=async function(encoded){const path=encoded?decodeURIComponent(encoded):(state.active?.path||selectedItems()[0]?.path);if(!path)return notify('请先选择文件或文件夹');try{await api(`/api/case-manager/cases/${caseId}/local-files/reveal`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path})})}catch(e){notify(e.message)}}
  function closePreview(){$('previewMask').classList.remove('show');$('previewMask').setAttribute('aria-hidden','true');$('previewBody').replaceChildren()}
  async function previewActive(){if($('previewMask').classList.contains('show'))return closePreview();const item=state.active||selectedItems()[0];if(!item)return notify('请先选择要预览的文件或文件夹');$('previewTitle').textContent=item.name;$('previewBody').innerHTML='<div class="preview-unsupported">正在生成预览…</div>';$('previewMask').classList.add('show');$('previewMask').setAttribute('aria-hidden','false');try{const result=await api(`/api/case-manager/cases/${caseId}/local-files/preview`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:item.path})});$('previewTitle').textContent=result.name||item.name;if(result.preview_kind==='pdf')$('previewBody').innerHTML=`<iframe src="${esc(result.url)}#toolbar=0" title="${esc(result.name)}"></iframe>`;else if(result.preview_kind==='html_url')$('previewBody').innerHTML=`<iframe src="${esc(result.url)}" title="${esc(result.name)}"></iframe>`;else if(result.preview_kind==='image')$('previewBody').innerHTML=`<img src="${esc(result.url)}" alt="${esc(result.name)}">`;else if(result.preview_kind==='thumbnail')$('previewBody').innerHTML=`<img src="${result.data_url}" alt="${esc(result.name)}">`;else if(result.preview_kind==='html'){const frame=document.createElement('iframe');frame.title=result.name||item.name;frame.sandbox='allow-same-origin';$('previewBody').replaceChildren(frame);frame.srcdoc=result.content||''}else if(result.preview_kind==='text')$('previewBody').innerHTML=`<pre class="preview-text">${esc(result.content)}${result.truncated?'\n\n— 预览已截取前 2 MB —':''}</pre>`;else if(result.preview_kind==='folder')$('previewBody').innerHTML=`<div class="preview-folder">${icons.folder}<strong>${esc(result.name)}</strong><span>文件夹 · ${Number(result.item_count||0)} 项</span><span>修改日期 ${esc(formatDate(result.modified_at))}</span></div>`;else $('previewBody').innerHTML='<div class="preview-unsupported"><strong>暂时无法生成此文件的页面内预览</strong><br>仍可使用“打开”按钮调用默认应用。</div>'}catch(e){closePreview();notify(e.message)}}

  async function initialize(){if(!caseId){$('workspace').innerHTML='<div class="empty"><span><strong>缺少案件信息</strong>无法打开案件文件页面</span></div>';return}loadPreferences();try{state.binding=await api(`/api/case-manager/cases/${caseId}/folder-binding`);if(!state.binding.bound){$('folderPath').textContent='尚未绑定本地案件文件夹';setConnected(false,'未绑定');$('workspace').innerHTML=`<div class="unbound"><div class="hero"><div class="hero-icon">${icons.folder}</div><h2>连接本地案件文件夹</h2><p>文件仍保留在原来的 Mac 文件夹中。连接后可在这里分栏浏览、整理，并选择文件发起 AI增强。</p><div class="hero-actions"><button class="btn primary" onclick="chooseFolder()">选择文件夹</button></div></div></div>`;$('toolbar').style.display='none';return}$('toolbar').style.display='flex';$('folderPath').textContent=state.binding.real_path||'';setConnected(true,'实时同步');state.columns=[];state.selected.clear();await loadColumn('',0);startEvents()}catch(e){$('workspace').innerHTML=`<div class="empty"><span><strong>无法读取案件文件夹</strong>${esc(e.message)}</span></div>`;setConnected(false,'连接失败')}}
  $('archiveAssignBtn').onclick=()=>{if(!archivePicker)return;const paths=archiveSelectedPaths();if(!paths.length)return;const menu=$('archiveAssignmentMenu');if(menu.hidden){menu.innerHTML=(state.archiveCategories||[]).map(item=>`<button type="button" role="menuitem" data-code="${esc(item.code)}">${esc(item.name)}</button>`).join('')||'<button type="button" disabled>请先在归档清单中恢复可用类别</button>';menu.hidden=false;$('archiveAssignBtn').setAttribute('aria-expanded','true')}else{menu.hidden=true;$('archiveAssignBtn').setAttribute('aria-expanded','false')}};
  $('archiveAssignmentMenu').addEventListener('click',event=>{const item=event.target.closest('[data-code]');if(!item)return;const paths=archiveSelectedPaths();$('archiveAssignmentMenu').hidden=true;$('archiveAssignBtn').setAttribute('aria-expanded','false');parent.postMessage({type:'apex:archive-assign',version:1,caseId,paths,itemCode:item.dataset.code},location.origin)});
  document.addEventListener('pointerdown',event=>{if(!event.target.closest('.archive-picker-actions')){$('archiveAssignmentMenu').hidden=true;$('archiveAssignBtn').setAttribute('aria-expanded','false')}});
  addEventListener('message',event=>{if(!archivePicker||event.origin!==location.origin||event.source!==parent||Number(event.data?.caseId)!==caseId)return;if(event.data.type==='apex:archive-status'){state.archiveStatuses=event.data.statuses&&typeof event.data.statuses==='object'?event.data.statuses:{};state.archiveCategories=Array.isArray(event.data.categories)?event.data.categories:[];renderColumns()}else if(event.data.type==='apex:archive-clear-selection'){state.selected.clear();state.active=null;syncSelectionClasses()}});
  $('sortKey').onchange=()=>{state.sortKey=$('sortKey').value;savePreferences();renderColumns()};$('sortDirection').onclick=()=>{state.direction=state.direction==='asc'?'desc':'asc';$('sortDirection').textContent=state.direction==='asc'?'↑':'↓';$('sortDirection').title=state.direction==='asc'?'升序':'降序';savePreferences();renderColumns()};$('showHidden').onchange=async()=>{state.showHidden=$('showHidden').checked;savePreferences();await refreshColumns()};$('fileSearch').oninput=scheduleSearch;$('fuzzySearch').onchange=()=>{if($('fileSearch').value.trim())performSearch(true)};$('backBtn').onclick=()=>{if(state.searchQuery){$('fileSearch').value='';performSearch()}else if(state.columns.length>1){state.columns.pop();state.active=null;renderColumns()}};$('finderBtn').onclick=()=>api(`/api/case-manager/cases/${caseId}/folder-binding/open`,{method:'POST'}).catch(e=>notify(e.message));$('bindBtn').onclick=chooseFolder;$('openBtn').onclick=()=>{const item=selectedItems()[0];if(item)openItem(encodeURIComponent(item.path))};$('renameBtn').onclick=renameSelected;$('moveBtn').onclick=moveSelected;$('trashBtn').onclick=trashSelected;$('askBtn').onclick=prepareAI;
  function forwardCommandKey(eventType,repeat=false,code='',keyLocation=0){if(parent===window)return;parent.postMessage({type:'openPagesCommandKey',eventType,repeat:!!repeat,code,location:keyLocation},location.origin)}
  function isEditableTarget(target){return target instanceof Element&&!!target.closest('input,textarea,select,[contenteditable="true"]')}
  $('workspace').addEventListener('pointerdown',startColumnResize,true);$('workspace').addEventListener('pointerdown',startMarqueeSelection)
  document.addEventListener('pointerdown',event=>{if(!state.rename||event.target.closest?.('[data-inline-rename]'))return;if(event.target.closest?.('.column-resizer')){cancelInlineRename();event.stopImmediatePropagation();return}cancelInlineRename()},true)
  document.addEventListener('keydown',event=>{if(archivePicker){if(isEditableTarget(event.target))return;const key=event.key.toLowerCase();if((event.metaKey||event.ctrlKey)&&key==='a'){event.preventDefault();state.selected.clear();const items=state.searchQuery?state.searchResults:sorted(state.columns.at(-1)?.items||[]);items.filter(item=>!item.is_directory).forEach(item=>state.selected.set(item.path,item));state.active=items.find(item=>!item.is_directory)||null;syncSelectionClasses()}else if(event.key===' '&&state.active){event.preventDefault();previewActive()}else if(event.key==='Backspace'&&(state.searchQuery||state.columns.length>1)){event.preventDefault();if(state.searchQuery){$('fileSearch').value='';performSearch()}else{state.columns.pop();state.active=null;renderColumns()}}else if(event.key==='Escape'&&$('previewMask').classList.contains('show'))closePreview();else if(event.metaKey||event.ctrlKey)event.preventDefault();return}if(event.key==='Meta'){forwardCommandKey('down',event.repeat,event.code,event.location);return}if(event.metaKey)forwardCommandKey('cancel');if(isEditableTarget(event.target))return;const key=event.key.toLowerCase();if((event.metaKey||event.ctrlKey)&&key==='a'){event.preventDefault();state.selected.clear();const items=state.searchQuery?state.searchResults:sorted(state.columns.at(-1)?.items||[]);items.forEach(item=>state.selected.set(item.path,item));state.active=items[0]||null;syncSelectionClasses();notify(`已选择 ${items.length} 项`)}else if((event.metaKey||event.ctrlKey)&&key==='c'){event.preventDefault();copySelection('copy')}else if((event.metaKey||event.ctrlKey)&&key==='x'){event.preventDefault();copySelection('cut')}else if((event.metaKey||event.ctrlKey)&&key==='v'){event.preventDefault();pasteSelection()}else if((event.metaKey||event.ctrlKey)&&key==='z'&&event.shiftKey){event.preventDefault();redoAction()}else if((event.metaKey||event.ctrlKey)&&(key==='z'||key==='y')){event.preventDefault();key==='z'?undoAction():redoAction()}else if((event.metaKey||event.ctrlKey)&&key==='o'){event.preventDefault();if(state.active)openItem(encodeURIComponent(state.active.path))}else if(event.key===' '&&state.active){event.preventDefault();previewActive()}else if(event.key==='Enter'&&state.active){event.preventDefault();beginInlineRename()}else if(event.key==='Backspace'&&(state.searchQuery||state.columns.length>1)){event.preventDefault();if(state.searchQuery){$('fileSearch').value='';performSearch()}else{state.columns.pop();state.active=null;renderColumns()}}else if(event.key==='Escape'){document.querySelector('.menu')?.remove();if($('previewMask').classList.contains('show'))closePreview();else closeDialog()}},true);addEventListener('keyup',event=>{if(event.key==='Meta')forwardCommandKey('up',false,event.code,event.location)},true);addEventListener('blur',()=>{forwardCommandKey('blur');setTimeout(refreshColumns,250)});addEventListener('focus',()=>setTimeout(refreshColumns,250));addEventListener('beforeunload',()=>state.eventSource?.close());
  document.addEventListener('copy',event=>{if(archivePicker||isEditableTarget(event.target))return;event.preventDefault();copySelection('copy')});document.addEventListener('cut',event=>{if(archivePicker||isEditableTarget(event.target))return;event.preventDefault();copySelection('cut')});document.addEventListener('paste',event=>{if(archivePicker||isEditableTarget(event.target))return;event.preventDefault();pasteSelection()});
  initialize();
  if(archivePicker)parent.postMessage({type:'apex:archive-picker-ready',version:1,caseId},location.origin);
