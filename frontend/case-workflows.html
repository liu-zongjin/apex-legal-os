<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>事实核对与证据册</title>
<script src="/static/color-theme.js"></script><link rel="stylesheet" href="/static/apex-design-tokens.css"><link rel="stylesheet" href="/static/color-theme.css?v=12"><link rel="stylesheet" href="/static/apex-case-picker.css"><link rel="stylesheet" href="/static/case-workflows.css?v=1"><script src="/static/apex-case-picker.js"></script><script src="/static/apex-page-lifecycle.js"></script></head>
<body><main class="workflow-app"><header><div><p class="eyebrow">案件 / 办案工作台</p><h1>事实核对与证据册</h1><p class="note">原件只读，核对与编册成果独立保存，不改变案件状态。</p></div><button id="refresh" class="button" type="button">刷新任务</button></header>
<section class="panel case-bar"><div class="picker"><label for="caseSearch">案件</label><input id="caseSearch" type="search" autocomplete="off" placeholder="搜索案件名称或案号" aria-controls="caseResults" aria-expanded="false"><div id="caseResults" class="picker-results" role="listbox" hidden></div></div><div class="segmented" role="group" aria-label="办理事项"><button id="factMode" class="button" type="button" aria-pressed="true">事实核对</button><button id="bookMode" class="button" type="button" aria-pressed="false">证据册</button></div></section>
<div id="empty" class="panel empty-state">选择案件后，在案件文件里选择材料。</div><div id="work" hidden><div class="work-grid"><section class="panel materials"><h2>案件材料</h2><p class="note">多选文件后，选择用途。可直接预览原件；选择只影响本次任务。</p><iframe id="filePicker" title="选择案件材料"></iframe></section><section class="panel form"><h2 id="formTitle">交办事实核对</h2><div id="factForm"><label for="draft">文书草稿</label><textarea id="draft" rows="8" maxlength="40000" placeholder="粘贴需要核对的事实陈述，也可将案件内文件选作草稿。"></textarea><p id="draftFile" class="note"></p><button id="clearDraftFile" class="button small" type="button" hidden>移出草稿文件</button><h3>核对材料</h3><div id="sources"></div><p class="note">最多80条主张；逐条检索相关材料。AI分类只是初核，逐字引句经过存在性校验，语义仍须律师确认。</p><label class="consent"><input id="ocrConsent" type="checkbox">允许本次所选扫描件发送至已配置的云端OCR服务</label><p class="note">任务会将草稿和所选材料内容发送至当前配置的AI模型；不同意时请勿交办。</p></div><div id="bookForm" hidden><p class="note">按下列顺序编册，原件页数转换后据实生成。目录独立，不计入证据册页码。</p><div id="entries"></div><label class="consent"><input id="bookConfirmed" type="checkbox">我已核对材料顺序、证据名称及证明目的</label></div><button id="submit" class="button primary" type="button">交办事实核对</button></section></div><section class="panel"><h2>办理记录</h2><div id="tasks" class="task-list"></div></section><section id="detailPanel" class="panel" hidden><div id="detail"></div></section></div>
<div id="toast" role="status" aria-live="polite"></div></main><div id="preview" class="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="previewTitle"><header><h2 id="previewTitle">原文核对</h2><button id="closePreview" class="button" type="button">关闭</button></header><p id="previewQuote"></p><p class="note">请按标明的页段定位核对。Word等格式可能由浏览器下载，请在本机打开。</p><iframe id="sourcePreview" title="原始材料"></iframe><a id="sourceLink" target="_blank" rel="noopener">在新窗口打开原件</a></section></div><script src="/static/case-workflows.js?v=1"></script></body></html>
