<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/static/color-theme.js"></script><link rel="stylesheet" href="/static/apex-design-tokens.css?v=2026102501"><style>
body{margin:0;font:13px var(--apex-font-sans);background:var(--apex-surface-muted);color:var(--apex-text)}header{position:sticky;top:0;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px;background:var(--apex-surface-solid);border-bottom:1px solid var(--apex-border-subtle)}button{border:1px solid var(--apex-border-subtle);border-radius:var(--apex-radius-sm);background:var(--apex-surface-solid);color:var(--apex-text);padding:6px 12px;cursor:pointer}button:disabled{opacity:.4}button:focus-visible{outline:2px solid var(--apex-accent);outline-offset:2px}img{display:block;width:calc(100% - 20px);height:auto;margin:10px;background:white}#error{padding:12px;color:var(--apex-danger)}[hidden]{display:none}</style></head><body><header><button id="previous" type="button">上一页</button><span id="position" aria-live="polite"></span><button id="next" type="button">下一页</button></header><div id="error" role="status" hidden></div><img id="page" alt="原件页面"><script>
const config=__PAGE_CONFIG__,image=document.getElementById('page'),position=document.getElementById('position'),error=document.getElementById('error');
function render(){error.hidden=true;position.textContent=`原件第${config.page} / ${config.count}页`;document.getElementById('previous').disabled=config.page===1;document.getElementById('next').disabled=config.page===config.count;image.src=config.url+'&page='+config.page;}
image.onerror=()=>{error.textContent='原件页面读取失败，请检查材料是否变化后重新载入。';error.hidden=false;};document.getElementById('previous').onclick=()=>{config.page--;render();};document.getElementById('next').onclick=()=>{config.page++;render();};render();
</script></body></html>
