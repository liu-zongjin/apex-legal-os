<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>业务审批表生成工具</title>
  <link rel="stylesheet" href="/static/style.css?v=2026101601">
  <style>
    * { box-sizing: border-box; }
    :root {
      --ba-bg: #eef0f5;
      --ba-card-bg: rgba(255,255,255,0.70);
      --ba-card-border: rgba(255,255,255,0.75);
      --ba-shadow: 0 24px 60px rgba(40,40,80,0.10), inset 0 1px 0 rgba(255,255,255,0.85);
      --ba-panel-bg: rgba(255,255,255,0.55);
      --ba-panel-border: rgba(30,30,60,0.07);
      --ba-field-bg: rgba(255,255,255,0.92);
      --ba-field-border: rgba(30,30,60,0.10);
      --ba-text: #1e2430;
      --ba-muted: #8a90a2;
      --ba-accent: var(--kb-theme-primary, #8b1a1a);
      --ba-accent-soft: rgba(139,26,26,0.09);
      --ba-focus-ring: rgba(139,26,26,0.14);
    }
    body.dark-mode {
      --ba-bg: #0b0f1e;
      --ba-card-bg: rgba(22,28,48,0.66);
      --ba-card-border: rgba(255,255,255,0.08);
      --ba-shadow: 0 28px 70px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
      --ba-panel-bg: rgba(255,255,255,0.05);
      --ba-panel-border: rgba(255,255,255,0.09);
      --ba-field-bg: rgba(10,14,28,0.8);
      --ba-field-border: rgba(255,255,255,0.10);
      --ba-text: #e6e8f0;
      --ba-muted: #7c8498;
      --ba-accent: #f87171;
      --ba-accent-soft: rgba(248,113,113,0.12);
      --ba-focus-ring: rgba(248,113,113,0.18);
    }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--ba-bg);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-y: auto;
    }
    body {
      background:
        radial-gradient(1100px 760px at 10% -8%, rgba(139,26,26,0.12), transparent 60%),
        radial-gradient(860px 680px at 104% 4%, rgba(94,104,170,0.12), transparent 55%),
        linear-gradient(180deg, var(--ba-bg), #e6e8f0);
      background-attachment: fixed;
    }
    .page-wrapper {
      width: 100%;
      max-width: none;
      margin: 0 auto;
      padding: 20px clamp(24px, 3vw, 56px);
    }
    .header {
      background: linear-gradient(135deg, rgba(139,26,26,0.9) 0%, rgba(165,42,42,0.86) 100%);
      backdrop-filter: blur(6px) saturate(140%);
      -webkit-backdrop-filter: blur(6px) saturate(140%);
      color: white;
      padding: 14px 32px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(139, 26, 26, 0.22), inset 0 1px 0 rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.18);
    }
    .header h1 { margin: 0 0 6px 0; font-size: 22px; font-weight: 600; }
    .header p { margin: 0; opacity: 0.9; font-size: 13px; }
    .main-content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
      gap: 20px;
    }
    @media (max-width: 1200px) { .main-content { grid-template-columns: 1fr; } }
    .form-card {
      position: relative;
      background: var(--ba-card-bg);
      backdrop-filter: blur(22px) saturate(170%);
      -webkit-backdrop-filter: blur(22px) saturate(170%);
      border: 1px solid var(--ba-card-border);
      border-radius: 20px;
      padding: 26px 24px 24px;
      box-shadow: var(--ba-shadow);
    }
    .form-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background: radial-gradient(420px 160px at 0% 0%, rgba(255,255,255,0.55), transparent 60%);
      opacity: 0.6;
    }
    body.dark-mode .form-card::before {
      background: radial-gradient(420px 160px at 0% 0%, rgba(255,255,255,0.04), transparent 60%);
    }
    .form-card-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--ba-panel-border);
      position: relative;
    }
    .form-card h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ba-text);
      border: none;
      padding: 0;
    }
    .form-hint { font-size: 12px; color: var(--ba-muted); white-space: nowrap; }
    .form-group + .form-group { margin-top: 22px; }
    .form-group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.10em;
      color: var(--ba-muted);
      margin-bottom: 13px;
    }
    .form-group-title::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ba-accent);
      box-shadow: 0 0 0 3px var(--ba-accent-soft);
      flex-shrink: 0;
    }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; align-items: start; }
    @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
    .form-section { margin-bottom: 0; }
    .form-section.full-width { grid-column: 1 / -1; }
    .form-label {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 5px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ba-text);
      margin-bottom: 7px;
      letter-spacing: 0.01em;
      line-height: 1.4;
    }
    .form-label .required { color: var(--ba-accent); margin-left: 0; }
    .form-label .muted { font-weight: 400; font-size: 11.5px; color: var(--ba-muted); }
    .inline-note {
      margin-top: 8px;
      color: #a1632b;
      font-size: 11px;
      line-height: 1.4;
    }
    body.dark-mode .inline-note { color: #d9a05a; }
    .input-wrapper { position: relative; }
    .form-input {
      width: 100%;
      padding: 10px 13px;
      border: 1px solid var(--ba-field-border);
      border-radius: 12px;
      font-size: 13px;
      color: var(--ba-text);
      background: var(--ba-field-bg);
      transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
    }
    .form-input:focus {
      outline: none;
      border-color: rgba(139,26,26,0.45);
      background: rgba(255,255,255,0.98);
      box-shadow: 0 0 0 4px var(--ba-focus-ring);
    }
    .form-input::placeholder { color: var(--ba-muted); }
    .suggestions-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--ba-card-bg);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid var(--ba-panel-border);
      border-radius: 14px;
      margin-top: 6px;
      max-height: 210px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 16px 44px rgba(20,20,50,0.14);
      display: none;
    }
    .suggestions-dropdown.active { display: block; }
    .suggestion-item {
      padding: 9px 13px;
      cursor: pointer;
      font-size: 13px;
      color: var(--ba-text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--ba-panel-border);
      transition: background 0.15s;
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover { background: var(--ba-accent-soft); }
    .suggestion-item .name { color: var(--ba-text); }
    .selected-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .selected-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      padding: 4px 8px 4px 10px;
      border-radius: 999px;
      color: var(--ba-text);
      background: var(--ba-accent-soft);
      border: 1px solid rgba(139,26,26,0.18);
      font-size: 12px;
      line-height: 1.2;
    }
    .selected-tag button {
      width: 18px;
      height: 18px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--ba-muted);
      background: transparent;
      cursor: pointer;
      font-size: 15px;
      line-height: 18px;
    }
    .selected-tag button:hover { color: var(--ba-accent); background: rgba(139,26,26,0.10); }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--ba-panel-border);
      flex-wrap: wrap;
      position: relative;
    }
    .btn {
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #a02626 0%, #7a1717 100%);
      color: white;
      box-shadow: 0 8px 20px rgba(139,26,26,0.26);
    }
    .btn-primary:hover { background: linear-gradient(135deg, var(--kb-theme-primary, #8b1a1a) 0%, #6c1313 100%); }
    .btn-secondary {
      background: var(--ba-panel-bg);
      color: var(--ba-text);
      border: 1px solid var(--ba-panel-border);
    }
    .btn-secondary:hover { background: var(--ba-accent-soft); border-color: rgba(139,26,26,0.3); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .preview-card {
      position: relative;
      background: var(--ba-card-bg);
      backdrop-filter: blur(22px) saturate(170%);
      -webkit-backdrop-filter: blur(22px) saturate(170%);
      border: 1px solid var(--ba-card-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--ba-shadow);
    }
    .preview-card h2 {
      margin: 0;
      font-size: 16px;
      color: var(--ba-text);
      border: none;
      padding: 0;
    }
    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 28px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--ba-panel-border);
    }
    .preview-document {
      background: white;
      padding: 48px 44px 40px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      font-family: "SimSun", "宋体", serif;
      color: #000;
      max-height: 900px;
      overflow-y: auto;
    }
    /* ── 文书正文：与纸质审批表版式一致 ── */
    .doc-firm {
      text-align: center;
      font-size: 16pt;
      font-family: "SimSun", "宋体", serif;
      letter-spacing: 0.05em;
    }
    .doc-title {
      text-align: center;
      font-size: 26pt;
      font-weight: bold;
      font-family: "SimHei", "黑体", "Microsoft YaHei", sans-serif;
      margin-top: 18px;
      letter-spacing: 0.05em;
    }
    .doc-no {
      text-align: center;
      font-size: 12pt;
      margin: 20px 0 8px;
      font-family: "SimSun", "宋体", serif;
    }
    .approval-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .approval-table td {
      border: 1px solid #000;
      vertical-align: middle;
      text-align: center;
      font-family: "SimSun", "宋体", serif;
      font-size: 14pt;
      line-height: 1.7;
      padding: 4px 6px;
      word-break: break-all;
    }
    .approval-table .label-cell { font-weight: bold; }
    .approval-table .w-label { width: 18%; }
    .approval-table .w-no-value { width: 33%; }
    .approval-table .w-lawyer-label { width: 19%; }
    .approval-table .cell-left { text-align: left; }
    .approval-table .opinion-text {
      font-family: "KaiTi", "楷体", "STKaiti", serif;
      font-size: 12.5pt;
      text-align: left;
      line-height: 1.9;
      padding: 10px 12px;
    }
    .approval-table .opinion-text p { margin: 0; text-indent: 2em; }
    .approval-table .opinion-sign { text-align: right; text-indent: 0; margin-top: 6px; padding-right: 8px; }
    .doc-placeholder { font-weight: bold; font-size: 15pt; }
    .doc-placeholder-underline { font-weight: bold; font-size: 15pt; text-decoration: underline; }
    .doc-date {
      text-align: right;
      font-size: 14pt;
      margin-top: 14px;
      padding-right: 10px;
      font-family: "SimSun", "宋体", serif;
    }
    /* ── 黑夜模式 ── */
    body.dark-mode { background: var(--ba-bg); }
    body.dark-mode .preview-document { background: #0f172a; border-color: #334155; }
    body.dark-mode .preview-document .doc-firm,
    body.dark-mode .preview-document .doc-title,
    body.dark-mode .preview-document .doc-no,
    body.dark-mode .preview-document .doc-date,
    body.dark-mode .approval-table td { color: #e2e8f0; }
    body.dark-mode .approval-table td { border-color: #94a3b8; }
    /* 桌面端：表单与预览各自滚动；预览纸张固定为竖向 A4（210:297）。 */
    @media (min-width: 1201px) {
      html, body { height: 100%; overflow: hidden; }
      .page-wrapper {
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      .header { flex-shrink: 0; }
      .main-content {
        flex: 1 1 auto;
        height: auto;
        min-height: 620px;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
        grid-template-rows: 1fr;
      }
      .form-card {
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .preview-card {
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        display: grid;
        grid-template-rows: auto max-content;
        align-content: start;
      }
      .preview-card .preview-document {
        min-height: 0;
        max-height: none;
        overflow-y: auto;
        overscroll-behavior: contain;
        height: auto;
        width: 100%;
        max-width: none;
        justify-self: stretch;
        align-self: start;
        aspect-ratio: 210 / 297;
      }
    }
  </style>

<body>
  <div class="page-wrapper">
    <div class="header">
      <h1>业务审批表生成工具</h1>
      <p>立项用业务审批表 · 可从律师库、委托人库、对方当事人库和案由库快速带入</p>
    </div>

    <div class="main-content">
      <!-- 左侧表单 -->
      <div class="form-card">
<div class="appearance-note" id="appearance-document-note">律所名称或 Logo 尚未设置，文书对应位置将留空。请前往 <a href="/?settings=appearance" target="_top" onclick="if(window.parent!==window){event.preventDefault();window.parent.postMessage({type:'apex:open-appearance-settings'},location.origin)}">设置 → 外观与体验</a> 完善资料。</div>
        <div class="form-card-head">
          <h2>填写信息</h2>
          <span class="form-hint">填写即实时预览 · 一键导出</span>
        </div>

        <!-- 委托与代理信息 -->
        <section class="form-group">
          <div class="form-group-title">委托与代理信息</div>
          <div class="form-grid">
            <div class="form-section">
              <label class="form-label">委托人 <span class="required">*</span></label>
              <div style="position:relative">
                <input type="text" class="form-input" id="clientInput" placeholder="输入或选择委托人" autocomplete="off">
                <div id="clientSuggestions"></div>
              </div>
            </div>
            <div class="form-section">
              <label class="form-label">代理律师（承办律师）</label>
              <div class="input-wrapper">
                <input type="text" class="form-input" id="lawyerInput" placeholder="输入或选择代理律师" autocomplete="off">
                <div class="suggestions-dropdown" id="lawyerSuggestions"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- 当事人信息 -->
        <section class="form-group">
          <div class="form-group-title">当事人信息</div>
          <div class="form-grid">
            <div class="form-section full-width">
              <label class="form-label">其他当事人</label>
              <div class="input-wrapper">
                <input type="text" class="form-input" id="partyInput" placeholder="输入或选择其他当事人，回车添加，多方以「、」分隔" autocomplete="off">
                <div class="suggestions-dropdown" id="partySuggestions"></div>
              </div>
              <div class="selected-tags" id="selectedParties"></div>
            </div>
          </div>
        </section>

        <!-- 案件信息 -->
        <section class="form-group">
          <div class="form-group-title">案件信息</div>
          <div class="form-grid">
            <div class="form-section full-width">
              <label class="form-label">案由</label>
              <div class="input-wrapper">
                <input type="text" class="form-input" id="caseTypeInput" placeholder="输入或选择案由" autocomplete="off">
                <div class="suggestions-dropdown" id="caseTypeSuggestions"></div>
              </div>
            </div>
          </div>
        </section>

        <div class="form-tip">其余栏目（编号、收费、承办律师意见、利益冲突审查、审批人意见、备注等）均为固定内容，无需填写。</div>

        <div class="button-group">
          <button class="btn btn-primary" onclick="generateDocument()">
            <svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 2h7l3 3v9a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M10 2v3h3M5 6h6M5 9h6M5 12h4" stroke="currentColor" stroke-width="1.5"/></svg>
            生成Word文档
          </button>
          <button class="btn" id="saveToCaseButton" style="display:none" onclick="saveDocumentToCase()">保存到案件文件夹</button>
        </div>
      </div>

      <!-- 右侧预览 -->
      <div class="preview-card">
        <div class="preview-header">
          <h2>文档预览</h2>
        </div>
        <div class="preview-document" id="previewDocument"></div>
      </div>
    </div>
  </div>

  <script>
    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getInputValue(id) {
      return (document.getElementById(id)?.value || '').trim();
    }

    let optionsData = { lawyers: [], parties: [], caseTypes: [] };
    let selectedParties = [];

    function optionName(item) {
      return String(typeof item === 'string' ? item : (item?.name || '')).trim();
    }

    function uniqueNamedOptions(items) {
      const seen = new Set();
      return (items || []).map(item => {
        const name = optionName(item);
        return name ? { ...(typeof item === 'object' ? item : {}), name } : null;
      }).filter(item => item && !seen.has(item.name) && seen.add(item.name));
    }

    async function loadReferenceOptions() {
      const results = await Promise.allSettled([
        fetch('/api/suohan/options'),
        fetch('/api/case-manager/opponents?limit=2000'),
        fetch('/api/automated-filing/cause-dict')
      ]);
      const readJSON = async result => {
        if (result.status !== 'fulfilled' || !result.value.ok) return {};
        return result.value.json().catch(() => ({}));
      };
      const [suohan, opponents, officialCauses] = await Promise.all(results.map(readJSON));
      optionsData.lawyers = uniqueNamedOptions(suohan.lawyer || []);
      optionsData.parties = uniqueNamedOptions([...(opponents.items || []), ...(suohan.party || [])]);
      const official = (officialCauses.items || []).map(item => optionName(item)).filter(Boolean);
      optionsData.caseTypes = uniqueNamedOptions([...official, ...(suohan.caseType || [])]);
    }

    function closeSuggestions(dropdown) {
      dropdown?.classList.remove('active');
    }

    function bindSingleOptionPicker(input, dropdown, getItems, onSelect) {
      let matches = [];
      const showMatches = () => {
        const query = input.value.trim().toLocaleLowerCase();
        const items = getItems() || [];
        matches = query
          ? items.filter(item => optionName(item).toLocaleLowerCase().includes(query))
          : items;
        dropdown.innerHTML = matches.slice(0, 20).map((item, index) => `
          <div class="suggestion-item" data-index="${index}">
            <span class="name">${esc(optionName(item))}</span>
            ${item.phone ? `<span style="color:var(--ba-muted);font-size:11px">${esc(item.phone)}</span>` : ''}
          </div>
        `).join('');
        dropdown.classList.toggle('active', matches.length > 0);
      };
      input.addEventListener('focus', showMatches);
      input.addEventListener('click', showMatches);
      input.addEventListener('input', () => { showMatches(); renderPreview(); });
      input.addEventListener('blur', () => setTimeout(() => closeSuggestions(dropdown), 120));
      dropdown.addEventListener('mousedown', event => {
        const item = event.target.closest('.suggestion-item');
        if (!item) return;
        event.preventDefault();
        const option = matches[Number(item.dataset.index)];
        if (!option) return;
        onSelect(optionName(option));
        closeSuggestions(dropdown);
        renderPreview();
      });
    }

    function addParty(name) {
      const value = String(name || '').trim();
      if (value && !selectedParties.includes(value)) selectedParties.push(value);
      renderSelectedParties();
      document.getElementById('partyInput').value = '';
      closeSuggestions(document.getElementById('partySuggestions'));
      renderPreview();
    }

    function renderSelectedParties() {
      const container = document.getElementById('selectedParties');
      if (!container) return;
      container.innerHTML = selectedParties.map((name, index) => `
        <span class="selected-tag">${esc(name)}<button type="button" data-index="${index}" aria-label="移除${esc(name)}">×</button></span>
      `).join('');
    }

    function removeParty(index) {
      selectedParties.splice(index, 1);
      renderSelectedParties();
      renderPreview();
    }

    function setupPartyPicker() {
      const input = document.getElementById('partyInput');
      const dropdown = document.getElementById('partySuggestions');
      let matches = [];
      const showMatches = () => {
        const query = input.value.trim().toLocaleLowerCase();
        matches = query
          ? optionsData.parties.filter(item => optionName(item).toLocaleLowerCase().includes(query))
          : optionsData.parties;
        dropdown.innerHTML = matches.slice(0, 20).map((item, index) => `
          <div class="suggestion-item" data-index="${index}"><span class="name">${esc(optionName(item))}</span></div>
        `).join('');
        dropdown.classList.toggle('active', matches.length > 0);
      };
      input.addEventListener('focus', showMatches);
      input.addEventListener('click', showMatches);
      input.addEventListener('input', () => { showMatches(); renderPreview(); });
      input.addEventListener('keydown', event => {
        if (event.key !== 'Enter') return;
        event.preventDefault();
        input.value.split(/[、,，]/).map(item => item.trim()).filter(Boolean).forEach(addParty);
      });
      input.addEventListener('blur', () => setTimeout(() => closeSuggestions(dropdown), 120));
      dropdown.addEventListener('mousedown', event => {
        const item = event.target.closest('.suggestion-item');
        if (!item) return;
        event.preventDefault();
        const option = matches[Number(item.dataset.index)];
        if (option) addParty(optionName(option));
      });
      document.addEventListener('click', event => {
        if (!input.contains(event.target) && !dropdown.contains(event.target)) closeSuggestions(dropdown);
      });
      document.getElementById('selectedParties').addEventListener('click', event => {
        const button = event.target.closest('button[data-index]');
        if (button) removeParty(Number(button.dataset.index));
      });
    }

    function getAllParties() {
      const pending = getInputValue('partyInput').split(/[、,，]/).map(item => item.trim()).filter(Boolean);
      return [...new Set([...selectedParties, ...pending])];
    }

    function renderPreview() {
      const lawyer = getInputValue('lawyerInput');
      const client = getInputValue('clientInput');
      const party = getAllParties().join('、');
      const caseType = getInputValue('caseTypeInput');
      const lawyerText = lawyer ? esc(lawyer) : '律师库';
      const clientText = client ? esc(client) : '<span class="doc-placeholder">【委托人】</span>';
      const partyText = party ? esc(party) : '<span class="doc-placeholder-underline">【其他当事人】</span>';
      const matterText = caseType
        ? esc(caseType.endsWith('纠纷') ? caseType : `${caseType}纠纷`)
        : 'XX 纠纷';
      document.getElementById('previewDocument').innerHTML = `
        <div class="doc-firm">${esc(window.ApexAppearance?.profile.firm_name || "")}</div>
        <div class="doc-title">业务审批表</div>
        <div class="doc-no">（20　　）${esc(window.ApexAppearance?.profile.firm_code || "")}律　　字第　　　　　号</div>
        <table class="approval-table">
          <tr style="height:1.2cm;">
            <td class="label-cell w-label">完整编号</td>
            <td class="w-no-value"></td>
            <td class="label-cell w-lawyer-label">承办律师</td>
            <td>${lawyerText}</td>
          </tr>
          <tr style="height:1.4cm;">
            <td class="label-cell w-label">委托人</td>
            <td colspan="3">${clientText}</td>
          </tr>
          <tr style="height:2.2cm;">
            <td class="label-cell w-label">涉　　及<br>当　事　人</td>
            <td colspan="3">${partyText}</td>
          </tr>
          <tr style="height:1.4cm;">
            <td class="label-cell w-label">委托事项</td>
            <td colspan="3">${matterText}</td>
          </tr>
          <tr style="height:1.4cm;">
            <td class="label-cell w-label">收费</td>
            <td colspan="3">/</td>
          </tr>
          <tr style="height:3.6cm;">
            <td class="label-cell w-label">承办律师<br>意　　见</td>
            <td colspan="3" class="opinion-text">
              <p>本人保证委托事宜真实合法，并自愿承担因合同产生的一切法律责任。</p>
              <p>本人承诺，本人申请用章的全部纸质版文件与本人上传于律所 OA 系统的电子文件内容一致，如有不一致，本人自愿承担因此所产生的一切法律责任。</p>
              <p class="opinion-sign">承办律师：</p>
            </td>
          </tr>
          <tr style="height:2.0cm;">
            <td class="label-cell w-label">合规性利益冲<br>突审查确认</td>
            <td colspan="3">已预检确认无利冲</td>
          </tr>
          <tr style="height:2.0cm;">
            <td class="label-cell w-label">审　批　人<br>意　　见</td>
            <td colspan="3"></td>
          </tr>
          <tr style="height:1.9cm;">
            <td class="label-cell w-label">备　　注</td>
            <td colspan="3"></td>
          </tr>
        </table>
        <div class="doc-date">制表时间：　　　年　　月　　日</div>
      `;
    }

    async function generateDocument() {
      const data = {
        lawyer: getInputValue('lawyerInput'),
        clientName: getInputValue('clientInput'),
        otherParties: getAllParties().join('、'),
        caseType: getInputValue('caseTypeInput')
      };
      if (!data.clientName) { alert('请填写委托人'); return; }
      try {
        const response = await ApexDownloads.fetch('/api/business-approval/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (response.ok) {
          const blob = await response.blob();
          const url = ApexDownloads.objectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `业务审批表_${data.clientName}_${new Date().toISOString().slice(0,10).replace(/-/g,'')}.docx`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          window.URL.revokeObjectURL(url);
          recordDownload(a.download, 'document', '业务审批表');
        } else {
          const error = await response.json();
          alert('生成失败：' + (error.detail || '未知错误'));
        }
      } catch (e) {
        console.error('生成文档失败:', e);
        alert('生成失败，请检查网络连接');
      }
    }

    function recordDownload(name, category, source) { ApexDownloads.record(name, category, source); }

    async function saveDocumentToCase() {
      const caseId = Number(new URLSearchParams(location.search).get('case_id') || 0);
      const clientName = getInputValue('clientInput');
      if (!clientName) { alert('请先填写委托人'); return; }
      const data = {
        lawyer: getInputValue('lawyerInput'),
        clientName,
        otherParties: getAllParties().join('、'),
        caseType: getInputValue('caseTypeInput')
      };
      try {
        const response = await ApexDownloads.fetch(`/api/case-manager/cases/${caseId}/authorization-materials/business-approval`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || '保存失败');
        alert(`已保存到案件文件夹：${result.relative_path}`);
      } catch (e) { alert(e.message || '保存失败'); }
    }

    // 从案件上下文带入委托人、其他当事人与代理律师
    async function applyCurrentCaseContext() {
      const caseId = Number(new URLSearchParams(location.search).get('case_id') || 0);
      if (!caseId) return;
      try {
        const response = await fetch(`/api/case-manager/cases/${caseId}/authorization-material-context`);
        if (!response.ok) return;
        const context = await response.json();
        const client = String(context.client?.name || '').trim();
        const parties = String(context.opponents?.names || '').trim();
        const lawyers = (context.defaults?.selected_lawyers || []).map(x => (typeof x === 'string' ? x : x.name)).filter(Boolean).join('、');
        const caseType = String(context.case?.type || context.case?.case_type || '').trim();
        if (client && !getInputValue('clientInput')) {
          document.getElementById('clientInput').value = client;
          window.apexClientPicker?.setValue(client);
        }
        if (parties && !getAllParties().length) {
          selectedParties = parties.split(/[、,，]/).map(x => x.trim()).filter(Boolean);
          renderSelectedParties();
        }
        if (lawyers && !getInputValue('lawyerInput')) document.getElementById('lawyerInput').value = lawyers;
        if (caseType && !getInputValue('caseTypeInput')) document.getElementById('caseTypeInput').value = caseType;
        renderPreview();
      } catch (e) { console.warn('带入案件上下文失败:', e); }
    }

    document.addEventListener('DOMContentLoaded', async function () {
      if (Number(new URLSearchParams(location.search).get('case_id') || 0)) document.getElementById('saveToCaseButton').style.display = '';
      if (window.apexCurrentDarkMode?.()) document.body.classList.add('dark-mode');
      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'theme') {
          document.body.classList.toggle('dark-mode', e.data.dark);
        }
      });
      ['lawyerInput', 'clientInput', 'partyInput', 'caseTypeInput'].forEach(id => {
        document.getElementById(id).addEventListener('input', renderPreview);
      });
      if (window.ApexClientPicker) {
        window.apexClientPicker = ApexClientPicker.attach({
          input: '#clientInput',
          menu: '#clientSuggestions',
          mode: 'single',
          onChange: renderPreview,
        });
      }
      await loadReferenceOptions();
      bindSingleOptionPicker(
        document.getElementById('lawyerInput'),
        document.getElementById('lawyerSuggestions'),
        () => optionsData.lawyers,
        name => { document.getElementById('lawyerInput').value = name; }
      );
      setupPartyPicker();
      bindSingleOptionPicker(
        document.getElementById('caseTypeInput'),
        document.getElementById('caseTypeSuggestions'),
        () => optionsData.caseTypes,
        name => { document.getElementById('caseTypeInput').value = name; }
      );
      renderPreview();
      await applyCurrentCaseContext();
    });
  </script>
</body>
