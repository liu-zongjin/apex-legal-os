ea:focus{border-color:#69a6cf;box-shadow:0 0 0 3px rgba(67,142,192,.14)}.config input{min-width:180px;padding:10px}.workspace{padding:14px}.case-dock{position:sticky;top:12px;z-index:5;border:1px solid #dbe5ee;border-radius:14px;background:rgba(255,255,255,.96);box-shadow:0 12px 26px rgba(38,61,86,.1);backdrop-filter:blur(16px)}.case-top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 15px 9px}.case-title{font-size:14px;font-weight:700}.case-picker{position:relative;padding:0 15px}.case-search,.file-search{width:100%;padding:10px 12px}.case-results{position:absolute;top:42px;right:15px;left:15px;z-index:10;max-height:270px;overflow:auto;border:1px solid #d8e3ec;border-radius:12px;background:#fff;box-shadow:0 16px 32px rgba(39,61,84,.16)}.case-choice{display:flex;width:100%;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #eff2f5;border-radius:0;background:#fff;padding:11px 13px;text-align:left}.case-choice:last-child{border:0}.case-choice:hover{background:#f4f8fb}.case-choice strong,.case-choice small{display:block}.case-choice small{margin-top:3px;color:#74849a;font-weight:400}.binding{color:#738398;font-size:11px;white-space:nowrap}.binding.bound{color:#15805a}.selected-case{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px;border-radius:10px;background:#f0f7fb;padding:9px 10px}.selected-case strong,.selected-case span{display:block}.selected-case span{overflow:hidden;max-width:680px;color:#63768a;font-size:12px;text-overflow:ellipsis;white-space:nowrap}.case-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 15px 14px}.selection{flex:1;min-width:130px;color:#51657b;font-size:12px;font-weight:600}.divider{width:1px;height:20px;background:#dde5ed}.ocr-label{color:#65778c;font-size:12px;white-space:nowrap}.download-mode{display:flex;align-items:center;gap:6px;color:#65778c;font-size:12px;white-space:nowrap}.download-mode select{border:1px solid #dbe3ec;border-radius:8px;background:#fff;color:#1d2733;font:600 12px inherit;padding:5px 7px;outline:none;cursor:pointer}.inbox-search{margin-top:14px}.search-wrap{position:relative}.search-wrap::before{position:absolute;top:50%;left:13px;z-index:1;color:#8997a7;content:'⌕';font-size:18px;transform:translateY(-53%)}.file-search{padding-left:36px;background:#fbfcfe}.table-wrap{margin-top:12px;overflow:auto;border:1px solid #e5ebf1;border-radius:14px;background:#fff}table{width:100%;border-collapse:collapse;font-size:13px}th,td{height:58px;padding:9px 13px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:middle}th{height:42px;background:#fbfcfd;color:#738398;font-size:11px;font-weight:700;letter-spacing:.02em}tr:last-child td{border-bottom:0}tbody tr{transition:background .12s}tbody tr:hover{background:#f8fbfd}.doc-name{color:#26384b;font-weight:700;letter-spacing:.005em}.doc-meta{margin-top:3px;color:#8593a3;font-size:11px}.doc-note{max-width:360px;overflow:hidden;margin-top:3px;color:#27749e;font-size:11px;text-overflow:ellipsis;white-space:nowrap}.muted{color:#8593a3}.badge{display:inline-flex;align-items:center;max-width:180px;overflow:hidden;border-radius:999px;background:#eef5fb;padding:4px 8px;color:#48718d;font-size:11px;text-overflow:ellipsis;white-space:nowrap}.badge.new{background:#e6f5ec;color:#16815a}.badge.deleted{background:#fbe9e7;color:#b33d37;white-space:nowrap}.row-deleted .doc-name,.row-deleted td{color:#9aa7b4}.row-deleted .doc-name{text-decoration:line-through;text-decoration-color:#c4cdd6}.note-button{padding:5px 8px;border:1px solid #dce6ef;border-radius:8px;background:#fff;color:#63778c;font-size:11px}.note-button.has-note{border-color:#bcd8eb;background:#f0f8fc;color:#27749e}.empty{padding:44px!important;color:#7d8c9d;text-align:center}.note-overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(27,39,52,.26);backdrop-filter:blur(5px)}.note-dialog{width:min(460px,100%);border:1px solid rgba(255,255,255,.7);border-radius:18px;background:#fff;box-shadow:0 24px 64px rgba(20,33,48,.25)}.note-dialog header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:19px 20px 12px}.note-dialog h2{margin:0;color:#203040;font-size:17px;letter-spacing:-.02em}.note-dialog p{margin:4px 0 0;color:#78889a;font-size:12px}.note-dialog textarea{width:calc(100% - 40px);min-height:150px;margin:0 20px;padding:11px;resize:vertical;line-height:1.55}.note-dialog footer{display:flex;justify-content:flex-end;gap:9px;padding:15px 20px 19px}    @media(max-width:720px){.shell{padding:22px 14px}.head{display:block}.head button{margin-top:16px}.toolbar{align-items:flex-start}.case-dock{top:6px}.case-actions{align-items:flex-start}.divider{display:none}.ocr-label{width:100%}.table-wrap{border-radius:10px}table{min-width:720px}}
    .sync-progress{position:fixed;top:0;left:0;right:0;z-index:60;height:3px;overflow:hidden;pointer-events:none}.sync-progress::after{content:'';display:block;height:100%;width:35%;border-radius:2px;background:linear-gradient(90deg,rgba(23,105,170,0),#1769aa,rgba(23,105,170,0));animation:sync-slide 1.15s ease-in-out infinite}@keyframes sync-slide{0%{transform:translateX(-110%)}100%{transform:translateX(390%)}}
    .note-button{display:inline-block;max-width:220px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;white-space:nowrap}.preview-button{border:1px solid #bfd9ea;background:#f2f8fc;color:#28729b;font-size:11px;padding:5px 8px}.preview-button:hover:not(:disabled){background:#e7f3fa}.preview-dialog{width:min(1120px,calc(100vw - 48px));height:min(820px,calc(100vh - 48px));display:flex;flex-direction:column}.preview-frame{flex:1;width:calc(100% - 32px);margin:0 16px 16px;border:1px solid #e1e8ef;border-radius:10px;background:#f7f9fb}
    /* Desktop: align the working controls with the inbox header, not a nested card. */
    .shell{max-width:1500px;padding:28px 24px 52px}.head{gap:32px;margin-bottom:20px}.head-main{min-width:0}.title-row{display:flex;align-items:baseline;gap:14px}.mailbox-summary{display:flex;align-items:baseline;gap:7px;padding-left:14px;border-left:1px solid #d8e1ea;color:#536a82}.mailbox-summary strong{color:#33475b;font-size:13px}.mailbox-summary .small{white-space:nowrap}.head-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}.mailbox-actions{display:flex;align-items:center;gap:7px}.workspace{padding:0}.inbox-sticky-header{position:sticky;top:0;z-index:8;background:rgba(255,255,255,.98);box-shadow:0 10px 22px rgba(38,61,86,.05)}.inbox-sticky-header .case-dock{position:static;top:auto;z-index:auto;border:0;border-bottom:1px solid #edf1f5;border-radius:0;background:transparent;box-shadow:none}.case-picker{padding:0}.case-results{top:66px;right:0;left:0}.search-row{display:grid;grid-template-columns:minmax(360px,1fr) minmax(360px,1fr);gap:12px;padding:16px 20px 0}.search-field{min-width:0}.search-label{display:block;margin:0 0 6px;color:#60748a;font-size:11px;font-weight:700;letter-spacing:.02em}.search-row .field{height:42px}.search-row .search-wrap::before{left:13px}.selected-case{flex:0 1 390px;min-width:230px;margin:0;padding:8px 10px}.selected-case span{max-width:280px}.case-actions{gap:8px;padding:12px 20px 15px;border-top:1px solid #f1f4f7;margin-top:14px}.selection{flex:0 0 auto;margin-right:auto}.inbox-search{display:none}.table-wrap{margin:12px 20px 0}
    @media(max-width:850px){.search-row{grid-template-columns:1fr}.case-results{top:66px}.case-actions{align-items:flex-start}.selection{width:100%;margin-right:0}.selected-case{flex-basis:100%;max-width:none}.selected-case span{max-width:none}}
    @media(max-width:720px){.shell{padding:22px 14px}.head{display:block}.title-row{align-items:flex-start;flex-direction:column;gap:5px}.mailbox-summary{padding:0;border:0}.head-actions{justify-content:flex-start;flex-wrap:wrap;margin-top:16px}.mailbox-actions{flex-wrap:wrap}.inbox-sticky-header{top:6px}.search-row{gap:10px;padding:14px 14px 0}.case-actions{padding:11px 14px 14px;margin-top:12px}.table-wrap{margin:10px 14px 0}}

<body>
  <div id="sync-progress" class="sync-progress hidden" aria-hidden="true"></div>
  <main class="shell">
    <header class="head"><div class="head-main"><div class="eyebrow">APEX · 效率中心</div><div class="title-row"><h1>打印机扫描盘</h1><div id="inbox-header-summary" class="mailbox-summary hidden"><strong>001 信箱文件</strong><span class="small" id="fetched-at"></span></div></div><p>ApeosPort-V C5575 T2 · 信箱 001 · 只读取件</p></div><div class="head-actions"><button onclick="openOriginal()">在浏览器中打开扫描盘 ↗</button><div id="inbox-header-actions" class="mailbox-actions hidden"><button onclick="showSettings()">重新配置账号</button><button onclick="loadDocuments(true)">刷新</button><span class="status" id="status"></span></div></div></header>
    <section class="card" id="setup-card"><div class="toolbar"><div class="toolbar-title"><strong>连接设置</strong></div><span class="status" id="setup-status">正在检查配置…</span></div><div class="notice">扫描盘账号和密码仅保存到这台 Mac 的钥匙串，不会显示、写入 APEX 数据库或发送到浏览器以外的位置。注销并重新登录 APEX 不会清除它；只有重新配置或明确清除凭据时才会更新。</div><div class="config"><label>扫描盘账号<input id="username" autocomplete="username" placeholder="例如：机器管理员"></label><label>扫描盘密码<input id="password" type="password" autocomplete="current-password" placeholder="如设备无密码可留空"></label><button class="primary" onclick="saveSettings()">保存并连接</button></div></section>
    <section class="card hidden" id="inbox-card">
      <div class="inbox-sticky-header">
        <div class="workspace">
        <section class="case-dock"><div class="search-row"><div class="search-field case-picker"><label class="search-label" for="case-search">归入案件</label><input id="case-search" class="field case-search" type="search" autocomplete="off" placeholder="搜索案件名称、当事人或案号" oninput="renderCaseResults()" onfocus="renderCaseResults()"><div id="case-results" class="case-results hidden"></div></div><div class="search-field"><label class="search-label" for="file-search">筛选扫描件</label><div class="search-wrap"><input id="file-search" class="field file-search" type="search" autocomplete="off" placeholder="文件名、设备编号、扫描时间或备注" oninput="render()"></div></div></div><div class="case-actions"><span class="selection" id="selection-note">未选择文件</span><span class="status" id="case-status"></span><div id="selected-case" class="selected-case hidden"></div><button id="bind-folder" class="hidden" onclick="bindSelectedCase()">绑定本地文件夹</button><button id="import-case" onclick="importCase()">归入案件</button><span class="divider"></span><label class="ocr-label"><input type="checkbox" id="allow-ocr"> 允许必要时发送至 OCR 服务</label><button id="send-ai" onclick="sendToAi()">发送至 AI</button><label class="download-mode">下载为<select id="download-mode" title="选择下载到本机的形式"><option value="zip">压缩包 (.zip)</option><option value="files">独立文件</option></select></label><button id="download" class="primary" onclick="downloadSelected()">下载到本机</button></div></section>
        </div>
      </div>
      <div class="workspace">
        <div class="table-wrap"><table><thead><tr><th><input type="checkbox" id="select-all" onchange="toggleAll(this.checked)" aria-label="全选"></th><th>文件</th><th>扫描时间</th><th>页数</th><th>格式</th><th>在线预览</th><th>备注</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table></div>
      </div>
      <div class="notice">备注仅保存在 APEX 本机，可用于检索，不会写回或修改打印机信箱。取出时会转换为 PDF；APEX 不会删除设备端源文件。</div>
    </section>
  </main>
  <div id="note-overlay" class="note-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="note-title"><section class="note-dialog"><header><div><h2 id="note-title">添加备注</h2><p id="note-subtitle"></p></div><button aria-label="关闭备注" onclick="closeNote()">×</button></header><textarea id="note-editor" placeholder="记录案件关联、文件内容或后续处理事项…"></textarea><footer><button onclick="closeNote()">取消</button><button id="note-clear" onclick="clearNote()">清空</button><button id="note-save" class="primary" onclick="saveOpenNote()">保存备注</button></footer></section></div>
  <div id="preview-overlay" class="note-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="preview-title"><section class="note-dialog preview-dialog"><header><div><h2 id="preview-title">在线预览</h2><p id="preview-subtitle">正在从扫描盘读取 PDF…</p></div><button aria-label="关闭预览" onclick="closePreview()">×</button></header><iframe id="preview-frame" class="preview-frame" title="扫描件在线预览" onload="previewReady()"></iframe></section></div>
  <script>
    let items=[],cases=[],selectedCaseId=null,activeNoteId=null;
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const caseTitle=item=>item.title||item.case_name||`案件 ${item.id}`;
    async function api(path,options={}){const response=await fetch(path,options);if(!response.ok){const data=await response.json().catch(()=>({})),error=new Error(typeof data.detail==='string'?data.detail:'请求失败');error.detail=data.detail;error.status=response.status;throw error;}return response;}
    function selected(){return [...document.querySelectorAll('input[data-source]:checked:not(:disabled)')].map(node=>node.dataset.source);}
    function currentCase(){return cases.find(item=>Number(item.id)===Number(selectedCaseId))||null;}
    function syncSelection(){const n=selected().length;$('selection-note').textContent=n?`已选择 ${n} 个扫描件`:'未选择文件';['import-case','send-ai','download'].forEach(id=>$(id).disabled=!n);}
    function visibleItems(){const q=$('file-search').value.trim().toLocaleLowerCase();return q?items.filter(item=>[item.name,item.source_id,item.scanned_at,item.note,item.imported_to?.join(' ')].join(' ').toLocaleLowerCase().includes(q)):items;}
    function render(){const rows=$('rows'),shown=visibleItems();$('select-all').checked=false;if(!shown.length){rows.innerHTML='<tr><td colspan="8" class="empty">没有匹配的扫描件</td></tr>';syncSelection();return;}rows.innerHTML=shown.map(item=>{const deleted=item.status==='deleted';const preview=deleted?'<button class="preview-button" disabled title="该文件已从服务器端删除，无法预览">在线预览</button>':`<button class="preview-button" onclick="openPreview('${esc(item.source_id)}')">在线预览</button>`;const imported=item.imported_to?.length?`<span class="badge">${esc(item.imported_to.join('、'))}</span>`:'';const statusCell=deleted?`<span class="badge deleted">已从服务器端删除</span>${imported}`:(item.status==='new'?`<span class="badge new">新增</span>${imported}`:(imported||'<span class="muted">未导入</span>'));return `<tr class="${deleted?'row-deleted':''}"><td><input type="checkbox" data-source="${esc(item.source_id)}" ${deleted?'disabled':''} onchange="syncSelection()"></td><td><div class="doc-name">${esc(item.name)}</div><div class="doc-meta">设备文件 #${esc(item.source_id)}</div></td><td>${esc(item.scanned_at||'—')}</td><td>${item.pages??'—'}</td><td>${esc(item.compression||'—')}</td><td>${preview}</td><td><button class="note-button ${item.note?'has-note':''}" title="${esc(item.note||'添加备注')}" onclick="openNote('${esc(item.source_id)}')">${esc(item.note||'添加备注')}</button></td><td>${statusCell}</td></tr>`;}).join('');syncSelection();}
    function toggleAll(checked){document.querySelectorAll('input[data-source]:not(:disabled)').forEach(node=>node.checked=checked);syncSelection();}
    function setStatus(text,error=false){const node=$('status');node.textContent=text||'';node.className='status '+(error?'error':'ok');}
    function setCaseStatus(text,error=false){const node=$('case-status');node.textContent=text||'';node.className='status '+(error?'error':'ok');}
    function setSyncing(on){$('sync-progress').classList.toggle('hidden',!on);}
    async function loadDocuments(refresh=false){setSyncing(true);let showedSnapshot=false;if(!refresh){try{const snap=await (await api('/api/scanner-inbox/documents?snapshot=1')).json(),snapshotItems=snap.items||[];if(snapshotItems.length){items=snapshotItems;$('fetched-at').textContent=snap.fetched_at?`上次列表更新于 ${snap.fetched_at}`:'';render();setStatus('正在连接扫描盘，检查新增文件…');showedSnapshot=true;}}catch(error){}}else{setStatus('正在连接扫描盘，检查新增文件…');}try{const data=await (await api(`/api/scanner-inbox/documents${refresh?'?refresh=1':''}`)).json();items=data.items||[];$('fetched-at').textContent=data.fetched_at?`更新于 ${data.fetched_at}`:'';render();if(data.sync_error){setStatus(`无法连接扫描盘，已显示上次列表：${data.sync_error}`,true);}else{const hints=[];if(data.new_count>0)hints.push(`发现 ${data.new_count} 个新增文件`);if(data.deleted_count>0)hints.push(`${data.deleted_count} 个文件已从服务器端删除`);setStatus(hints.length?`已同步：${hints.join('，')}`:`已同步 ${items.length} 个文件`);}}catch(error){if(showedSnapshot)setStatus(`无法连接扫描盘：${error.message}`,true);else setStatus(error.message,true);}finally{setSyncing(false);}}
    async function loadCases(){try{const data=await (await api('/api/case-manager/cases?limit=300&status=active')).json(),raw=Array.isArray(data)?data:(data.items||[]);cases=(await Promise.all(raw.map(async item=>{try{return {...item,binding:await (await api(`/api/case-manager/cases/${item.id}/folder-binding`)).json()};}catch(_){return {...item,binding:{bound:false,available:false}};}}))).sort((a,b)=>caseTitle(a).localeCompare(caseTitle(b),'zh-CN'));renderSelectedCase();}catch(error){setCaseStatus(`无法读取案件：${error.message}`,true);}}
    function renderCaseResults(){const host=$('case-results'),q=$('case-search').value.trim().toLocaleLowerCase(),found=cases.filter(item=>[caseTitle(item),item.case_no,item.current_stage,item.case_type].join(' ').toLocaleLowerCase().includes(q)).slice(0,20);if(!q){host.classList.add('hidden');return;}host.classList.remove('hidden');host.innerHTML=found.length?found.map(item=>{const binding=item.binding||{},state=binding.bound?(binding.available!==false?'已绑定本地文件夹':'文件夹暂不可用'):'未绑定本地文件夹';return `<button class="case-choice" type="button" onclick="chooseCase(${Number(item.id)})"><span><strong>${esc(caseTitle(item))}</strong><small>${esc([item.case_no,item.current_stage,item.case_type].filter(Boolean).join(' · ')||'案件')}</small></span><span class="binding ${binding.bound&&binding.available!==false?'bound':''}">${esc(state)}</span></button>`}).join(''):'<div class="empty">没有找到匹配案件</div>';}
    function chooseCase(id){selectedCaseId=Number(id);$('case-search').value='';$('case-results').classList.add('hidden');renderSelectedCase();}
    function clearCase(){selectedCaseId=null;renderSelectedCase();$('case-search').focus();}
    function renderSelectedCase(){const host=$('selected-case'),item=currentCase(),bind=$('bind-folder');if(!item){host.classList.add('hidden');bind.classList.add('hidden');return;}const binding=item.binding||{},usable=binding.bound&&binding.available!==false;host.classList.remove('hidden');host.innerHTML=`<div><strong>${esc(caseTitle(item))}</strong><span>${usable?`已绑定：${esc(binding.real_path||binding.folder_path||'本地文件夹')}`:binding.bound?'已绑定的本地文件夹当前不可用':'尚未绑定本地文件夹'}</span></div><button type="button" onclick="clearCase()">更换</button>`;bind.classList.toggle('hidden',usable);}
    async function bindSelectedCase(){const item=currentCase();if(!item)return;const button=$('bind-folder');button.disabled=true;setCaseStatus('请选择该案件的本地文件夹…');try{const picked=await (await api(`/api/case-manager/cases/${item.id}/folder-binding/select`,{method:'POST'})).json();if(picked.cancelled){setCaseStatus('已取消选择');return;}item.binding=await (await api(`/api/case-manager/cases/${item.id}/folder-binding`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({folder_path:picked.folder_path})})).json();renderSelectedCase();setCaseStatus('已绑定本地文件夹');}catch(error){setCaseStatus(error.message,true);}finally{button.disabled=false;}}
    function openNote(sourceId){const item=items.find(value=>value.source_id===sourceId);if(!item)return;activeNoteId=sourceId;$('note-title').textContent=item.note?'编辑备注':'添加备注';$('note-subtitle').textContent=`${item.name} · 设备文件 #${item.source_id}`;$('note-editor').value=item.note||'';$('note-clear').classList.toggle('hidden',!item.note);$('note-overlay').classList.remove('hidden');setTimeout(()=>$('note-editor').focus(),30);}
    function closeNote(){activeNoteId=null;$('note-overlay').classList.add('hidden');}
    function openPreview(sourceId){const item=items.find(value=>value.source_id===sourceId);if(!item)return;$('preview-title').textContent='在线预览';$('preview-subtitle').textContent=`${item.name} · 正在从扫描盘临时读取 PDF`;$('preview-frame').src=`/api/scanner-inbox/preview/${encodeURIComponent(sourceId)}`;$('preview-overlay').classList.remove('hidden');}
    function previewReady(){if(!$('preview-overlay').classList.contains('hidden')&&$('preview-frame').src!=='about:blank')$('preview-subtitle').textContent='仅在本次页面预览中临时读取，未保存到本机';}
    function closePreview(){$('preview-frame').src='about:blank';$('preview-overlay').classList.add('hidden');}
    async function persistNote(note){if(!activeNoteId)return;const button=$('note-save');button.disabled=true;try{const data=await (await api('/api/scanner-inbox/notes',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_id:activeNoteId,note})})).json(),item=items.find(value=>value.source_id===activeNoteId);if(item)item.note=data.note;closeNote();render();setStatus(note?'备注已保存':'备注已清空');}catch(error){setStatus(error.message,true);}finally{button.disabled=false;}}
    function saveOpenNote(){persistNote($('note-editor').value);}
    function clearNote(){persistNote('');}
    function showSettings(){$('setup-card').classList.remove('hidden');$('inbox-card').classList.add('hidden');$('inbox-header-summary').classList.add('hidden');$('inbox-header-actions').classList.add('hidden');$('setup-status').textContent='请输入正确账号和密码后保存；保存前会先验证连接。';$('setup-status').className='status';setTimeout(()=>$('username').focus(),20);}
    async function saveSettings(){const username=$('username').value.trim(),password=$('password').value;if(!username)return alert('请填写扫描盘账号。');const button=document.querySelector('#setup-card button.primary');button.disabled=true;try{await api('/api/scanner-inbox/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});$('password').value='';await init();}catch(error){$('setup-status').textContent=error.message;$('setup-status').className='status error';}finally{button.disabled=false;}}
    async function importCall(destination){const source_ids=selected();if(!source_ids.length)return;setStatus('正在从扫描盘取出 PDF…');const body={source_ids,destination,allow_cloud_ocr:$('allow-ocr').checked};if(destination==='case')body.case_id=Number(selectedCaseId||0);return (await api('/api/scanner-inbox/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();}
    async function importCase(){const item=currentCase();if(!item)return setCaseStatus('请先搜索并选择案件。',true);if(!item.binding?.bound||item.binding.available===false)return setCaseStatus('请先为该案件绑定可用的本地文件夹。',true);try{const data=await importCall('case');setStatus(`已归入 ${data.items.length} 个文件`);await loadDocuments();}catch(error){setStatus(error.message,true);}}
    async function sendToAi(){try{const data=await importCall('ai');parent.postMessage({type:'scannerInboxAsk',sessionId:data.session_id,files:data.files||[]},location.origin);setStatus('已发送至 AI 增强');}catch(error){if(error.detail?.code==='OCR_CONSENT_REQUIRED'){setStatus('该扫描件为图片型 PDF，需要 OCR 才能发送至 AI。请先勾选“允许必要时发送至 OCR 服务”，再点击发送。',true);return;}setStatus(error.message,true);}}
    async function downloadSelected(){const sourceIds=selected();if(!sourceIds.length)return;const mode=$('download-mode').value;setStatus(mode==='files'?'正在取出 PDF…':'正在生成压缩包…');try{const response=await api('/api/scanner-inbox/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_ids:sourceIds,mode})});if(mode==='files'){const data=await response.json(),files=data.files||[];for(const item of files){const link=document.createElement('a');link.href=item.url;link.download=item.name;document.body.appendChild(link);link.click();link.remove();await new Promise(resolve=>setTimeout(resolve,120));}setStatus(`已开始下载 ${files.length} 个文件`);}else{const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='APEX扫描件.zip';link.click();setTimeout(()=>URL.revokeObjectURL(url),5000);setStatus('下载已开始');}await loadDocuments();}catch(error){setStatus(error.message,true);}}
    function openOriginal(){window.open('http://192.168.20.253/scan.htm','_blank','noopener');}
    async function init(){const data=await (await api('/api/scanner-inbox/status')).json();$('setup-card').classList.toggle('hidden',data.configured);$('inbox-card').classList.toggle('hidden',!data.configured);$('inbox-header-summary').classList.toggle('hidden',!data.configured);$('inbox-header-actions').classList.toggle('hidden',!data.configured);if(data.configured)await Promise.all([loadCases(),loadDocuments()]);else $('setup-status').textContent='尚未配置 001 信箱';}
    init().catch(error=>{$('setup-status').textContent=error.message;$('setup-status').className='status error';});
  </script>
</body></html>
