<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下载中心</title>
<link rel="stylesheet" href="/static/color-theme.css?v=11"><link rel="stylesheet" href="/static/apex-design-tokens.css?v=2"><link rel="stylesheet" href="/static/apex-case-picker.css?v=1"><link rel="stylesheet" href="/static/download-center.css?v=3">
<script src="/static/color-theme.js?v=7"></script><script src="/static/apex-page-lifecycle.js?v=1"></script><script src="/static/apex-case-picker.js?v=1"></script><script src="/static/apex-downloads.js?v=1"></script><script defer src="/static/download-center.js?v=3"></script></head>
<body><main class="dc-shell"><header class="dc-heading"><div class="dc-heading-copy"><h1>下载中心</h1><p>文件、案件与保存位置，一目了然。</p></div>
<section class="dc-summary" aria-label="下载概览"><button data-status="" class="selected"><b id="dc-total">0</b><span>全部</span></button><button data-status="active"><b id="dc-active">0</b><span>下载中</span></button><button data-status="partial"><b id="dc-failed">0</b><span>待处理</span></button><button data-status="unassigned"><b id="dc-unassigned">0</b><span>待关联案件</span></button></section>
<div class="dc-actions"><button id="dc-refresh" class="dc-icon-button" aria-label="刷新下载记录" title="刷新下载记录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.7-1L20 9M4 15l2.2 3A7 7 0 0 0 18 17"/></svg></button><button id="dc-court">阅卷任务 <span aria-hidden="true">↗</span></button><details class="dc-more"><summary aria-label="更多下载操作" title="更多下载操作"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></summary><div class="dc-more-menu"><button id="dc-clear">清理已完成记录</button><p>仅清理记录，保留实际文件</p></div></details></div></header>
<div class="dc-toolbar"><nav id="dc-filters" aria-label="下载来源"><button data-category="" class="selected">全部</button><button data-category="mail">邮箱附件</button><button data-category="invoice">发票</button><button data-category="court">一张网</button><button data-category="judicial">司法短信</button><button data-category="document">文书生成</button><button data-category="ai">AI增强</button><button data-category="export">其他</button></nav><label class="dc-search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="dc-search" type="search" aria-label="搜索文件、案件、来源或保存位置" placeholder="搜索文件、案件或位置"></label></div>
<p id="dc-notice" class="dc-notice" role="status"></p><section class="dc-list"><div class="dc-list-head"><h2 id="dc-title">全部下载</h2><span id="dc-count"></span></div><div id="dc-records" aria-live="polite"><div class="dc-empty">正在读取下载记录…</div></div></section><footer class="dc-pagination"><button id="dc-prev">上一页</button><span id="dc-page">第 1 页</span><button id="dc-next">下一页</button></footer><p class="dc-hint">案件材料需确认后才写入绑定文件夹；发票独立归集。历史浏览器记录若未保存路径，会明确标注位置未确认。</p></main></body></html>
