<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>下载中心</title>
  <link rel="stylesheet" href="/static/color-theme.css?v=11">
  <script src="/static/color-theme.js?v=7"></script>
  <style>
    :root{--ink:#172033;--muted:#697386;--line:#e7eaf0;--panel:#fff;--wash:#f6f8fb;--blue:#246bfd;--blue-wash:#eef4ff}
    *{box-sizing:border-box} body{margin:0;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--wash)}
    .shell{min-height:100vh;padding:36px clamp(20px,5vw,78px) 64px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{margin:0 0 7px;color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.08em}.heading h1{margin:0;font-size:28px;letter-spacing:-.04em}.heading p{margin:7px 0 0;color:var(--muted)}
    .clear{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 12px;color:var(--muted);cursor:pointer}.clear:hover{color:#c23838;border-color:#efcaca}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:28px}.summary-card{padding:17px 18px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.summary-card b{display:block;font-size:22px}.summary-card span{display:block;margin-top:3px;color:var(--muted);font-size:12px}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filter{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);padding:7px 13px;cursor:pointer}.filter.active{border-color:#cddcff;background:var(--blue-wash);color:var(--blue);font-weight:650}.section{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.section-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}.section-head h2{margin:0;font-size:15px}.section-head span{color:var(--muted);font-size:12px}.records{min-height:220px}.record{display:grid;width:100%;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 20px;border:0;border-bottom:1px solid #f0f2f5;background:transparent;color:inherit;text-align:left;cursor:pointer}.record:hover{background:#fafbfe}.record:last-child{border-bottom:0}.type-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--blue-wash);color:var(--blue);font-weight:750;font-size:11px}.record-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.record-meta{margin-top:2px;color:var(--muted);font-size:12px}.tag{border-radius:999px;background:#f2f4f7;padding:4px 8px;color:#5e6878;font-size:11px}.empty{display:grid;place-items:center;min-height:220px;padding:30px;text-align:center;color:var(--muted)}.empty-icon{margin:0 auto 12px;width:42px;height:42px;border-radius:13px;background:var(--blue-wash);display:grid;place-items:center;color:var(--blue)}.empty strong{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}.hint{margin:16px 2px;color:var(--muted);font-size:12px}
    @media(max-width:620px){.shell{padding:24px 16px}.heading{margin-bottom:22px}.heading h1{font-size:24px}.summary{grid-template-columns:1fr}.record{grid-template-columns:34px minmax(0,1fr)}.tag{display:none}.clear{font-size:12px;padding:7px 9px}}
    body.dark-mode{--ink:#e9edf5;--muted:#9ca7b9;--line:#293347;--panel:#161d2a;--wash:#101620;--blue-wash:#162c55} body.dark-mode .tag{background:#252e3e;color:#c2cbda} body.dark-mode .filter{color:var(--muted)}
  </style>
</head>
<body>
  <main class="shell">
    <div class="heading"><div><p class="eyebrow">APEX · FILES</p><h1>下载中心</h1><p>集中查看各项功能生成、导出或下载的文件。</p></div><button class="clear" onclick="clearRecords()">清空记录</button></div>
    <section class="summary"><div class="summary-card"><b id="total-count">0</b><span>全部下载</span></div><div class="summary-card"><b id="document-count">0</b><span>生成的文书</span></div><div class="summary-card"><b id="ai-count">0</b><span>AI 与其他导出</span></div></section>
    <nav class="filters" aria-label="下载分类"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="document">生成的文书</button><button class="filter" data-filter="ai">AI 增强</button><button class="filter" data-filter="invoice">发票中心</button><button class="filter" data-filter="export">其他导出</button></nav>
    <section class="section"><div class="section-head"><h2 id="list-title">全部文件</h2><span id="list-count">0 个文件</span></div><div id="records" class="records"></div></section>
    <p class="hint">仅保留本设备 APEX 内的下载记录；实际文件仍保存在浏览器或系统的下载位置。</p>
  </main>
  <script>
    const KEY='apex_download_center_records'; let filter='all';
    const names={all:'全部文件',document:'生成的文书',ai:'AI 增强',invoice:'发票中心',export:'其他导出'};
    const labels={document:'文书生成',ai:'AI 增强',invoice:'发票中心',export:'其他导出'};
    function records(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
    function time(value){const d=new Date(value);if(Number.isNaN(d))return '刚刚';const delta=Date.now()-d;if(delta<60000)return '刚刚';if(delta<86400000)return Math.floor(delta/3600000||1)+' 小时前';return d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})}
    function icon(r){return r.format||({document:'DOCX',ai:'AI',invoice:'ZIP',export:'FILE'}[r.category]||'FILE')}
    function render(){const all=records(),shown=filter==='all'?all:all.filter(r=>r.category===filter);document.getElementById('total-count').textContent=all.length;document.getElementById('document-count').textContent=all.filter(r=>r.category==='document').length;document.getElementById('ai-count').textContent=all.filter(r=>r.category==='ai'||r.category==='export').length;document.getElementById('list-title').textContent=names[filter];document.getElementById('list-count').textContent=shown.length+' 个文件';const el=document.getElementById('records');if(!shown.length){el.innerHTML='<div class="empty"><div><div class="empty-icon"><svg width="21" height="21" viewBox="0 0 18 18" fill="none"><path d="M9 2.5v8.2M5.8 7.8L9 11l3.2-3.2M3 11.8v2.1A1.6 1.6 0 004.6 15.5h8.8a1.6 1.6 0 001.6-1.6v-2.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><strong>这里还没有文件</strong><span>在 APEX 中完成一次下载或导出后，会显示在这里。</span></div></div>';return}el.innerHTML=shown.map(r=>'<button class="record" type="button" data-file-name="'+esc(r.name)+'" title="在访达中打开文件所在位置"><div class="type-icon">'+icon(r)+'</div><div><div class="record-name">'+esc(r.name||'未命名文件')+'</div><div class="record-meta">'+esc(r.source||'APEX')+' · '+time(r.createdAt)+'</div></div><span class="tag">'+(labels[r.category]||'导出')+'</span></button>').join('');el.querySelectorAll('[data-file-name]').forEach(button=>button.onclick=()=>openFileFolder(button.dataset.fileName))}
    async function openFileFolder(name){try{const response=await fetch('/api/download-center/open-folder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'无法打开文件夹');if(!data.found)alert('未能在默认下载目录定位该文件，已为你打开下载文件夹。')}catch(error){alert(error.message||'无法打开文件夹')}}
    function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}function clearRecords(){if(confirm('确定清空下载记录吗？不会删除已下载的文件。')){localStorage.removeItem(KEY);render()}}
    document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});window.addEventListener('storage',e=>{if(e.key===KEY)render()});render();
  </script>
</body>
</html>
