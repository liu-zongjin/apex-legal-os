<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下载中心</title>
<link rel="stylesheet" href="/static/color-theme.css?v=11"><link rel="stylesheet" href="/static/apex-design-tokens.css?v=2026102501"><link rel="stylesheet" href="/static/apex-case-picker.css?v=1"><link rel="stylesheet" href="/static/download-center.css?v=2026101904">
<script src="/static/color-theme.js?v=7"></script><script src="/static/apex-page-lifecycle.js?v=2026101601"></script><script src="/static/apex-case-picker.js?v=1"></script><script src="/static/apex-downloads.js?v=2026101903"></script><script defer src="/static/download-center.js?v=2026101904"></script>
</head>
<body><main class="dc-shell">
<header class="dc-heading">
  <div class="dc-heading-copy"><h1>下载中心<span class="dc-title-dot"></span></h1><p>文件有序，工作从容。</p></div>
  <section class="dc-summary" aria-label="下载概览">
    <button data-status="" class="selected"><b id="dc-total">0</b><span>全部记录</span></button>
    <button data-status="active"><b id="dc-active">0</b><span>下载中</span></button>
    <button data-status="partial"><b id="dc-failed">0</b><span>待处理</span></button>
    <button data-status="unassigned"><b id="dc-unassigned">0</b><span>待关联案件</span></button>
  </section>
  <div class="dc-actions"><button id="dc-refresh" class="dc-icon-button" aria-label="刷新下载记录" title="刷新"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg></button><button id="dc-analyze" class="dc-glass-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 3 7 7-9 9-7-7 9-9ZM5 12l-3 7 3 3 7-3M5 17l2 2M16 5l-6 6"/></svg><span>检查失效记录</span></button><details class="dc-more dc-menu"><summary aria-label="更多下载操作" title="更多操作"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></summary><div class="dc-menu-panel"><button id="dc-court"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 8 9-5 9 5M4 10h16M5 20h14M7 10v7m5-7v7m5-7v7"/></svg>阅卷任务<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg></button><button id="dc-clear"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></svg>移除已完成记录</button><p>仅移除记录，保留实际文件</p></div></details></div>
</header>
<div class="dc-workspace">
<aside class="dc-sidebar"><div class="dc-sidebar-title">文件分类<span>按来源浏览</span></div><nav id="dc-filters" aria-label="下载来源"><button data-category="" class="selected"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>全部下载</span></button><p class="dc-nav-caption">沟通与送达</p><button data-category="mail"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg><span>邮箱附件</span></button><button data-category="invoice"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h4"/></svg><span>发票</span></button><button data-category="court"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 8 9-5 9 5M4 10h16M5 20h14M7 10v7m5-7v7m5-7v7"/></svg><span>一张网</span></button><button data-category="judicial"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 0 1 18 0Z"/><path d="M7 9h8M7 13h5"/></svg><span>司法短信</span></button><p class="dc-nav-caption">案件与文书</p><button data-category="case"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="3"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18M10 12v3h4v-3"/></svg><span>案件管理</span></button><button data-category="archive"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="2"/><path d="M5 9v11h14V9M10 13h4"/></svg><span>案卷归档</span></button><button data-category="document"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6M8 13h8M8 17h6"/></svg><span>文书生成</span></button><button data-category="filing"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v4H8zM8 5H5v16h14V5h-3M8 12h8M8 16h5"/></svg><span>自动化立案</span></button><p class="dc-nav-caption">创作与工具</p><button data-category="ai"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></svg><span>AI 增强</span></button><button data-category="knowledge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C8 2 3 3 3 3v16s5-1 9 2c4-3 9-2 9-2V3s-5-1-9 2Zm0 0v16"/></svg><span>知识库</span></button><button data-category="calculator"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M8 6h8M8 11h1m6 0h1m-8 4h1m6 0h1m-8 4h1m6 0h1"/></svg><span>计算工具</span></button><button data-category="scanner"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8V3h12v5M6 16v5h12v-5"/><rect x="3" y="8" width="18" height="8" rx="2"/><path d="M16 12h1"/></svg><span>扫描件</span></button><button data-category="recording"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg><span>会议录音</span></button><button data-category="expenses"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 9h18M15 14h3M8 5V3"/></svg><span>团队费用</span></button><p class="dc-nav-caption">其他来源</p><button data-category="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg><span>设置与备份</span></button><button data-category="export"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2 2h9v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Zm0 0V5a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v2"/></svg><span>其他导出</span></button></nav><div class="dc-sidebar-foot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2 2h9v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Zm0 0V5a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v2"/></svg><span>文件保留在原保存位置</span></div></aside>
<div class="dc-content">
<div class="dc-commandbar">
<label class="dc-search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="dc-search" type="search" aria-label="搜索文件、案件、来源或保存位置" placeholder="搜索文件、案件或保存位置"></label>
<div class="dc-command-actions"><details id="dc-sort-menu" class="dc-menu dc-sort-menu"><summary aria-label="选择文件排序"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v16m-4-4 4 4 4-4M14 5h6M14 10h4M14 15h2"/></svg><span id="dc-sort-label">最新优先</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></summary><div class="dc-menu-panel"><p>文件排序</p><button data-sort="newest" class="selected">最新优先<span>↓</span></button><button data-sort="oldest">最早优先<span>↑</span></button><div class="dc-menu-divider"></div><button data-sort="largest">从大到小<span>↓</span></button><button data-sort="smallest">从小到大<span>↑</span></button></div></details><button id="dc-filter-toggle" aria-expanded="false" aria-controls="dc-options"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg><span>筛选</span><span id="dc-filter-count" hidden></span></button></div>
</div>
<section id="dc-options" class="dc-options" aria-label="大小与时间筛选" hidden>
<div class="dc-filter-group"><span class="dc-field-caption">文件大小 <small>MB</small></span><div class="dc-field-range"><input id="dc-min" type="number" min="0" step="any" aria-label="最小文件大小，MB" placeholder="最小不限"><span>—</span><input id="dc-max" type="number" min="0" step="any" aria-label="最大文件大小，MB" placeholder="最大不限"></div></div>
<div class="dc-filter-group"><span class="dc-field-caption">下载 / 生成日期</span><div class="dc-field-range"><input id="dc-from" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" aria-label="下载或生成开始日期"><span>—</span><input id="dc-to" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" aria-label="下载或生成结束日期"></div></div>
<div class="dc-filter-actions"><button id="dc-reset">重置</button><button id="dc-apply" class="dc-primary">应用筛选</button></div>
</section>
<section id="dc-analysis" class="dc-analysis" hidden aria-live="polite"><div class="dc-analysis-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 3 7 7-9 9-7-7 9-9ZM5 12l-3 7 3 3 7-3M5 17l2 2M16 5l-6 6"/></svg><strong>失效记录检查</strong><button id="dc-close-analysis" aria-label="收起检查结果">×</button></div><p id="dc-analysis-text"></p><div class="dc-analysis-actions"><button id="dc-show-missing">筛选失效记录</button><button id="dc-clean-missing" class="dc-primary">移除失效记录</button></div></section>
<p id="dc-notice" class="dc-notice" role="status"></p>
<section class="dc-list"><div class="dc-list-head"><div class="dc-list-caption"><h2 id="dc-title">全部下载</h2><span id="dc-count"></span></div><div class="dc-selection"><label><input id="dc-select-page" type="checkbox"><span>选择本页</span></label><span id="dc-selected-count">已选 0 个文件</span><button id="dc-trash" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></svg><span>移到废纸篓</span></button></div></div><div id="dc-records" aria-live="polite"><div class="dc-empty">正在读取下载记录…</div></div></section>
<footer class="dc-pagination"><button id="dc-prev" aria-label="上一页">←</button><span id="dc-page">第 1 页</span><button id="dc-next" aria-label="下一页">→</button></footer>
<p class="dc-hint">案件材料确认后存入绑定文件夹 · 发票独立归集 · 未确认保存位置的记录将单独标注</p>
</div></div></main></body></html>
