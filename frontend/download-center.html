<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下载中心</title>
<link rel="stylesheet" href="/static/color-theme.css?v=11"><link rel="stylesheet" href="/static/apex-design-tokens.css?v=2"><link rel="stylesheet" href="/static/apex-case-picker.css?v=1"><link rel="stylesheet" href="/static/download-center.css?v=2">
<script src="/static/color-theme.js?v=7"></script><script src="/static/apex-page-lifecycle.js?v=1"></script><script src="/static/apex-case-picker.js?v=1"></script><script src="/static/apex-downloads.js?v=1"></script><script defer src="/static/download-center.js?v=2"></script></head>
<body><main class="dc-shell"><header class="dc-heading"><div><p class="dc-eyebrow">STELLA · 文件与案件</p><h1>下载中心</h1><p>查看下载进度，核对文件用途、关联案件和保存位置。</p></div><div class="dc-actions"><button id="dc-refresh">刷新</button><button id="dc-clear">清理已完成记录</button><button id="dc-court">在线阅卷进度</button></div></header>
<section class="dc-summary" aria-label="下载概览"><button data-status=""><b id="dc-total">0</b><span>全部记录</span></button><button data-status="active"><b id="dc-active">0</b><span>正在获取</span></button><button data-status="partial"><b id="dc-failed">0</b><span>失败或待处理</span></button><button data-status="unassigned"><b id="dc-unassigned">0</b><span>案件材料待关联</span></button></section>
<div class="dc-toolbar"><input id="dc-search" aria-label="搜索下载记录" placeholder="搜索文件、案件、来源或保存位置"><nav id="dc-filters" aria-label="下载来源"><button data-category="" class="selected">全部</button><button data-category="mail">邮箱附件</button><button data-category="invoice">发票</button><button data-category="court">一张网</button><button data-category="judicial">司法短信</button><button data-category="document">文书生成</button><button data-category="ai">AI增强</button><button data-category="export">其他</button></nav></div>
<p id="dc-notice" class="dc-notice" role="status"></p><section class="dc-list"><div class="dc-list-head"><h2 id="dc-title">全部下载</h2><span id="dc-count"></span></div><div id="dc-records" aria-live="polite"><div class="dc-empty">正在读取下载记录…</div></div></section><footer class="dc-pagination"><button id="dc-prev">上一页</button><span id="dc-page">第 1 页</span><button id="dc-next">下一页</button></footer><p class="dc-hint">案件材料需确认后才写入绑定文件夹；发票独立归集。历史浏览器记录若未保存路径，会明确标注位置未确认。</p></main></body></html>
