<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>案卷归档工作台</title>
  <script src="/static/color-theme.js"></script>
  <link rel="stylesheet" href="/static/apex-design-tokens.css?v=2026102501">
  <link rel="stylesheet" href="/static/case-archive.css?v=20260930g">
  <link rel="stylesheet" href="/static/color-theme.css?v=12">
  <link rel="stylesheet" href="/static/apex-case-picker.css?v=1">
  <script src="/static/apex-case-picker.js?v=1"></script>
<script src="/static/apex-downloads.js?v=2026101903"></script></head>
<body>
  <div class="archive-app">
    <header class="archive-header">
      <div><p class="eyebrow">效率中心 / 案件</p><h1>案卷归档工作台</h1><p class="subline" id="caseLabel">选择案件后开始整理卷宗</p></div>
      <div class="header-actions"><button type="button" class="button" id="scanButton" disabled>重新扫描</button><button type="button" class="button" id="saveListButton" disabled>保存归档清单</button><button type="button" class="button primary" id="exportButton" disabled>生成电子案卷</button></div>
    </header>
    <section class="case-bar">
      <div class="picker"><label for="caseSearch">案件</label><input id="caseSearch" type="search" autocomplete="off" placeholder="搜索案件名称或案号" aria-controls="caseResults" aria-expanded="false"><div id="caseResults" class="picker-results" role="listbox" hidden></div></div>
      <div class="category-wrap"><span class="field-label">案卷类型</span><div id="categoryChoices" class="segmented" role="group" aria-label="案卷类型"></div></div>
      <div id="summary" class="summary"></div>
    </section>
    <main id="workspace" class="workspace"><div class="empty-state">选择案件后，这里会显示归档清单与可入卷材料。</div></main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <div id="modal" class="modal-backdrop" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="modal-actions"><button class="button" id="modalCancel" type="button">取消</button><button class="button primary" id="modalConfirm" type="button">确认</button></div></div></div>
  <script src="/static/case-archive.js?v=20261006"></script>
</body>
</html>
