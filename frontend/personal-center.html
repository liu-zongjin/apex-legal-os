<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>个人中心</title>
  <script>
    (function() {
      try {
        if ((localStorage.getItem('theme') === 'dark' || (localStorage.getItem('theme') !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches))) {
          document.documentElement.classList.add('dark-mode');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: var(--kb-theme-primary, #8b1a1a);
      --primary-weak: rgba(139, 26, 26, .08);
      --accent: #1f7a6f;
      --bg: #f6f7f9;
      --panel: #fff;
      --panel-soft: #fbfcfe;
      --border: #e3e7ef;
      --line: var(--border);
      --hover: var(--row-hover);
      --soft: var(--panel-soft);
      --text: #172033;
      --muted: #667085;
      --danger: #c2410c;
      --danger-bg: #fff7ed;
      --success: #14745f;
      --success-bg: #eaf7f2;
      --focus: rgba(139, 26, 26, .16);
      --shadow: 0 10px 30px rgba(20, 29, 46, .08);
      --glass: rgba(255, 255, 255, .72);
      --glass-strong: rgba(255, 255, 255, .88);
      --hairline: rgba(148, 163, 184, .26);
      --tab-tint: rgba(139, 26, 26, .10);
      --row-bg: rgba(255, 255, 255, .86);
      --row-hover: rgba(255, 255, 255, .96);
      --chart-line: var(--kb-theme-primary, #8b1a1a);
      --chart-cash: #b7791f;
      --chart-fund: #14745f;
      --chart-grid: #e8ecf3;
    }
    html.dark-mode,
    html.dark-mode body,
    body.dark-mode {
      --primary: #f0b8a2;
      --primary-weak: rgba(240, 184, 162, .13);
      --accent: #5eead4;
      --bg: #0f1724;
      --panel: #151c27;
      --panel-soft: #111827;
      --border: #2d3748;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --danger: #fb923c;
      --danger-bg: rgba(251, 146, 60, .13);
      --success: #6ee7b7;
      --success-bg: rgba(16, 185, 129, .13);
      --focus: rgba(240, 184, 162, .18);
      --shadow: 0 18px 42px rgba(0, 0, 0, .34);
      --glass: rgba(21, 28, 39, .78);
      --glass-strong: rgba(21, 28, 39, .92);
      --hairline: rgba(148, 163, 184, .20);
      --tab-tint: rgba(240, 184, 162, .12);
      --row-bg: rgba(23, 32, 45, .92);
      --row-hover: rgba(31, 42, 58, .98);
      --chart-line: #f0b8a2;
      --chart-cash: #d9a441;
      --chart-fund: #5eead4;
      --chart-grid: #2a3548;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 220px);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    html.dark-mode body, body.dark-mode {
      background: linear-gradient(180deg, #0c1422 0%, #0f1724 220px);
      color: var(--text);
      color-scheme: dark;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .shell { height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 18px 8px;
      background:
        radial-gradient(circle at 12% -40%, rgba(139, 26, 26, .10), transparent 34%),
        linear-gradient(180deg, rgba(255, 255, 255, .80), rgba(248, 250, 252, .62));
      border-bottom: 1px solid rgba(226, 232, 240, .64);
      backdrop-filter: blur(22px) saturate(1.45);
      -webkit-backdrop-filter: blur(22px) saturate(1.45);
      position: sticky;
      top: 0;
      z-index: 12;
    }
    html.dark-mode .topbar, body.dark-mode .topbar {
      background:
        radial-gradient(circle at 12% -40%, rgba(240, 184, 162, .10), transparent 34%),
        linear-gradient(180deg, rgba(21, 28, 39, .94), rgba(15, 23, 36, .88));
      border-bottom-color: rgba(148, 163, 184, .22);
    }
    .topbar .tabs { flex: 1; }
    .top-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .mobile-tab-toggle { display: none; }
    .btn.top-icon-btn {
      width: 38px;
      min-width: 38px;
      height: 38px;
      padding: 0;
      justify-content: center;
    }
    .top-icon-btn svg { width: 20px; height: 20px; }
    .lock-btn { color: var(--muted); }
    .lock-btn:hover { color: var(--primary); }
    .pc-settings-shell { position: relative; }
    .pc-settings-menu {
      position: absolute;
      top: calc(100% + 9px);
      right: 0;
      z-index: 80;
      width: 248px;
      padding: 8px;
      border: 1px solid rgba(214, 218, 225, .92);
      border-radius: 14px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 16px 42px rgba(15,23,42,.15);
      backdrop-filter: blur(24px) saturate(145%);
      -webkit-backdrop-filter: blur(24px) saturate(145%);
      transform-origin: top right;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-5px) scale(.985);
      transition: opacity .15s cubic-bezier(.2,.72,.2,1), transform .15s cubic-bezier(.2,.72,.2,1), visibility .15s;
    }
    .pc-settings-menu.show { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
    .pc-settings-menu-item {
      width: 100%;
      min-height: 54px;
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 9px 10px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: var(--text);
      text-align: left;
    }
    .pc-settings-menu-item:hover { border-color: rgba(139, 26, 26, .14); background: var(--primary-weak); }
    .pc-settings-menu-item svg { width: 18px; height: 18px; margin-top: 1px; color: var(--primary); }
    .pc-settings-menu-item strong { display: block; font-size: 13px; line-height: 1.45; }
    .pc-settings-menu-item small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    html.dark-mode .pc-settings-menu, body.dark-mode .pc-settings-menu { background: rgba(15, 23, 36, .94); border-color: rgba(148, 163, 184, .2); }
    .btn {
      height: 34px; border: 1px solid rgba(203, 213, 225, .74); border-radius: 10px;
      background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(248,250,252,.84)); color: var(--text); padding: 0 12px;
      display: inline-flex; align-items: center; gap: 6px;
      font-weight: 650;
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease, background .15s ease;
      box-shadow: 0 1px 0 rgba(255, 255, 255, .78) inset;
    }
    .btn:hover { border-color: #c8d0dc; box-shadow: 0 8px 18px rgba(20, 29, 46, .08), 0 1px 0 rgba(255, 255, 255, .9) inset; }
    .btn:active { transform: translateY(1px); }
    .btn.primary {
      background: linear-gradient(180deg, #a51d22, #841519);
      color: #fff;
      border-color: rgba(139, 26, 26, .86);
      box-shadow: 0 10px 22px rgba(139, 26, 26, .20), inset 0 1px 0 rgba(255,255,255,.18);
    }
    .btn.danger { color: #9f1717; border-color: rgba(239, 209, 209, .9); background: linear-gradient(180deg, #fff, #fff7f7); }
    .btn.ghost { background: transparent; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .main { flex: 1; overflow: auto; padding: 12px 18px 24px; }
    .tabs {
      display: flex;
      gap: 5px;
      padding: 5px;
      background:
        linear-gradient(180deg, rgba(241, 245, 249, .76), rgba(226, 232, 240, .54));
      border: 1px solid rgba(203, 213, 225, .62);
      border-radius: 16px;
      width: fit-content;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.68),
        0 12px 34px rgba(15, 23, 42, .08);
      min-width: 0;
      overflow: visible;
      backdrop-filter: blur(24px) saturate(1.5);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
    }
    .income-tab-shell, .deposit-tab-shell { position: relative; }
    .income-tab-shell .tab, .deposit-tab-shell .tab { width: 100%; }
    .income-tab-chevron, .deposit-tab-chevron { width: 14px; height: 14px; margin-left: -2px; transition: transform .16s ease; }
    .income-tab-shell.open .income-tab-chevron, .deposit-tab-shell.open .deposit-tab-chevron { transform: rotate(180deg); }
    .income-view-menu, .deposit-view-menu {
      position: absolute;
      top: calc(100% + 9px);
      left: 0;
      z-index: 82;
      width: 228px;
      padding: 8px;
      border: 1px solid rgba(214, 218, 225, .92);
      border-radius: 14px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 16px 42px rgba(15,23,42,.15);
      backdrop-filter: blur(24px) saturate(145%);
      -webkit-backdrop-filter: blur(24px) saturate(145%);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-5px) scale(.985);
      transform-origin: top left;
      transition: opacity .15s cubic-bezier(.2,.72,.2,1), transform .15s cubic-bezier(.2,.72,.2,1), visibility .15s;
    }
    .income-view-menu.show, .deposit-view-menu.show { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
    .income-view-menu-title, .deposit-view-menu-title { padding: 4px 9px 7px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .income-view-menu-item, .deposit-view-menu-item { width: 100%; padding: 9px 10px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: var(--text); text-align: left; font-size: 13px; }
    .income-view-menu-item:hover, .income-view-menu-item.active, .deposit-view-menu-item:hover, .deposit-view-menu-item.active { color: var(--primary); border-color: rgba(139, 26, 26, .14); background: var(--primary-weak); }
    html.dark-mode .income-view-menu, body.dark-mode .income-view-menu, html.dark-mode .deposit-view-menu, body.dark-mode .deposit-view-menu { background: rgba(15, 23, 36, .94); border-color: rgba(148, 163, 184, .2); }
    .tab {
      height: 36px;
      padding: 0 14px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: rgba(51, 65, 85, .78);
      font-weight: 720;
      white-space: nowrap;
      transition: background .18s ease, box-shadow .18s ease, color .18s ease, transform .18s ease;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .tab::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: rgba(100, 116, 139, .36);
      box-shadow: 0 0 0 4px rgba(100, 116, 139, .08);
      flex: 0 0 auto;
    }
    .tab[data-tab="deposits"]::before { background: #9a6700; box-shadow: 0 0 0 4px rgba(154, 103, 0, .11); }
    .tab[data-tab="income"]::before { background: #14745f; box-shadow: 0 0 0 4px rgba(20, 116, 95, .12); }
    .tab:hover { color: #263244; background: rgba(255, 255, 255, .42); }
    .tab.active {
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,248,248,.90));
      color: var(--primary);
      box-shadow:
        0 10px 24px rgba(139, 26, 26, .12),
        0 1px 0 rgba(255,255,255,.92) inset,
        0 0 0 1px rgba(139, 26, 26, .08) inset;
    }
    .tab.active::before { transform: scale(1.08); box-shadow: 0 0 0 5px rgba(139, 26, 26, .12); }
    .panel {
      background: var(--panel);
      border: 1px solid rgba(226, 232, 240, .82);
      border-radius: 18px;
      box-shadow: 0 18px 44px rgba(20, 29, 46, .07);
      padding: 18px;
      min-height: calc(100vh - 110px);
    }
    .empty { text-align: center; color: var(--muted); padding: 34px 12px; font-size: 13px; }

    /* ── 门禁验证层 ─────────────────────────── */
    .gate {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(ellipse at 18% 8%, rgba(139, 26, 26, .14), transparent 44%),
        radial-gradient(ellipse at 84% 92%, rgba(31, 122, 111, .10), transparent 42%),
        linear-gradient(180deg, rgba(248, 250, 252, .94), rgba(240, 243, 248, .96));
      backdrop-filter: blur(26px) saturate(1.4);
      -webkit-backdrop-filter: blur(26px) saturate(1.4);
    }
    .gate[hidden] { display: none; }
    html.dark-mode .gate, body.dark-mode .gate {
      background:
        radial-gradient(ellipse at 18% 8%, rgba(240, 184, 162, .10), transparent 44%),
        radial-gradient(ellipse at 84% 92%, rgba(94, 234, 212, .07), transparent 42%),
        linear-gradient(180deg, rgba(12, 20, 34, .96), rgba(15, 23, 36, .97));
    }
    .gate-card {
      width: min(400px, 92vw);
      padding: 34px 32px 30px;
      border: 1px solid rgba(203, 213, 225, .72);
      border-radius: 22px;
      background: rgba(255, 255, 255, .92);
      box-shadow:
        0 30px 70px rgba(20, 29, 46, .18),
        0 1px 0 rgba(255, 255, 255, .9) inset;
      text-align: center;
    }
    html.dark-mode .gate-card, body.dark-mode .gate-card {
      background: rgba(21, 28, 39, .92);
      border-color: rgba(45, 55, 72, .9);
      box-shadow: 0 30px 70px rgba(0, 0, 0, .45), 0 1px 0 rgba(255,255,255,.05) inset;
    }
    .gate-lock {
      width: 62px;
      height: 62px;
      margin: 0 auto 14px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: linear-gradient(160deg, #a51d22, #6f1317);
      box-shadow: 0 14px 30px rgba(139, 26, 26, .28), inset 0 1px 0 rgba(255,255,255,.22);
    }
    .gate-card h1 { font-size: 21px; letter-spacing: .02em; }
    .gate-card .gate-sub { margin-top: 6px; color: var(--muted); font-size: 12.5px; line-height: 1.6; }
    .gate-form { margin-top: 22px; display: grid; gap: 12px; text-align: left; }
    .gate-field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 680; }
    .gate-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      border: 1px solid rgba(203, 213, 225, .85);
      border-radius: 12px;
      background: var(--panel-soft);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .gate-input-wrap:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus);
    }
    .gate-input-wrap svg { margin-left: 12px; margin-right: 10px; flex: 0 0 auto; color: var(--muted); }
    .gate-input-wrap input {
      flex: 1;
      min-width: 0;
      height: 42px;
      padding: 0 12px;
      border: 0;
      background: transparent;
      color: var(--text);
      outline: none;
      font-size: 14px;
      letter-spacing: .04em;
    }
    .gate-input-wrap input::placeholder { color: var(--muted); opacity: .7; }
    .gate-eye {
      margin-right: 8px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 6px;
      border-radius: 8px;
      display: inline-flex;
    }
    .gate-eye:hover { color: var(--text); background: var(--panel); }
    .gate-error {
      display: none;
      padding: 9px 12px;
      border: 1px solid rgba(194, 65, 12, .28);
      border-radius: 10px;
      background: var(--danger-bg);
      color: var(--danger);
      font-size: 12px;
      line-height: 1.55;
    }
    .gate-error.show { display: block; }
    .gate-actions { margin-top: 4px; display: grid; gap: 10px; }
    .gate-btn {
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(139, 26, 26, .86);
      background: linear-gradient(180deg, #a51d22, #841519);
      color: #fff;
      font-weight: 720;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 22px rgba(139, 26, 26, .20), inset 0 1px 0 rgba(255,255,255,.18);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }
    .gate-btn:hover { filter: brightness(1.06); box-shadow: 0 14px 30px rgba(139, 26, 26, .26), inset 0 1px 0 rgba(255,255,255,.18); }
    .gate-btn:active { transform: translateY(1px); }
    .gate-btn.secondary {
      background: transparent;
      border-color: rgba(203, 213, 225, .8);
      color: var(--text);
      box-shadow: none;
    }
    .gate-btn.secondary:hover { border-color: #c8d0dc; box-shadow: 0 8px 18px rgba(20, 29, 46, .08); filter: none; }
    .gate-biometric {
      height: 46px;
      border-radius: 12px;
      border: 1px solid rgba(31, 122, 111, .4);
      background: linear-gradient(180deg, rgba(234,247,242,.9), rgba(224,242,236,.8));
      color: #14745f;
      font-weight: 720;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      box-shadow: 0 8px 20px rgba(20, 116, 95, .12), inset 0 1px 0 rgba(255,255,255,.6);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .gate-biometric:hover { box-shadow: 0 12px 26px rgba(20, 116, 95, .18), inset 0 1px 0 rgba(255,255,255,.6); }
    .gate-biometric:active { transform: translateY(1px); }
    .gate-biometric:disabled { opacity: .5; cursor: not-allowed; }
    html.dark-mode .gate-biometric, body.dark-mode .gate-biometric {
      background: rgba(20, 116, 95, .14);
      border-color: rgba(94, 234, 212, .28);
      color: #6ee7b7;
    }
    .gate-foot { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .gate-foot .hint { color: var(--muted); font-size: 11.5px; text-align: left; line-height: 1.55; }
    .gate-foot button { border: 0; background: transparent; color: var(--primary); font-weight: 700; font-size: 12px; white-space: nowrap; }
    .gate-setup-note {
      margin-top: 4px;
      padding: 10px 12px;
      border: 1px solid rgba(154, 103, 0, .26);
      border-radius: 10px;
      background: rgba(255, 251, 235, .8);
      color: #6b4f12;
      font-size: 12px;
      line-height: 1.6;
      text-align: left;
    }
    html.dark-mode .gate-setup-note, body.dark-mode .gate-setup-note {
      background: rgba(154, 103, 0, .11);
      border-color: rgba(226, 185, 89, .24);
      color: #f0d48b;
    }
    .gate-spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: pc-spin .8s linear infinite;
    }
    @keyframes pc-spin { to { transform: rotate(360deg); } }

    /* ── 摘要卡片 ───────────────────────────── */
    .pc-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 14px; }
    .pc-summary-card {
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: linear-gradient(180deg, var(--panel-soft), var(--panel));
      box-shadow: 0 6px 18px rgba(20, 29, 46, .05);
      position: relative;
      overflow: hidden;
    }
    .pc-summary-card::after {
      content: '';
      position: absolute;
      right: -26px;
      top: -26px;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--primary-weak);
      pointer-events: none;
    }
    .pc-summary-card span { color: var(--muted); font-size: 12px; font-weight: 650; display: inline-flex; align-items: center; gap: 6px; }
    .pc-summary-card strong {
      display: block;
      margin-top: 7px;
      font-size: 25px;
      font-variant-numeric: tabular-nums;
      letter-spacing: .01em;
    }
    .pc-summary-card.hero { background: linear-gradient(155deg, rgba(255,255,255,.92), rgba(255,248,248,.94)); border-color: rgba(139, 26, 26, .16); }
    .pc-summary-card.hero strong { font-size: 28px; color: var(--primary); }
    .pc-summary-card small { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; font-weight: 500; }
    html.dark-mode .pc-summary-card.hero, body.dark-mode .pc-summary-card.hero { background: linear-gradient(155deg, rgba(21,28,39,.9), rgba(28,20,22,.92)); }
    @media (max-width: 900px) {
      .pc-summary { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
      .pc-summary-card strong { font-size: 21px; }
      .pc-summary-card.hero strong { font-size: 23px; }
    }
    .pc-chart-tooltip {
      position: fixed;
      z-index: 40;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 7px 11px;
      border-radius: 8px;
      background: rgba(23, 37, 51, .93);
      color: #fff;
      font-size: 11.5px;
      pointer-events: none;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .22);
      white-space: nowrap;
    }
    .pc-chart-tooltip[hidden], .pc-quick-panel[hidden] { display: none !important; }
    .pc-chart-tooltip strong { color: rgba(255, 255, 255, .78); font-size: 11px; font-weight: 600; }
    .pc-chart-tooltip span { font-variant-numeric: tabular-nums; font-weight: 700; }

    /* ── 图表 ───────────────────────────────── */
    .pc-charts { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; margin-bottom: 14px; }
    .pc-chart-card {
      padding: 15px 17px 13px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--panel);

      font-size: 13px;

      opacity: 0;
      visibility: hidden;
      transition: opacity .18s ease, transform .18s ease, visibility .18s ease;

      line-height: 1.5;
    }
    .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

    /* 深色模式：工具栏、标签和快捷操作不能继续沿用浅色玻璃表面。 */

    html.dark-mode .btn:hover, body.dark-mode .btn:hover {

    html.dark-mode .btn.primary, body.dark-mode .btn.primary {
      background: linear-gradient(180deg, #a9443b, #8f302d);

    html.dark-mode .btn.danger, body.dark-mode .btn.danger {
      background: rgba(127,29,29,.24);
      border-color: rgba(251,113,133,.68);

    html.dark-mode .tabs, body.dark-mode .tabs {
      background: linear-gradient(180deg, rgba(30,41,59,.82), rgba(15,23,42,.78));
      border-color: #303b4d;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 14px 34px rgba(0,0,0,.18);
    }
    html.dark-mode .tab, body.dark-mode .tab { color: #aab6c8; }
    html.dark-mode .tab:hover, body.dark-mode .tab:hover { color: #eef2f7; background: rgba(148,163,184,.12); }
    html.dark-mode .tab.active, body.dark-mode .tab.active {
      background: linear-gradient(180deg, rgba(74,55,58,.96), rgba(55,37,42,.92));
      color: #ffd6c5;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 8px 20px rgba(0,0,0,.18);

    html.dark-mode .pc-quick-panel, body.dark-mode .pc-quick-panel {

    html.dark-mode .pc-quick-chip.primary, body.dark-mode .pc-quick-chip.primary {
      background: #9d4b43;
      border-color: #d38c7d;
      color: #fff7f2;
    }
    html.dark-mode .pc-filters .input, html.dark-mode .pc-filters select,
    body.dark-mode .pc-filters .input, body.dark-mode .pc-filters select {
      border-color: #34445a;
      background: #101827;
      color: var(--text);
    }
    html.dark-mode .tag.amber, body.dark-mode .tag.amber { background: rgba(245,158,11,.14); color: #f0c36b; }
    html.dark-mode .money.down, body.dark-mode .money.down { color: #fb7185; }
  </style>
  <link rel="stylesheet" href="/static/color-theme.css?v=11">
  <script src="/static/color-theme.js?v=7"></script>

</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="mobile-tab-toggle" id="mobileTabToggle" type="button" aria-expanded="false" onclick="toggleMobileTabs(event)">
        <span id="mobileTabLabel">家庭存款</span>
      </button>
      <nav class="tabs" id="tabs">
        <div class="deposit-tab-shell" id="depositTabShell" onmouseenter="openDepositTabMenu()" onmouseleave="closeDepositViewMenu()">
          <button class="tab active" data-tab="deposits" id="depositTabButton" type="button" aria-haspopup="menu" aria-expanded="false" onclick="toggleDepositTabMenu(event)">
            家庭存款
            <svg class="deposit-tab-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="deposit-view-menu" id="depositViewMenu" role="menu" aria-label="家庭存款视图"></div>
        </div>
        <div class="income-tab-shell" id="incomeTabShell" onmouseenter="openIncomeTabMenu()" onmouseleave="closeIncomeViewMenu()">
          <button class="tab" data-tab="income" id="incomeTabButton" type="button" aria-haspopup="menu" aria-expanded="false" onclick="toggleIncomeTabMenu(event)">
            家庭收入
            <svg class="income-tab-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="income-view-menu" id="incomeViewMenu" role="menu" aria-label="家庭收入视图"></div>
        </div>
      </nav>
      <div class="top-actions" id="topActions"></div>
    </header>
    <main class="main">
      <section class="panel" id="content"></section>
    </main>
  </div>

  <!-- 门禁验证层 -->
  <div class="gate" id="gate" hidden>
    <div class="gate-card">
      <div class="gate-lock" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="4.5" y="10.5" width="15" height="10" rx="2.4" stroke="currentColor" stroke-width="1.7"/><path d="M8 10.5V7.8a4 4 0 018 0v2.7" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="15.4" r="1.4" fill="currentColor"/><path d="M12 16.6v1.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <h1 id="gateTitle">个人中心</h1>
      <p class="gate-sub" id="gateSub">请输入密码或使用指纹解锁</p>
      <div class="gate-form" id="gateForm"></div>
      <div class="gate-foot">
        <span class="hint" id="gateHint"></span>
        <button type="button" id="gateFootAction" style="display:none" onclick="gateFootAction()"></button>
      </div>
    </div>
  </div>

  <div class="drawer-mask" id="drawerMask" onclick="closeEditor()"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <h2 id="drawerTitle">新增</h2>
      <div class="drawer-head-actions" id="drawerHeadActions"></div>
      <button class="btn ghost" id="drawerCloseButton" onclick="closeEditor()">关闭</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot" id="drawerFoot"></div>
  </aside>

  <div class="pc-dialog-mask" id="dialogMask" onclick="if(event.target===this)closeDialog()">
    <section class="pc-dialog" role="dialog" aria-modal="true">
      <div class="pc-dialog-head">
        <div><strong id="dialogTitle">管理</strong><p id="dialogSub"></p></div>
        <button class="btn ghost" type="button" onclick="closeDialog()">关闭</button>
      </div>
      <div class="pc-dialog-body" id="dialogBody"></div>
      <div class="pc-dialog-foot" id="dialogFoot"></div>
    </section>
  </div>

  <div class="pc-date-picker" id="datePicker" role="dialog" aria-label="选择日期"></div>
  <div class="toast" id="toast"></div>

  <script>
    'use strict';

    const TAB_LABELS = { deposits: '家庭存款', income: '家庭收入' };
    let activeTab = 'deposits';
    const state = {
      token: '',
      unlocked: false,
      security: { password_set: false, biometric_enabled: false, remember_session: true, protected: false, needs_setup: true },
      biometric: { supported: false, available: false },
      biometricAutoUnlockAttempted: false,
      deposits: { items: [], filters: { dateFrom: '', dateTo: '', memberId: '', q: '', scope: '' }, stats: null, members: [] },
      income: { items: [], filters: { dateFrom: '', dateTo: '', incomeType: '', memberId: '', q: '' }, stats: null, schedules: [], types: [], members: [], cases: [] },
      busy: false,
    };

    function $(id) { return document.getElementById(id); }
    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function money(value) {
      const number = Number(value || 0);
      return new Intl.NumberFormat('zh-CN', { style: 'currency', currency: 'CNY', minimumFractionDigits: 2 }).format(number);
    }
    function moneyNum(value) {
      const number = Number(value || 0);
      return new Intl.NumberFormat('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(number);
    }
    function dateOnly(v) { return v ? String(v).slice(0, 10) : ''; }
    function localTodayValue() {
      const now = new Date();
      const adjusted = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
      return adjusted.toISOString().slice(0, 10);
    }
    function dateControl(id, value, label, onChange) {
      return `<span class="pc-date-control">
        <input class="input" id="${id}" value="${esc(value || '')}" placeholder="选择日期" aria-label="${esc(label)}" readonly onclick="openDatePicker('${id}')" onchange="${onChange}">
        <button class="pc-date-trigger" type="button" aria-label="打开${esc(label)}日历" onclick="openDatePicker('${id}')">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="3.5" width="12" height="10.5" rx="2" stroke="currentColor" stroke-width="1.35"/><path d="M5 2v3M11 2v3M2 6.5h12" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
        </button>
      </span>`;
    }
    const datePickerState = { inputId: '', year: 0, month: 0 };
    function parseLocalDate(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value || '')) return null;
      const [year, month, day] = value.split('-').map(Number);
      const date = new Date(year, month - 1, day);
      return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day ? date : null;
    }
    function openDatePicker(inputId) {
      const input = $(inputId);
      if (!input) return;
      const selected = parseLocalDate(input.value) || parseLocalDate(localTodayValue());
      datePickerState.inputId = inputId;
      datePickerState.year = selected.getFullYear();
      datePickerState.month = selected.getMonth();
      renderDatePicker();
      const picker = $('datePicker');
      const rect = input.getBoundingClientRect();
      const width = 304;
      const left = Math.max(12, Math.min(rect.left, window.innerWidth - width - 12));
      picker.style.left = `${left}px`;
      picker.style.top = `${Math.min(rect.bottom + 8, window.innerHeight - picker.offsetHeight - 12)}px`;
      picker.classList.add('show');
      const top = rect.bottom + 8;
      picker.style.top = `${top + picker.offsetHeight <= window.innerHeight - 12 ? top : Math.max(12, rect.top - picker.offsetHeight - 8)}px`;
    }
    function closeDatePicker() {
      $('datePicker')?.classList.remove('show');
      datePickerState.inputId = '';
    }
    function datePickerMove(offset) {
      const view = new Date(datePickerState.year, datePickerState.month + offset, 1);
      datePickerState.year = view.getFullYear();
      datePickerState.month = view.getMonth();
      renderDatePicker();
    }
    function datePickerJump(year, month) {
      const nextYear = Number(year);
      const nextMonth = Number(month);
      if (!Number.isInteger(nextYear) || !Number.isInteger(nextMonth) || nextMonth < 0 || nextMonth > 11) return;
      datePickerState.year = nextYear;
      datePickerState.month = nextMonth;
      renderDatePicker();
    }
    function datePickerChoose(value) {
      const input = $(datePickerState.inputId);
      if (!input) return closeDatePicker();
      input.value = value;
      input.dispatchEvent(new Event('change', { bubbles: true }));
      closeDatePicker();
    }
    function datePickerClear() {
      const input = $(datePickerState.inputId);
      if (!input) return closeDatePicker();
      input.value = '';
      input.dispatchEvent(new Event('change', { bubbles: true }));
      closeDatePicker();
    }
    function renderDatePicker() {
      const picker = $('datePicker');
      if (!picker) return;
      const selectedValue = $(datePickerState.inputId)?.value || '';
      const today = localTodayValue();
      const first = new Date(datePickerState.year, datePickerState.month, 1);
      const start = new Date(datePickerState.year, datePickerState.month, 1 - first.getDay());
      const currentYear = new Date().getFullYear();
      const years = Array.from({ length: currentYear + 21 - 1900 }, (_, index) => 1900 + index);
      const yearOptions = years.map(year => `<option value="${year}" ${year === datePickerState.year ? 'selected' : ''}>${year} 年</option>`).join('');
      const monthOptions = Array.from({ length: 12 }, (_, index) => `<option value="${index}" ${index === datePickerState.month ? 'selected' : ''}>${index + 1} 月</option>`).join('');
      const days = Array.from({ length: 42 }, (_, index) => {
        const date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + index);
        const value = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        const classes = ['pc-date-day'];
        if (date.getMonth() !== datePickerState.month) classes.push('muted');
        if (value === today) classes.push('today');
        if (value === selectedValue) classes.push('selected');
        return `<button type="button" class="${classes.join(' ')}" aria-label="${value}" onclick="datePickerChoose('${value}')">${date.getDate()}</button>`;
      }).join('');
      picker.innerHTML = `<div class="pc-date-picker-head">
        <div class="pc-date-picker-title"><select aria-label="选择年份" onchange="datePickerJump(this.value, ${datePickerState.month})">${yearOptions}</select><select aria-label="选择月份" onchange="datePickerJump(${datePickerState.year}, this.value)">${monthOptions}</select></div>
        <div class="pc-date-picker-nav"><button type="button" aria-label="上个月" onclick="datePickerMove(-1)">‹</button><button type="button" aria-label="下个月" onclick="datePickerMove(1)">›</button></div>
      </div>
      <div class="pc-date-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div class="pc-date-grid">${days}</div>
      <div class="pc-date-picker-foot"><button type="button" onclick="datePickerClear()">清空</button><button class="today-action" type="button" onclick="datePickerChoose('${today}')">今天</button></div>`;
    }
    document.addEventListener('mousedown', event => {
      const picker = $('datePicker');
      if (picker?.classList.contains('show') && !picker.contains(event.target) && !event.target.closest('.pc-date-control')) closeDatePicker();
      if (!event.target.closest('#settingsShell')) closeSettingsMenu();
      if (!event.target.closest('#incomeTabShell')) closeIncomeViewMenu();
      if (!event.target.closest('#depositTabShell')) closeDepositViewMenu();
    });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeDatePicker(); });
    function toast(message, ms = 2400) {
      const el = $('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(el.__timer);
      el.__timer = setTimeout(() => el.classList.remove('show'), ms);
    }
    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab').forEach(button => button.classList.toggle('active', button.dataset.tab === tab));
      $('mobileTabLabel').textContent = TAB_LABELS[tab] || '';
      if (tab !== 'income') closeIncomeViewMenu();
      if (tab !== 'deposits') closeDepositViewMenu();
      renderTopActions();
      loadActiveTab();
    }
    function toggleMobileTabs(event) {
      const tabs = $('tabs');
      const expanded = tabs.classList.toggle('mobile-tabs-open');
      document.getElementById('mobileTabToggle').setAttribute('aria-expanded', String(expanded));
    }
    function renderIncomeViewMenu() {
      const menu = $('incomeViewMenu');
      if (!menu) return;
      const current = String(state.income.filters.memberId || '');
      const members = state.income.members || [];
      menu.innerHTML = `<div class="income-view-menu-title">切换收入统计视图</div>
        <button class="income-view-menu-item ${current === '' ? 'active' : ''}" type="button" role="menuitem" onclick="selectIncomeView('')">家庭全部成员合计</button>
        ${members.map(member => `<button class="income-view-menu-item ${current === String(member.id) ? 'active' : ''}" type="button" role="menuitem" onclick="selectIncomeView('${Number(member.id)}')">${esc(member.name)}${member.role ? `（${esc(member.role)}）` : ''}</button>`).join('')}`;
    }
    function openIncomeTabMenu() {
      renderIncomeViewMenu();
      const menu = $('incomeViewMenu');
      const shell = $('incomeTabShell');
      menu?.classList.add('show');
      shell?.classList.add('open');
      $('incomeTabButton')?.setAttribute('aria-expanded', 'true');
    }
    function toggleIncomeTabMenu(event) {
      event?.stopPropagation();
      if (activeTab !== 'income') switchTab('income');
      const menu = $('incomeViewMenu');
      const shell = $('incomeTabShell');
      const willOpen = !menu?.classList.contains('show');
      if (willOpen) openIncomeTabMenu();
      else {
        menu?.classList.remove('show');
        shell?.classList.remove('open');
        $('incomeTabButton')?.setAttribute('aria-expanded', 'false');
      }
    }
    function closeIncomeViewMenu() {
      $('incomeViewMenu')?.classList.remove('show');
      $('incomeTabShell')?.classList.remove('open');
      $('incomeTabButton')?.setAttribute('aria-expanded', 'false');
    }
    function selectIncomeView(memberId) {
      state.income.filters.memberId = String(memberId || '');
      closeIncomeViewMenu();
      if (activeTab !== 'income') switchTab('income');
      else loadIncome();
    }
    function renderDepositViewMenu() {
      const menu = $('depositViewMenu');
      if (!menu) return;
      const current = String(state.deposits.filters.memberId || '');
      const members = state.deposits.members || [];
      menu.innerHTML = `<div class="deposit-view-menu-title">切换存款统计视图</div>
        <button class="deposit-view-menu-item ${current === '' ? 'active' : ''}" type="button" role="menuitem" onclick="selectDepositView('')">家庭全部成员合计</button>
        ${members.map(member => `<button class="deposit-view-menu-item ${current === String(member.id) ? 'active' : ''}" type="button" role="menuitem" onclick="selectDepositView('${Number(member.id)}')">${esc(member.name)}${member.role ? `（${esc(member.role)}）` : ''}</button>`).join('')}`;
    }
    function openDepositTabMenu() {
      renderDepositViewMenu();
      const menu = $('depositViewMenu');
      const shell = $('depositTabShell');
      menu?.classList.add('show');
      shell?.classList.add('open');
      $('depositTabButton')?.setAttribute('aria-expanded', 'true');
    }
    function toggleDepositTabMenu(event) {
      event?.stopPropagation();
      if (activeTab !== 'deposits') switchTab('deposits');
      const menu = $('depositViewMenu');
      const shell = $('depositTabShell');
      const willOpen = !menu?.classList.contains('show');
      if (willOpen) openDepositTabMenu();
      else {
        menu?.classList.remove('show');
        shell?.classList.remove('open');
        $('depositTabButton')?.setAttribute('aria-expanded', 'false');
      }
    }
    function closeDepositViewMenu() {
      $('depositViewMenu')?.classList.remove('show');
      $('depositTabShell')?.classList.remove('open');
      $('depositTabButton')?.setAttribute('aria-expanded', 'false');
    }
    function selectDepositView(memberId) {
      state.deposits.filters.memberId = String(memberId || '');
      closeDepositViewMenu();
      if (activeTab !== 'deposits') switchTab('deposits');
      else loadDeposits();
    }
    function renderTopActions() {
      const isDeposits = activeTab === 'deposits';
      const primaryAction = isDeposits
        ? `<button class="btn primary" type="button" onclick="openDepositEditor()">统计当前存款</button>`
        : `<button class="btn primary" type="button" onclick="openIncomeEditor()">记录收入</button>`;
      const settingsItems = `<button class="pc-settings-menu-item" type="button" role="menuitem" onclick="openMemberManager();closeSettingsMenu()">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16 20v-1.5a4 4 0 00-4-4H6a4 4 0 00-4 4V20M9 10.5a4 4 0 100-8 4 4 0 000 8zM19 8v6M22 11h-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span><strong>家庭成员管理</strong><small>添加、编辑或停用家庭成员</small></span>
          </button>
          <button class="pc-settings-menu-item" type="button" role="menuitem" onclick="openIncomeTypeManager();closeSettingsMenu()">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 016.5 3H19a2 2 0 012 2v12.5a2.5 2.5 0 01-2.5 2.5H6.5A2.5 2.5 0 014 17.5v-12zM8 8h9M8 12h9M8 16h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <span><strong>收入类型管理</strong><small>维护默认与自定义收入类型</small></span>
          </button>`;
      $('topActions').innerHTML = `${primaryAction}
        <div class="pc-settings-shell" id="settingsShell">
          <button class="btn top-icon-btn" id="settingsButton" type="button" aria-label="设置" title="设置" aria-haspopup="menu" aria-expanded="false" onclick="toggleSettingsMenu(event)">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 100-6.4 3.2 3.2 0 000 6.4z" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5a7.9 7.9 0 000-3l2-1.5-2-3.5-2.4 1a8.5 8.5 0 00-2.6-1.5L14 2.5h-4L9.6 5a8.5 8.5 0 00-2.6 1.5l-2.4-1-2 3.5 2 1.5a7.9 7.9 0 000 3l-2 1.5 2 3.5 2.4-1a8.5 8.5 0 002.6 1.5l.4 2.5h4l.4-2.5a8.5 8.5 0 002.6-1.5l2.4 1 2-3.5-2-1.5z" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"/></svg>
          </button>
          <div class="pc-settings-menu" id="settingsMenu" role="menu" aria-label="个人中心设置">${settingsItems}</div>
        </div>
        <button class="btn top-icon-btn lock-btn" type="button" onclick="lock()" aria-label="锁定个人中心" title="锁定个人中心">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>`;
    }
    function toggleSettingsMenu(event) {
      event?.stopPropagation();
      const menu = $('settingsMenu');
      const button = $('settingsButton');
      const willOpen = !menu?.classList.contains('show');
      menu?.classList.toggle('show', willOpen);
      button?.setAttribute('aria-expanded', String(willOpen));
    }
    function closeSettingsMenu() {
      $('settingsMenu')?.classList.remove('show');
      $('settingsButton')?.setAttribute('aria-expanded', 'false');
    }
    function loadActiveTab() {
      if (activeTab === 'deposits') loadDeposits(); else loadIncome();
    }
    function shouldRememberSession() {
      return state.security.remember_session !== false;
    }
    function saveSessionToken(token) {
      if (!shouldRememberSession()) {
        try { localStorage.removeItem('pc_session_token'); } catch (e) {}
        return;
      }
      try { localStorage.setItem('pc_session_token', token); } catch (e) {}
    }

    /* ── API ────────────────────────────────── */
    async function parseApiResponse(res) {
      const text = await res.text().catch(() => '');
      let data = {};
      if (text) {
        try { data = JSON.parse(text); } catch (e) { data = {}; }
      }
      if (!res.ok) {
        const message = data.detail || data.message || (text ? text.slice(0, 500) : '') || `请求失败（HTTP ${res.status}）`;
        const error = new Error(message);
        error.status = res.status;
        throw error;
      }
      return data;
    }
    async function api(url, options = {}) {
      const headers = Object.assign({}, options.headers || {});
      if (state.token) headers['x-pc-token'] = state.token;
      if (options.body && typeof options.body === 'object') {
        headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(options.body);
      }
      try {
        const res = await fetch(url, { ...options, headers });
        return await parseApiResponse(res);
      } catch (error) {
        if (error.status === 401) {
          state.token = '';
          state.unlocked = false;
          try { localStorage.removeItem('pc_session_token'); } catch (e) {}
          showGate();
          throw error;
        }
        throw error;
      }
    }

    /* ── 指纹桥接 ───────────────────────────── */
    function isNativeShell() {
      return !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.biometric);
    }
    function callBiometric(action, timeoutMs = 90000) {
      return new Promise((resolve, reject) => {
        if (!isNativeShell()) { reject(new Error('当前环境不支持指纹')); return; }
        const requestId = 'pcbio' + Date.now() + Math.floor(Math.random() * 1e6);
        let settled = false;
        let timer = null;
        const finish = (callback, value) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (window.__pcBiometricReply === onReply) window.__pcBiometricReply = null;
          callback(value);
        };
        const onReply = function(replyId, payload) {
          if (replyId === requestId) finish(resolve, payload || {});
        };
        window.__pcBiometricReply = onReply;
        window.webkit.messageHandlers.biometric.postMessage({ action, requestId });
        timer = setTimeout(() => finish(reject, new Error('指纹验证超时')), timeoutMs);
      });
    }
    // 原生壳的指纹结果在顶层窗口回调，通过 postMessage 广播到本 iframe。
    window.addEventListener('message', function(event) {
      if (!event.data || event.data.type !== 'pcBiometricReply') return;
      if (typeof window.__pcBiometricReply === 'function') {
        window.__pcBiometricReply(event.data.requestId, event.data.payload);
      }
    });
    async function probeBiometric() {
      if (!isNativeShell()) { state.biometric.supported = false; return; }
      try {
        const result = await callBiometric('available', 8000);
        state.biometric.supported = true;
        state.biometric.available = !!result.available;
      } catch (e) {
        state.biometric.supported = true;
        state.biometric.available = false;
      }
    }

    /* ── 门禁 ───────────────────────────────── */
    async function initSecurity() {
      try {
        state.security = await api('/api/personal-center/security/status');
      } catch (e) {
        state.security = { needs_setup: false, protected: true, password_set: false, biometric_enabled: false, remember_session: true };
      }
      try {
        const saved = shouldRememberSession() ? localStorage.getItem('pc_session_token') : '';
        if (saved) {
          state.token = saved;
          try {
            const status = await api('/api/personal-center/security/status');
            if (state.token) {
              state.unlocked = true;
              $('gate').hidden = true;
              loadActiveTab();
              return;
            }
          } catch (e) { /* token 失效则进入门禁 */ }
          state.token = '';
        }
      } catch (e) {}
      if (state.security.protected) {
        showGate();
      } else if (state.security.needs_setup) {
        showGate('setup');
      } else {
        state.unlocked = true;
        $('gate').hidden = true;
        loadActiveTab();
      }
    }

    function showGate(mode = '') {
      $('gate').hidden = false;
      const setup = mode === 'setup' || (!state.security.password_set && !state.security.biometric_enabled);
      $('gateTitle').textContent = setup ? '首次使用 · 设置访问保护' : '个人中心';
      $('gateSub').textContent = setup
        ? '为保护家庭存款与收入隐私，请先设置访问密码或录入指纹'
        : (state.security.biometric_enabled && state.biometric.available ? '请输入密码，或使用指纹解锁' : '请输入密码解锁');
      const hint = $('gateHint');
      hint.textContent = setup
        ? '密码保存在本机，仅用于进入个人中心。'
        : (shouldRememberSession()
          ? '验证通过后 30 分钟内无需重复验证，可随时点击右上角「锁定」。'
          : '已关闭免密码；每次重新进入个人中心时都需要验证。');
      const foot = $('gateFootAction');
      if (setup) {
        foot.style.display = '';
        foot.textContent = '暂不设置，直接进入';
      } else {
        foot.style.display = 'none';
      }
      renderGateForm(setup);
      scheduleBiometricAutoUnlock(setup);
    }

    // 每次进入个人中心仅自动请求一次，取消或失败后始终保留密码入口，
    // 避免用户回到页面时反复弹出系统 Touch ID 面板。
    function scheduleBiometricAutoUnlock(setup) {
      if (setup || state.unlocked || state.biometricAutoUnlockAttempted) return;
      if (!state.security.biometric_enabled || !state.biometric.available || !isNativeShell()) return;
      state.biometricAutoUnlockAttempted = true;
      setTimeout(() => {
        if (!state.unlocked && !$('gate').hidden) unlockWithBiometric(null, true);
      }, 180);
    }

    function gateFootAction() {
      state.unlocked = true;
      $('gate').hidden = true;
      loadActiveTab();
    }

    function renderGateForm(setup) {

          <div class="field"><label>设置访问密码（${'4'}–${'64'} 位）</label>
            <div class="gate-input-wrap">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2" stroke="currentColor" stroke-width="1.4"/></svg>

              <input type="password" id="setupPassword2" placeholder="请再次输入密码" autocomplete="new-password" onkeydown="if(event.key==='Enter'){event.preventDefault();saveSetupPassword()}" />

              <span>录入指纹（Touch ID）</span>
            </button>` : ''}
          </div>`;
        setTimeout(() => $('setupPassword1')?.focus(), 0);
      } else {
        const canBiometric = state.security.biometric_enabled && isNativeShell();
        form.innerHTML = `
          <div class="field"><label>访问密码</label>
            <div class="gate-input-wrap">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2" stroke="currentColor" stroke-width="1.4"/></svg>
              <input type="password" id="gatePassword" placeholder="请输入访问密码" autocomplete="current-password" onkeydown="if(event.key==='Enter'){event.preventDefault();unlockWithPassword()}" />
              <button class="gate-eye" type="button" onclick="toggleGatePassword()" aria-label="显示/隐藏密码">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M1.5 8s2.4-4 6.5-4 6.5 4 6.5 4-2.4 4-6.5 4S1.5 8 1.5 8z" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/></svg>
              </button>
            </div>

          <div class="gate-actions">
            <button class="gate-btn" type="button" onclick="unlockWithPassword()"><span>解锁进入</span></button>

              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3.5c1.8 0 3.3 1.5 3.3 3.4 0 1.5-.9 2.8-2.1 3.3.5.5.8 1 .9 1.6.6-.6 1.1-1.1 1.7-1.5 1.5-.9 3.2-.4 4 .9.9 1.3.4 3-1 3.8l-.6.3c-2 1-3.7 1.6-5.1 2.3-.9.5-1.6.9-2.2 1.5-.4.4-.8.8-1.3 1.1-.5.4-1.1.6-1.7.7-1 .2-2 .2-2.9.2h-.3v-1.4h.3c.9 0 1.9 0 2.9-.2.4-.1.8-.2 1.1-.5.3-.2.6-.5 1-.8.7-.6 1.4-1 2.3-1.5 1.4-.7 3-1.3 5-2.2l.6-.3c.7-.4.9-1.2.4-1.8-.5-.6-1.3-.8-2-.4-.6.3-1.1.8-1.7 1.4l-.7-.3c-.3-1.2-1.3-2-2.6-2.1-1.1-.1-2 .6-2.4 1.6-.3.8-.2 1.8.1 2.8l-1.3.5c-.4-1.4-.6-2.9-.2-4.2.4-1.4 1.4-2.5 2.9-3 .8-.3 1.6-.4 2.3-.4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
              <span>使用指纹解锁</span>

    function gateError(message) {
      const el = $('gateError');
      if (!el) return;
      el.textContent = message;
      el.classList.add('show');
    }
    function clearGateError() {
      const el = $('gateError');
      if (el) el.classList.remove('show');
    }
    function toggleGatePassword() {
      const input = $('gatePassword');
      if (input) input.type = input.type === 'password' ? 'text' : 'password';
    }

    async function unlockWithPassword() {
      const input = $('gatePassword');
      const password = input?.value || '';
      if (!password) { gateError('请输入访问密码'); return; }
      clearGateError();
      try {
        const data = await api('/api/personal-center/verify/password', { method: 'POST', body: { password } });
        state.token = data.token;
        state.unlocked = true;
        saveSessionToken(state.token);
        $('gate').hidden = true;
        await loadActiveTab();
      } catch (error) {
        gateError(error.message || '验证失败');
        input?.select();
      }
    }

    async function unlockWithBiometric(button = null, silent = false) {
      clearGateError();
      button = button || document.querySelector('.gate-biometric');
      if (button) { button.disabled = true; button.dataset.original = button.innerHTML; button.innerHTML = '<span class="gate-spinner"></span><span>等待指纹验证…</span>'; }
      try {
        const result = await callBiometric('verify');
        if (result && result.token) {
          state.token = result.token;
          state.unlocked = true;
          saveSessionToken(state.token);
          $('gate').hidden = true;
          await loadActiveTab();
        } else {
          if (!silent) gateError(result?.error || '指纹验证未通过');
        }
      } catch (error) {
        if (!silent) gateError(error.message || '指纹验证失败');
      } finally {
        if (button && button.dataset.original) { button.innerHTML = button.dataset.original; button.disabled = false; }
      }
    }

    async function saveSetupPassword() {
      const password = $('setupPassword1')?.value || '';
      const confirm = $('setupPassword2')?.value || '';
      clearGateError();
      if (!password) { gateError('请输入密码'); return; }
      if (password.length < 4) { gateError('密码至少需要 4 位'); return; }
      if (password !== confirm) { gateError('两次输入的密码不一致'); return; }
      try {
        await api('/api/personal-center/security/set-password', { method: 'POST', body: { password } });
        state.security = await api('/api/personal-center/security/status');
        toast('访问密码已设置');
        const data = await api('/api/personal-center/verify/password', { method: 'POST', body: { password } });
        state.token = data.token;
        state.unlocked = true;
        saveSessionToken(state.token);
        $('gate').hidden = true;
        await loadActiveTab();
      } catch (error) {
        gateError(error.message || '设置失败');
      }
    }

    async function setupBiometric() {
      clearGateError();
      const button = $('setupBiometricBtn');
      if (button) { button.disabled = true; button.dataset.original = button.innerHTML; button.innerHTML = '<span class="gate-spinner"></span><span>请触摸 Touch ID…</span>'; }
      try {
        const result = await callBiometric('verify');
        if (result && result.ok) {
          await api('/api/personal-center/security/biometric/enable', { method: 'POST', body: {} });
          state.security = await api('/api/personal-center/security/status');
          toast('指纹已录入，可使用 Touch ID 解锁');
          state.unlocked = true;
          $('gate').hidden = true;
          await loadActiveTab();
        } else {
          gateError('指纹录入未完成');
        }
      } catch (error) {
        gateError(error.message || '指纹录入失败');
      } finally {
        if (button && button.dataset.original) { button.innerHTML = button.dataset.original; button.disabled = false; }
      }
    }

    function lock() {
      state.unlocked = false;
      state.token = '';
      try { localStorage.removeItem('pc_session_token'); } catch (e) {}
      api('/api/personal-center/logout', { method: 'POST' }).catch(() => {});
      showGate();
    }

    /* ── 家庭存款 ───────────────────────────── */
    async function loadDeposits() {

          api(`/api/personal-center/family/records?${depositFilterParams()}`),
          api(`/api/personal-center/family/stats${state.deposits.filters.memberId ? `?member_id=${encodeURIComponent(state.deposits.filters.memberId)}` : ''}`),
        ]);
        state.deposits.items = records.items || [];
        state.deposits.stats = stats;
        state.deposits.members = (stats.members || []).filter(member => member.active);
        renderDepositViewMenu();
        renderDeposits();
      } catch (error) {
        $('content').innerHTML = `<div class="empty">${esc(error.message || '家庭存款加载失败')}</div>`;

      if (f.memberId) params.set('member_id', f.memberId);
      if (f.q) params.set('q', f.q);
      return params;

          </section>
          <section class="pc-chart-card" aria-label="家庭成员存款构成柱状图">
            <div class="pc-chart-head"><strong>${selectedMember ? `${esc(selectedMember.name)}存款构成` : '成员存款构成'}</strong><small>${latest ? `最新记录 · ${esc(dateOnly(latest.record_date))}` : '暂无记录'}</small></div>
            <div class="pc-chart-host" id="depositBarHost">${latest ? depositBarChart(latest.members || [], scope) : '<div class="pc-chart-empty">暂无数据</div>'}</div>
            <div class="pc-chart-legend">${scope === 'fund' ? '' : `<span><i style="background:var(--chart-cash)"></i>现金存款</span>`}${scope === 'cash' ? '' : `<span><i style="background:var(--chart-fund)"></i>公积金</span>`}</div>
          </section>
        </div>
        <div class="pc-toolbar">

            <button class="btn ${scope === 'cash' ? 'primary' : ''}" type="button" onclick="toggleDepositScope('cash')">只看存款</button>
            <button class="btn ${scope === 'fund' ? 'primary' : ''}" type="button" onclick="toggleDepositScope('fund')">只看公积金</button>
