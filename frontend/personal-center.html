            <thead><tr><th>记录日期</th><th style="text-align:right">${scope === 'cash' ? '现金余额' : scope === 'fund' ? '公积金余额' : '总余额'}</th><th style="text-align:right">现金</th><th style="text-align:right">公积金</th><th>成员明细</th><th>来源</th><th>操作</th></tr></thead>
            <tbody>${depositTableRows(items, scope)}</tbody></table></div>
          <div class="pc-mobile-list">${depositMobileCards(items, scope)}</div>
        </div>
      </div>`;
      bindLineTooltip('depositLineHost', 'depositLineTooltip', depositTooltipLabel);
    }

    function depositTableRows(items, scope = '') {
      if (!items.length) return `<tr><td colspan="7"><div class="empty">还没有存款记录，点击「统计当前存款」开始</div></td></tr>`;
      const scopeTotal = item => scope === 'cash' ? item.cash : scope === 'fund' ? item.fund : item.total;
      return items.map(item => {
        const members = item.members || [];
        const memberDots = members.length
          ? `<div class="member-dots">${members.map(member => `<span class="member-dot">${esc(member.name)} <b>${moneyNum(member.cash + member.fund)}</b></span>`).join('')}</div>`
          : '—';
        return `<tr>
          <td>${esc(dateOnly(item.record_date))}</td>
          <td style="text-align:right" class="money">${money(scopeTotal(item))}</td>
          <td style="text-align:right">${scope === 'fund' ? '<span style="color:var(--muted)">—</span>' : money(item.cash)}</td>
          <td style="text-align:right">${scope === 'cash' ? '<span style="color:var(--muted)">—</span>' : money(item.fund)}</td>
          <td>${memberDots}${item.note ? `<div class="truncate" style="margin-top:4px;color:var(--muted);font-size:11px" title="${esc(item.note)}">${esc(item.note)}</div>` : ''}</td>
          <td>${item.source === 'auto' ? '<span class="tag auto-tag">自动记录</span>' : '<span class="tag green">手动记录</span>'}</td>
          <td><div class="actions">
            <button class="btn" type="button" onclick="openDepositEditorById(${Number(item.id)})">编辑</button>
            <button class="btn danger" type="button" onclick="deleteDepositRecord(${Number(item.id)})">删除</button>
          </div></td>
        </tr>`;
      }).join('');
    }

    function depositMobileCards(items, scope = '') {
      if (!items.length) return '<div class="empty">还没有存款记录</div>';
      const scopeTotal = item => scope === 'cash' ? item.cash : scope === 'fund' ? item.fund : item.total;
      return items.map(item => {
        const members = (item.members || []).map(member => `${esc(member.name)} ${moneyNum(member.cash + member.fund)}`).join(' · ');
        return `<article class="pc-mobile-card">
          <div class="pc-mobile-head"><strong>${money(scopeTotal(item))}</strong><span class="tag green">${item.source === 'auto' ? '自动' : '手动'}</span></div>
          <p>${esc(dateOnly(item.record_date))} · 现金 ${esc(money(item.cash))} · 公积金 ${esc(money(item.fund))}${members ? `<br>${members}` : ''}</p>
          <div class="pc-mobile-foot"><span>${esc(item.note || '')}</span><span class="pc-mobile-actions"><button class="btn" type="button" onclick="openDepositEditorById(${Number(item.id)})">编辑</button><button class="btn danger" type="button" onclick="deleteDepositRecord(${Number(item.id)})">删除</button></span></div>
        </article>`;
      }).join('');
    }

    /* ── 存款编辑器 ─────────────────────────── */
    function openDepositEditorById(id) {
      const item = (state.deposits.items || []).find(entry => Number(entry.id) === Number(id));
      if (item) openDepositEditor(item);
    }
    function openDepositEditor(item = null) {
      const members = state.deposits.members.length ? state.deposits.members : [];
      if (!members.length) {
        openMemberManager();
        toast('请先添加家庭成员');
        return;
      }
      const existingMap = {};
      (item?.members || []).forEach(member => { existingMap[member.name] = member; });
      $('drawerTitle').textContent = item ? '编辑存款记录' : '记录当前余额';
      $('drawerHeadActions').innerHTML = '';
      $('drawerBody').innerHTML = `<div class="pc-editor">
        <div class="pc-editor-grid">
          <div class="field"><label>记录日期</label>${dateControl('depositDate', item?.record_date || localTodayValue(), '记录日期', 'updateDepositPreview()')}</div>
          <div class="field full"><label>备注（可选）</label><input class="input" id="depositNote" value="${esc(item?.note || '')}" maxlength="300" placeholder="例如：6 月工资入账后盘点"></div>
        </div>
        <div class="field"><label><span>成员存款明细</span><button class="field-link" type="button" onclick="openMemberManager()">管理家庭成员</button></label>
          <div class="member-inputs" id="memberInputs">
            ${members.map((member, index) => {
              const existing = existingMap[member.name] || {};
              return `<div class="member-input-row" data-member="${esc(member.name)}">
                <span class="member-name">${esc(member.name)}</span>
                <div><div class="mini-label">现金存款（元）</div><input class="input" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" value="${existing.cash != null ? esc(Number(existing.cash).toFixed(2)) : ''}" oninput="updateDepositPreview()"></div>
                <div><div class="mini-label">公积金（元）</div><input class="input" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" value="${existing.fund != null ? esc(Number(existing.fund).toFixed(2)) : ''}" oninput="updateDepositPreview()"></div>
              </div>`;
            }).join('')}
          </div>
        </div>
        <div class="pc-total-preview"><span>本次记录合计余额</span><strong id="depositTotalPreview">0.00</strong></div>
      </div>`;
      $('drawerFoot').innerHTML = `<button class="btn" onclick="closeEditor()">取消</button><button class="btn primary" id="saveDepositButton" onclick="saveDepositRecord(${item ? Number(item.id) : 'null'})">保存</button>`;
      $('drawerMask').classList.add('show');
      $('drawer').classList.add('show');
      updateDepositPreview();
    }

    function updateDepositPreview() {
      const rows = document.querySelectorAll('#memberInputs .member-input-row');
      let total = 0;
      rows.forEach(row => {
        const inputs = row.querySelectorAll('input');
        total += Number(inputs[0]?.value || 0) + Number(inputs[1]?.value || 0);
      });
      const preview = $('depositTotalPreview');
      if (preview) preview.textContent = moneyNum(total);
    }

    async function saveDepositRecord(id) {
      const rows = document.querySelectorAll('#memberInputs .member-input-row');
      const members = [];
      rows.forEach(row => {
        const inputs = row.querySelectorAll('input');
        members.push({
          name: row.dataset.member,
          cash: inputs[0]?.value || 0,
          fund: inputs[1]?.value || 0,
        });
      });
      const filled = members.filter(member => Number(member.cash) > 0 || Number(member.fund) > 0);
      if (!filled.length) { toast('请至少填写一位成员的存款金额'); return; }
      const button = $('saveDepositButton');
      if (button) { button.disabled = true; button.textContent = '保存中…'; }
      try {
        const payload = {
          record_date: $('depositDate')?.value || localTodayValue(),
          note: $('depositNote')?.value || '',
          members,
        };
        if (id) {
          await api(`/api/personal-center/family/records/${id}`, { method: 'PUT', body: payload });
          toast('存款记录已更新');
        } else {
          await api('/api/personal-center/family/records', { method: 'POST', body: payload });
          toast('存款记录已保存');
        }
        closeEditor();
        await loadDeposits();
      } catch (error) {
        toast(error.message || '保存失败');
        if (button) { button.disabled = false; button.textContent = '保存'; }
      }
    }

    async function deleteDepositRecord(id) {
      openConfirm('删除存款记录', '删除后无法恢复，确定删除这条记录吗？', async () => {
        try {
          await api(`/api/personal-center/family/records/${id}`, { method: 'DELETE' });
          toast('已删除');
          await loadDeposits();
        } catch (error) {
          toast(error.message || '删除失败');
        }
      }, '删除');
    }

    /* ── 成员管理 ───────────────────────────── */
    function openMemberManager() {
      const items = state.deposits.members || [];
      $('dialogTitle').textContent = '家庭成员管理';
      $('dialogSub').textContent = '存款记录将按成员分别填写现金存款与公积金';
      $('dialogBody').innerHTML = `
        <div class="pc-member-section">
          <div class="pc-member-section-head">
            <span class="pc-member-section-title">现有成员</span>
            <span class="pc-member-section-note">共 ${items.length} 位</span>
          </div>
          <div class="pc-member-column-head" aria-hidden="true"><span>姓名</span><span>称谓</span><span>操作</span></div>
          <div id="memberEditList">${items.map(member => `
            <div class="pc-member-edit-row" data-id="${Number(member.id)}">
              <input class="input" value="${esc(member.name)}" placeholder="姓名" aria-label="成员姓名" maxlength="40">
              <input class="input" value="${esc(member.role || '')}" placeholder="称谓（可选）" aria-label="称谓" maxlength="40">
              <button class="btn danger" type="button" onclick="this.closest('.pc-member-edit-row').remove()">删除</button>
            </div>`).join('')}
          </div>
        </div>
        <div class="pc-member-section">
          <div class="pc-member-section-head">
            <span class="pc-member-section-title">添加成员</span>
            <span class="pc-member-section-note">填写后点击添加</span>
          </div>
          <div class="pc-member-add">
            <input class="input" id="newMemberName" placeholder="成员姓名" aria-label="新成员姓名" maxlength="40" onkeydown="if(event.key==='Enter'){event.preventDefault();addMemberRow()}">
            <input class="input" id="newMemberRole" placeholder="称谓（可选）" aria-label="新成员称谓" maxlength="40" onkeydown="if(event.key==='Enter'){event.preventDefault();addMemberRow()}">
            <button class="btn" type="button" onclick="addMemberRow()">添加成员</button>
          </div>
        </div>`;
      $('dialogFoot').innerHTML = `<button class="btn" onclick="closeDialog()">取消</button><button class="btn primary" onclick="saveMemberManager()">保存成员</button>`;
      openDialog();
    }

    function addMemberRow() {
      const name = $('newMemberName')?.value?.trim();
      const role = $('newMemberRole')?.value?.trim();
      if (!name) { toast('请输入成员姓名'); return; }
      const list = $('memberEditList');
      list.insertAdjacentHTML('beforeend', `<div class="pc-member-edit-row" data-id="new">
        <input class="input" value="${esc(name)}" placeholder="姓名" maxlength="40">
        <input class="input" value="${esc(role)}" placeholder="称谓（可选）" maxlength="40">
        <button class="btn danger" type="button" onclick="this.closest('.pc-member-edit-row').remove()">删除</button>
      </div>`);
      $('newMemberName').value = '';
      $('newMemberRole').value = '';
      $('newMemberName').focus();
    }

    async function saveMemberManager() {
      const rows = document.querySelectorAll('#memberEditList .pc-member-edit-row');
      const items = [];
      const seen = new Set();
      for (const row of rows) {
        const inputs = row.querySelectorAll('input');
        const name = inputs[0]?.value?.trim();
        if (!name) continue;
        if (seen.has(name)) { toast(`成员“${name}”重复`); return; }
        seen.add(name);
        items.push({ name, role: inputs[1]?.value?.trim() || '' });
      }
      try {
        await api('/api/personal-center/family/members', { method: 'POST', body: { items } });
        toast('家庭成员已保存');
        closeDialog();
        await loadActiveTab();
      } catch (error) {
        toast(error.message || '保存失败');
      }
    }

    /* ── 家庭收入 ───────────────────────────── */
    const INCOME_DEFAULT_OPTIONS = [
      { key: 'draft_award', label: '起草裁决' },
      { key: 'quarter_bonus', label: '季度奖金' },
      { key: 'year_end_bonus', label: '年底奖金' },
      { key: 'salary', label: '月工资' },
      { key: 'housing_fund', label: '公积金' },
    ];
    function incomeTypes() {
      return state.income.types.length ? state.income.types : INCOME_DEFAULT_OPTIONS.map(item => ({ ...item, is_default: true }));
    }
    function incomeOption(key, includeAll = true) {
      const types = incomeTypes();
      const defaults = types.filter(item => item.is_default);
      const customs = types.filter(item => !item.is_default);
      const selected = optionItem => optionItem.key === key ? 'selected' : '';
      return `${includeAll ? `<option value="" ${key === '' ? 'selected' : ''}>全部类型</option>` : ''}
        <optgroup label="默认类型">${defaults.map(item => `<option value="${esc(item.key)}" ${selected(item)}>${esc(item.label)}</option>`).join('')}</optgroup>
        ${customs.length ? `<optgroup label="自定义类型">${customs.map(item => `<option value="${esc(item.key)}" ${selected(item)}>${esc(item.label)}</option>`).join('')}</optgroup>` : ''}`;
    }
    async function loadIncome() {
      try {
        const statsParams = new URLSearchParams();
        if (state.income.filters.memberId) statsParams.set('member_id', state.income.filters.memberId);
        if (state.income.filters.dateFrom) statsParams.set('date_from', state.income.filters.dateFrom);
        if (state.income.filters.dateTo) statsParams.set('date_to', state.income.filters.dateTo);
        const statsQ = statsParams.toString();
        const [records, stats, schedules, types, members] = await Promise.all([
          api(`/api/personal-center/income/records?${incomeFilterParams()}`),
          api(`/api/personal-center/income/stats${statsQ ? `?${statsQ}` : ''}`),
          api('/api/personal-center/income/schedules'),
          api('/api/personal-center/income/types'),
          api('/api/personal-center/family/members'),
        ]);
        state.income.items = records.items || [];
        state.income.stats = stats;
        state.income.schedules = schedules.items || [];
        state.income.types = types.items || [];
        state.income.members = members.items || [];
        renderIncomeViewMenu();
        renderIncome();
      } catch (error) {
        $('content').innerHTML = `<div class="empty">${esc(error.message || '家庭收入加载失败')}</div>`;
      }
    }
    function incomeFilterParams() {
      const f = state.income.filters;
      const params = new URLSearchParams();
      if (f.dateFrom) params.set('date_from', f.dateFrom);
      if (f.dateTo) params.set('date_to', f.dateTo);
      if (f.incomeType) params.set('income_type', f.incomeType);
      if (f.memberId) params.set('member_id', f.memberId);
      if (f.q) params.set('q', f.q);
      return params;
    }
    let incomeLoadTimer = null;
    function debounceIncomeLoad() {
      clearTimeout(incomeLoadTimer);
      incomeLoadTimer = setTimeout(loadIncome, 240);
    }
    function resetIncomeFilters() {
      state.income.filters = { dateFrom: '', dateTo: '', incomeType: '', memberId: '', q: '' };
      incomeQuickState.mode = '';
      incomeQuickState.start = '';
      incomeQuickState.end = '';
      renderIncomeQuickControls();
      loadIncome();
    }
    const incomeQuickState = { mode: '', start: '', end: '' };
    function incomeQuickToggle(mode) {
      incomeQuickState.mode = incomeQuickState.mode === mode ? '' : mode;
      if (incomeQuickState.mode !== 'range') {
        incomeQuickState.start = '';
        incomeQuickState.end = '';
      }
      renderIncomeQuickControls();
    }
    function incomeQuickMonthLabel(month) {
      return `${month.slice(0, 4)}年${Number(month.slice(5, 7))}月`;
    }
    function incomeQuickChip(handler, value, label, active = false) {
      return `<button class="btn pc-quick-chip ${active ? 'primary' : ''}" type="button" data-value="${esc(value)}" onclick="${handler}('${esc(value)}')">${esc(label)}</button>`;
    }
    function incomeQuickMonths() {
      return state.income.stats?.available_months || [];
    }
    function renderIncomeQuickControls() {
      const mode = incomeQuickState.mode;
      [['incomeQuickMonthBtn', 'month'], ['incomeQuickYearBtn', 'year'], ['incomeQuickRangeBtn', 'range']].forEach(([id, value]) => {
        const btn = $(id);
        if (btn) btn.classList.toggle('primary', mode === value);
      });
      const panel = $('incomeQuickPanel');
      if (!panel) return;
      if (!mode) {
        panel.hidden = true;
        panel.innerHTML = '';
        return;
      }
      const months = incomeQuickMonths();
      const years = [...new Set(months.map(month => month.slice(0, 4)))];
      const emptyNote = '<span class="pc-quick-note">暂无收入记录</span>';
      if (mode === 'month') {
        panel.innerHTML = `<span class="pc-quick-label">选择月份</span>${months.length ? months.map(month => incomeQuickChip('incomeQuickPickMonth', month, incomeQuickMonthLabel(month))).join('') : emptyNote}`;
      } else if (mode === 'year') {
        panel.innerHTML = `<span class="pc-quick-label">选择年份</span>${years.length ? years.map(year => incomeQuickChip('incomeQuickPickYear', year, `${year}年`)).join('') : emptyNote}`;
      } else if (mode === 'range') {
        const ascending = [...months].reverse();
        panel.innerHTML = `<span class="pc-quick-label">开始月份</span>${ascending.map(month => incomeQuickChip('incomeQuickPickRangeStart', month, incomeQuickMonthLabel(month), incomeQuickState.start === month)).join('')}
          <span class="pc-quick-label">结束月份</span>${ascending.map(month => incomeQuickChip('incomeQuickPickRangeEnd', month, incomeQuickMonthLabel(month), incomeQuickState.end === month)).join('')}`;
      }
      panel.hidden = false;
    }
    function incomeQuickMonthEnd(value) {
      if (!/^\d{4}-\d{2}$/.test(value || '')) return '';
      const [year, month] = value.split('-').map(Number);
      const lastDay = new Date(year, month, 0).getDate();
      return `${year}-${String(month).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
    }
    function incomeQuickApplyDates(dateFrom, dateTo) {
      state.income.filters.dateFrom = dateFrom;
      state.income.filters.dateTo = dateTo;
      const fromEl = $('incomeDateFrom'), toEl = $('incomeDateTo');
      if (fromEl) fromEl.value = dateFrom;
      if (toEl) toEl.value = dateTo;
      loadIncome();
    }
    function incomeQuickPickMonth(value) {
      incomeQuickApplyDates(value + '-01', incomeQuickMonthEnd(value));
      incomeQuickState.mode = '';
      renderIncomeQuickControls();
    }
    function incomeQuickPickYear(value) {
      incomeQuickApplyDates(`${value}-01-01`, `${value}-12-31`);
      incomeQuickState.mode = '';
      renderIncomeQuickControls();
    }
    function incomeQuickPickRangeStart(value) {
      incomeQuickState.start = value;
      if (incomeQuickState.end && value > incomeQuickState.end) {
        toast('开始月份不能晚于结束月份');
        incomeQuickState.start = '';
      }
      renderIncomeQuickControls();
    }
    function incomeQuickPickRangeEnd(value) {
      incomeQuickState.end = value;
      if (incomeQuickState.start && incomeQuickState.start > value) {
        toast('开始月份不能晚于结束月份');
        incomeQuickState.end = '';
        renderIncomeQuickControls();
        return;
      }
      if (incomeQuickState.start && incomeQuickState.end) {
        incomeQuickApplyDates(incomeQuickState.start + '-01', incomeQuickMonthEnd(incomeQuickState.end));
        incomeQuickState.mode = '';
        incomeQuickState.start = '';
        incomeQuickState.end = '';
      }
      renderIncomeQuickControls();
    }

    function openIncomeTypeManager() {
      const types = incomeTypes();
      const defaults = types.filter(item => item.is_default);
      const customs = types.filter(item => !item.is_default);
      $('dialogTitle').textContent = '收入类型管理';
      $('dialogSub').textContent = '默认类型可直接选用；可按需要添加自定义类型';
      $('dialogBody').innerHTML = `
        <div class="pc-member-section">
          <div class="pc-member-section-head">
            <span class="pc-member-section-title">默认类型菜单</span>
            <span class="pc-member-section-note">系统内置</span>
          </div>
          <div class="pc-income-type-menu">${defaults.map(item => `<div class="pc-income-type-item"><span>${esc(item.label)}</span><span class="type-kind">默认</span></div>`).join('')}</div>
        </div>
        <div class="pc-member-section">
          <div class="pc-member-section-head">
            <span class="pc-member-section-title">自定义类型</span>
            <span class="pc-member-section-note">${customs.length ? `共 ${customs.length} 项` : '暂未添加'}</span>
          </div>
          <div class="pc-income-type-custom">${customs.length ? customs.map(item => `<div class="pc-income-type-item"><span>${esc(item.label)}</span><button class="btn danger" type="button" onclick="deleteIncomeType('${esc(item.key)}')">删除</button></div>`).join('') : '<div class="empty" style="padding:12px">添加后会出现在收入录入和筛选菜单中</div>'}</div>
          <div class="pc-income-type-add">
            <input class="input" id="newIncomeType" maxlength="30" placeholder="例如：咨询服务、稿费" onkeydown="if(event.key==='Enter'){event.preventDefault();addIncomeType()}">
            <button class="btn primary" type="button" onclick="addIncomeType()">添加类型</button>
          </div>
        </div>`;
      $('dialogFoot').innerHTML = `<button class="btn primary" onclick="closeDialog()">完成</button>`;
      openDialog();
    }

    async function addIncomeType() {
      const input = $('newIncomeType');
      const label = input?.value?.trim();
      if (!label) { toast('请输入收入类型名称'); return; }
      try {
        const data = await api('/api/personal-center/income/types', { method: 'POST', body: { label } });
        state.income.types = data.items || [];
        renderIncome();
        openIncomeTypeManager();
        toast('收入类型已添加');
      } catch (error) {
        toast(error.message || '添加失败');
      }
    }

    async function deleteIncomeType(key) {
      try {
        const data = await api(`/api/personal-center/income/types/${encodeURIComponent(key)}`, { method: 'DELETE' });
        state.income.types = data.items || [];
        if (state.income.filters.incomeType === key) state.income.filters.incomeType = '';
        renderIncome();
        openIncomeTypeManager();
        toast('收入类型已删除');
      } catch (error) {
        toast(error.message || '删除失败');
      }
    }

    function renderIncome() {
      const stats = state.income.stats || {};
      const items = state.income.items || [];
      const schedules = state.income.schedules || [];
      const selectedMember = (state.income.members || []).find(member => String(member.id) === String(state.income.filters.memberId));
      const visibleSchedules = selectedMember ? schedules.filter(schedule => String(schedule.member_id) === String(selectedMember.id)) : schedules;
      const viewLabel = selectedMember ? `${selectedMember.name}的收入` : '家庭全部成员合计';
      const byType = stats.by_type || {};
      const monthly = stats.monthly || [];
      const lastAuto = stats.last_auto;
      $('content').innerHTML = `<div class="pc-page">

    function bindLineTooltip(hostId, tooltipId, formatLabel) {
      const host = $(hostId);
      const tooltip = $(tooltipId);
      if (!host || !tooltip) return;
      const svg = host.querySelector('svg');
      if (!svg) return;
      const points = [...host.querySelectorAll('.pc-line-point')].map(point => {
        const match = String(point.getAttribute('transform') || '').match(/translate\(([\d.]+),([\d.]+)\)/);
        return {
          cx: match ? Number(match[1]) : 0,
          cy: match ? Number(match[2]) : 0,
          label: point.dataset.label || '',
          amount: point.dataset.amount || 0,
        };
      });
      const svgWidth = 560;
      const svgHeight = 230;
      const hitRadius = 26;
      const positionTooltip = event => {
        const width = tooltip.offsetWidth || 120;
        const left = Math.min(event.clientX + 14, window.innerWidth - width - 12);
        tooltip.style.left = `${Math.max(12, left)}px`;
        tooltip.style.top = `${event.clientY - 14}px`;
      };
      host.addEventListener('mousemove', event => {
        const rect = svg.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const x = (event.clientX - rect.left) * (svgWidth / rect.width);
        const y = (event.clientY - rect.top) * (svgHeight / rect.height);
        let nearest = null;
        let best = Infinity;
        for (const point of points) {
          const distance = Math.hypot(point.cx - x, point.cy - y);
          if (distance < best) {
            best = distance;
            nearest = point;
          }
        }
        if (!nearest || best > hitRadius) {
          tooltip.hidden = true;
          return;
        }
        tooltip.innerHTML = `<strong>${esc(formatLabel(nearest.label))}</strong><span>${money(Number(nearest.amount || 0))}</span>`;
        tooltip.hidden = false;
        positionTooltip(event);
      });
      host.addEventListener('mouseleave', () => { tooltip.hidden = true; });
    }
    function incomeTooltipLabel(label) {
      return `${label.slice(0, 4)}年${Number(label.slice(5, 7))}月`;
    }
    function depositTooltipLabel(label) {
      return label.length >= 10
        ? `${label.slice(0, 4)}年${Number(label.slice(5, 7))}月${Number(label.slice(8, 10))}日`
        : label;
    }

        : '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2 5.5L8 2l6 3.5v5L8 14l-6-3.5v-5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M2 5.5L8 9l6-3.5M8 9v5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';
      return `<article class="pc-schedule-card">

        </div>

          <div class="pc-schedule-row"><label>默认金额（元）</label><input class="input" type="number" min="0" step="0.01" inputmode="decimal" value="${Number(schedule.default_amount || 0).toFixed(2)}" onchange="state.income.schedules.find(s=>s.schedule_key==='${schedule.schedule_key}'&&Number(s.member_id)===${Number(schedule.member_id)}).default_amount=this.value;saveSchedules()"></div>
        </div>
        <div class="pc-schedule-meta">${schedule.enabled && Number(schedule.default_amount) > 0
          ? `已启用：每月 ${Number(schedule.day_of_month || 15)} 日自动记录 ${esc(money(schedule.default_amount))}，错过日期后打开系统会自动补记。`
          : '关闭开关或默认金额为 0 时不会自动记录。'}</div>

    async function saveSchedules() {
      try {
        const schedules = (state.income.schedules || []).map(schedule => ({
          schedule_key: schedule.schedule_key,

          enabled: !!schedule.enabled,
          day_of_month: Number(schedule.day_of_month || 15),
          default_amount: Number(schedule.default_amount || 0),

        const data = await api('/api/personal-center/income/schedules', { method: 'PUT', body: { schedules } });

        toast('自动记录设置已保存');
        renderIncome();

    async function saveIncomeRecord(id) {
      const incomeType = $('incomeType')?.value || '';
      const amount = $('incomeAmount')?.value || '';
      const existing = id ? (state.income.items || []).find(item => Number(item.id) === Number(id)) : null;
      if (!incomeType) { toast('请选择收入类型'); return; }
      if (!amount || Number(amount) <= 0) { toast('请填写正确的金额'); return; }
      const caseInput = $('incomeCase')?.value?.trim();
      const caseId = Number($('incomeCaseId')?.value || 0);
      if (caseInput && !caseId) { toast('请从建议列表中选择关联案件，或清空不关联'); return; }
      const button = $('saveIncomeButton');
      if (button) { button.disabled = true; button.textContent = '保存中…'; }
      try {
        const payload = {
          income_date: $('incomeDate')?.value || localTodayValue(),
          member_id: Number((existing?.member_id ?? state.income.filters.memberId) || 0) || null,
          income_type: incomeType,
          amount,
          case_id: caseId || null,
          note: $('incomeNote')?.value || '',
        };
        if (id) {
          await api(`/api/personal-center/income/records/${id}`, { method: 'PUT', body: payload });
          toast('收入记录已更新');
        } else {
          await api('/api/personal-center/income/records', { method: 'POST', body: payload });
          toast('收入记录已保存');
        }
        closeEditor();
        await loadIncome();
      } catch (error) {
        toast(error.message || '保存失败');
        if (button) { button.disabled = false; button.textContent = '保存'; }
      }
    }

    async function deleteIncomeRecord(id) {
      openConfirm('删除收入记录', '删除后无法恢复，确定删除这条记录吗？', async () => {
        try {
          await api(`/api/personal-center/income/records/${id}`, { method: 'DELETE' });
          toast('已删除');
          await loadIncome();
        } catch (error) {
          toast(error.message || '删除失败');
        }
      }, '删除');
    }

    /* ── 通用确认弹窗 ───────────────────────── */
    function openConfirm(title, message, onConfirm, confirmLabel = '确定') {
      $('dialogTitle').textContent = title;
      $('dialogSub').textContent = '';
      $('dialogBody').innerHTML = `<p style="color:var(--muted);font-size:13px;line-height:1.65">${esc(message)}</p>`;
      $('dialogFoot').innerHTML = `<button class="btn" onclick="closeDialog()">取消</button><button class="btn danger" id="confirmButton" onclick="confirmDialogAction()">${esc(confirmLabel)}</button>`;
      window.__confirmAction = onConfirm;
      openDialog();
    }
    function confirmDialogAction() {
      const action = window.__confirmAction;
      closeDialog();
      if (typeof action === 'function') action();
    }
    function openDialog() {
      $('dialogMask').classList.add('show');
    }
    function closeDialog() {
      $('dialogMask').classList.remove('show');

    /* ── SVG 图表 ───────────────────────────── */
    function chartColors() {
      const css = getComputedStyle(document.documentElement);
      return {
        line: css.getPropertyValue('--chart-line').trim() || 'var(--kb-theme-primary, #8b1a1a)',
        cash: css.getPropertyValue('--chart-cash').trim() || '#b7791f',
        fund: css.getPropertyValue('--chart-fund').trim() || '#14745f',
        grid: css.getPropertyValue('--chart-grid').trim() || '#e8ecf3',
        muted: css.getPropertyValue('--muted').trim() || '#667085',
      };
    }

    function depositLineChart(values, labels) {
      if (!values.length) return '<div class="pc-chart-empty">暂无数据，先记录一次存款吧</div>';
      const colors = chartColors();
      const width = 560;
      const height = 230;
      const pad = { top: 16, right: 14, bottom: 30, left: 52 };
      const innerW = width - pad.left - pad.right;
      const innerH = height - pad.top - pad.bottom;
      const min = Math.min(...values);
      const max = Math.max(...values);
      const span = max - min || 1;
      const lo = Math.max(0, min - span * 0.15);
      const hi = max + span * 0.15;
      const x = index => values.length === 1 ? pad.left + innerW / 2 : pad.left + (innerW * index) / (values.length - 1);
      const y = value => pad.top + innerH - ((value - lo) / (hi - lo)) * innerH;
      const points = values.map((value, index) => ({ px: x(index), py: y(value), value, label: labels[index] }));
      const path = points.map((point, index) => `${index ? 'L' : 'M'}${point.px.toFixed(1)},${point.py.toFixed(1)}`).join(' ');
      const area = `${path} L${points[points.length - 1].px.toFixed(1)},${pad.top + innerH} L${points[0].px.toFixed(1)},${pad.top + innerH} Z`;
      const yTicks = [0, 1, 2, 3, 4].map(tick => {
        const value = lo + ((hi - lo) * tick) / 4;
        return { value, py: pad.top + innerH - (tick * innerH) / 4 };
      });
      const labelStep = Math.max(1, Math.ceil(labels.length / 8));
      return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="家庭存款变化折线图">
        <defs>
          <linearGradient id="pcLineFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${colors.line}" stop-opacity=".22"/>
            <stop offset="100%" stop-color="${colors.line}" stop-opacity=".02"/>
          </linearGradient>
        </defs>
        ${yTicks.map(tick => `<g><line x1="${pad.left}" y1="${tick.py}" x2="${width - pad.right}" y2="${tick.py}" stroke="${colors.grid}" stroke-width="1"/><text x="${pad.left - 8}" y="${tick.py + 3.5}" text-anchor="end" font-size="9.5" fill="${colors.muted}">${formatAxisMoney(tick.value)}</text></g>`).join('')}
        <path d="${area}" fill="url(#pcLineFill)"/>
        <path d="${path}" fill="none" stroke="${colors.line}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
        ${points.map(point => `<g class="pc-line-point" data-label="${esc(point.label)}" data-amount="${point.value}" transform="translate(${point.px},${point.py})"><circle r="11" fill="transparent" stroke="none"/><circle r="3.6" fill="#fff" stroke="${colors.line}" stroke-width="2"/></g>`).join('')}
        ${points.map((point, index) => (index % labelStep === 0 || index === points.length - 1) ? `<text x="${point.px}" y="${height - 8}" text-anchor="middle" font-size="9.5" fill="${colors.muted}">${esc(shortMonth(point.label))}</text>` : '').join('')}
      </svg>`;
    }

    function depositBarChart(members, scope = '') {
      if (!members.length) return '<div class="pc-chart-empty">暂无数据</div>';
      const colors = chartColors();
      const width = 420;
      const height = 230;
      const pad = { top: 16, right: 10, bottom: 42, left: 52 };
      const innerW = width - pad.left - pad.right;
      const innerH = height - pad.top - pad.bottom;
      const scopeValue = member => scope === 'cash' ? member.cash : scope === 'fund' ? member.fund : member.cash + member.fund;
      const maxValue = Math.max(1, ...members.map(scopeValue));
      const groupW = innerW / Math.max(members.length, 1);
      const barW = Math.min(34, groupW * 0.3);
      const yTicks = [0, 1, 2, 3, 4].map(tick => {
        const value = (maxValue * tick) / 4;
        return { value, py: pad.top + innerH - (tick * innerH) / 4 };
      });
      const bars = members.map((member, index) => {
        const cx = pad.left + groupW * (index + 0.5);
        const cashH = scope === 'fund' ? 0 : (member.cash / maxValue) * innerH;
        const fundH = scope === 'cash' ? 0 : (member.fund / maxValue) * innerH;
        return `<g>
          ${scope === 'fund' ? '' : `<rect x="${cx - barW - 3}" y="${pad.top + innerH - cashH}" width="${barW}" height="${Math.max(0, cashH)}" rx="4" fill="${colors.cash}"><title>${esc(member.name)} 现金存款：${money(member.cash)}</title></rect>`}
          ${scope === 'cash' ? '' : `<rect x="${cx + 3}" y="${pad.top + innerH - fundH}" width="${barW}" height="${Math.max(0, fundH)}" rx="4" fill="${colors.fund}"><title>${esc(member.name)} 公积金：${money(member.fund)}</title></rect>`}
          <text x="${cx}" y="${height - 8}" text-anchor="middle" font-size="9.5" fill="${colors.muted}">${esc(member.name.length > 5 ? member.name.slice(0, 5) + '…' : member.name)}</text>
        </g>`;
      });
      return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="家庭成员存款构成柱状图">
        ${yTicks.map(tick => `<g><line x1="${pad.left}" y1="${tick.py}" x2="${width - pad.right}" y2="${tick.py}" stroke="${colors.grid}" stroke-width="1"/><text x="${pad.left - 8}" y="${tick.py + 3.5}" text-anchor="end" font-size="9.5" fill="${colors.muted}">${formatAxisMoney(tick.value)}</text></g>`).join('')}
        ${bars.join('')}
      </svg>`;
    }

    function incomeLineChart(monthly) {
      if (!monthly.length) return '<div class="pc-chart-empty">暂无数据，记录收入后将显示月度趋势</div>';
      const colors = chartColors();
      const width = 560;
      const height = 230;
      const pad = { top: 16, right: 14, bottom: 30, left: 52 };
      const innerW = width - pad.left - pad.right;
      const innerH = height - pad.top - pad.bottom;
      const values = monthly.map(item => item.amount);
      const labels = monthly.map(item => item.month);
      const max = Math.max(...values, 1);
      const x = index => values.length === 1 ? pad.left + innerW / 2 : pad.left + (innerW * index) / (values.length - 1);
      const y = value => pad.top + innerH - (value / max) * innerH;
      const points = values.map((value, index) => ({ px: x(index), py: y(value), value, label: labels[index] }));
      const path = points.map((point, index) => `${index ? 'L' : 'M'}${point.px.toFixed(1)},${point.py.toFixed(1)}`).join(' ');
      const area = `${path} L${points[points.length - 1].px.toFixed(1)},${pad.top + innerH} L${points[0].px.toFixed(1)},${pad.top + innerH} Z`;
      const yTicks = [0, 1, 2, 3, 4].map(tick => {
        const value = (max * tick) / 4;
        return { value, py: pad.top + innerH - (tick * innerH) / 4 };
      });
      const labelStep = Math.max(1, Math.ceil(labels.length / 8));
      return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="月度收入折线图">
        <defs>
          <linearGradient id="pcIncomeLineFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${colors.line}" stop-opacity=".22"/>
            <stop offset="100%" stop-color="${colors.line}" stop-opacity=".02"/>
          </linearGradient>
        </defs>
        ${yTicks.map(tick => `<g><line x1="${pad.left}" y1="${tick.py}" x2="${width - pad.right}" y2="${tick.py}" stroke="${colors.grid}" stroke-width="1"/><text x="${pad.left - 8}" y="${tick.py + 3.5}" text-anchor="end" font-size="9.5" fill="${colors.muted}">${formatAxisMoney(tick.value)}</text></g>`).join('')}
        <path d="${area}" fill="url(#pcIncomeLineFill)"/>
        <path d="${path}" fill="none" stroke="${colors.line}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
        ${points.map(point => `<g class="pc-line-point" data-label="${esc(point.label)}" data-amount="${point.value}" transform="translate(${point.px},${point.py})"><circle r="11" fill="transparent" stroke="none"/><circle r="3.6" fill="#fff" stroke="${colors.line}" stroke-width="2"/></g>`).join('')}
        ${points.map((point, index) => (index % labelStep === 0 || index === points.length - 1) ? `<text x="${point.px}" y="${height - 8}" text-anchor="middle" font-size="9.5" fill="${colors.muted}">${esc(point.label)}</text>` : '').join('')}
      </svg>`;
    }

    function incomeBarChart(byType) {
      const entries = incomeTypes().map(item => ({ label: item.label, amount: (byType[item.key] || {}).amount || 0 }));
      if (!entries.some(entry => entry.amount > 0)) return '<div class="pc-chart-empty">暂无数据，记录收入后将显示类型构成</div>';
      const colors = chartColors();
      const width = 420;
      const height = 230;
      const pad = { top: 16, right: 10, bottom: 42, left: 52 };
      const innerW = width - pad.left - pad.right;
      const innerH = height - pad.top - pad.bottom;
      const max = Math.max(...entries.map(entry => entry.amount), 1);
      const groupW = innerW / entries.length;
      const barW = Math.min(30, groupW * 0.52);
      const yTicks = [0, 1, 2, 3, 4].map(tick => {
        const value = (max * tick) / 4;
        return { value, py: pad.top + innerH - (tick * innerH) / 4 };
      });
      const bars = entries.map((entry, index) => {
        const cx = pad.left + groupW * (index + 0.5);
        const h = (entry.amount / max) * innerH;
        return `<g>
          <rect x="${cx - barW / 2}" y="${pad.top + innerH - h}" width="${barW}" height="${Math.max(0, h)}" rx="4" fill="${colors.fund}"><title>${esc(entry.label)}：${money(entry.amount)}</title></rect>
          <text x="${cx}" y="${height - 8}" text-anchor="middle" font-size="9.5" fill="${colors.muted}">${esc(entry.label)}</text>
        </g>`;
      });
      return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="收入类型构成柱状图">
        ${yTicks.map(tick => `<g><line x1="${pad.left}" y1="${tick.py}" x2="${width - pad.right}" y2="${tick.py}" stroke="${colors.grid}" stroke-width="1"/><text x="${pad.left - 8}" y="${tick.py + 3.5}" text-anchor="end" font-size="9.5" fill="${colors.muted}">${formatAxisMoney(tick.value)}</text></g>`).join('')}
        ${bars.join('')}
      </svg>`;
    }

    function formatAxisMoney(value) {
      if (value >= 10000) return `${(value / 10000).toFixed(value >= 100000 ? 0 : 1)}万`;
      if (value >= 1000) return `${(value / 1000).toFixed(0)}k`;
      return String(Math.round(value));
    }
    function shortMonth(value) {
      const text = String(value || '');
      if (text.length >= 7) return text.slice(2).replace('-', '.');
      const match = text.match(/^(\d{4})-(\d{2})/);
      if (match) return `${match[2]}月`;
      return text;
    }

    /* ── 启动 ───────────────────────────────── */
    (async function boot() {
      renderTopActions();
      await probeBiometric();
      await initSecurity();
    })();
  </script>
</body>
</html>
