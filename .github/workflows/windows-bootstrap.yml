name: Windows bootstrap development build

on:
  push:
    branches: ['codex/windows-bootstrap-*']
  workflow_dispatch:

permissions:
  contents: write # Private CI report branch only; no Releases or public publishing.

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          python -m pip install -r scripts/windows/requirements-bootstrap.txt -r scripts/windows/requirements-runtime.txt
          npm install --prefix windows-installer
      - name: Verify signed installer and platform contracts
        run: python -m unittest tests.test_windows_bootstrap -v
      - name: Create disposable development trust root
        shell: python
        run: |
          import base64, json
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat
          key = Ed25519PrivateKey.generate()
          config = {'public_key': base64.b64encode(key.public_key().public_bytes(Encoding.Raw, PublicFormat.Raw)).decode(), 'catalog_url': '', 'allowed_hosts': []}
          Path('windows-installer/bootstrap-config.json').write_text(json.dumps(config))
      - name: Freeze small installation worker
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name bootstrap-engine
          --distpath windows-installer/src-tauri/resources
          --workpath build/windows-bootstrap --specpath build
          --add-data "windows-installer/bootstrap-config.json;."
          scripts/windows/bootstrap_engine.py
      - name: Build Windows setup executable
        working-directory: windows-installer
        shell: pwsh
        run: |
          npm run build 2>&1 | Tee-Object -FilePath ../build/windows-build.log
          exit $LASTEXITCODE
      - name: Check installer size
        shell: python
        run: |
          import json
          from pathlib import Path
          installers = list(Path('windows-installer/src-tauri/target/release/bundle/nsis').glob('*.exe'))
          assert len(installers) == 1, installers
          size = installers[0].stat().st_size
          assert size < 500_000_000, size
          Path('build/windows-installer-size.json').write_text(json.dumps({'bytes': size, 'development_only': True, 'production_channel_configured': False}))
      - name: Freeze anonymous business runtime
        shell: pwsh
        run: |
          python scripts/windows/build_payload.py --output build/windows-components/server 2>&1 | Tee-Object -FilePath build/windows-payload.log
          exit $LASTEXITCODE
      - name: Smoke test frozen backend with anonymous profile
        run: python scripts/windows/smoke_backend.py build/windows-components/server/StellaServer.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Stella-Windows-development-${{ github.run_number }}
          retention-days: 7
          path: |
            windows-installer/src-tauri/target/release/bundle/nsis/*.exe
            build/windows-installer-size.json
            build/windows-smoke-result.json
            build/windows-build.log
            build/windows-payload.log
          if-no-files-found: warn
      - name: Save private build diagnostics for SSH-only development
        if: always()
        shell: pwsh
        env:
          STELLA_JOB_STATUS: ${{ job.status }}
          STELLA_SOURCE_SHA: ${{ github.sha }}
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'stella-ci-report'
          New-Item -ItemType Directory -Force $report | Out-Null
          @{source=$env:STELLA_SOURCE_SHA;status=$env:STELLA_JOB_STATUS;run=$env:GITHUB_RUN_ID} | ConvertTo-Json | Set-Content (Join-Path $report 'result.json')
          foreach ($file in @('windows-build.log','windows-payload.log','windows-installer-size.json','windows-smoke-result.json')) {
            $path = Join-Path 'build' $file
            if (Test-Path $path) { Get-Content $path -Tail 160 | Set-Content (Join-Path $report $file) }
          }
          git -C $report init -q
          git -C $report config user.name 'Stella CI'
          git -C $report config user.email 'ci@example.invalid'
          git -C $report add .
          git -C $report commit -qm 'Windows development build result'
          $commit = git -C $report rev-parse HEAD
          git fetch $report $commit
          git push origin "FETCH_HEAD:refs/heads/ci/windows-bootstrap-$env:GITHUB_RUN_ID"
