name: Windows bootstrap development build

on:
  push:
    branches: ['codex/windows-bootstrap-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          python -m pip install -r scripts/windows/requirements-bootstrap.txt -r scripts/windows/requirements-runtime.txt
          npm install --prefix windows-installer
      - name: Verify signed installer and platform contracts
        run: python -m unittest tests.test_windows_bootstrap -v
      - name: Create disposable development trust root
        shell: python
        run: |
          import base64, json
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat
          key = Ed25519PrivateKey.generate()
          config = {'public_key': base64.b64encode(key.public_key().public_bytes(Encoding.Raw, PublicFormat.Raw)).decode(), 'catalog_url': '', 'allowed_hosts': []}
          Path('windows-installer/bootstrap-config.json').write_text(json.dumps(config))
      - name: Freeze small installation worker
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name bootstrap-engine
          --distpath windows-installer/src-tauri/resources
          --workpath build/windows-bootstrap --specpath build
          --add-data "windows-installer/bootstrap-config.json;."
          scripts/windows/bootstrap_engine.py
      - name: Build Windows setup executable
        working-directory: windows-installer
        run: npm run build
      - name: Check installer size
        shell: python
        run: |
          import json
          from pathlib import Path
          installers = list(Path('windows-installer/src-tauri/target/release/bundle/nsis').glob('*.exe'))
          assert len(installers) == 1, installers
          size = installers[0].stat().st_size
          assert size < 500_000_000, size
          Path('build/windows-installer-size.json').write_text(json.dumps({'bytes': size, 'development_only': True, 'production_channel_configured': False}))
      - name: Freeze anonymous business runtime
        run: python scripts/windows/build_payload.py --output build/windows-components/server
      - name: Smoke test frozen backend with anonymous profile
        run: python scripts/windows/smoke_backend.py build/windows-components/server/StellaServer.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Stella-Windows-development-${{ github.run_number }}
          retention-days: 7
          path: |
            windows-installer/src-tauri/target/release/bundle/nsis/*.exe
            build/windows-installer-size.json
            build/windows-smoke-result.json
          if-no-files-found: warn
