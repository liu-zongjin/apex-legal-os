name: Windows complete production candidate

on:
  push:
    branches: ['codex/windows-production-*']
  workflow_dispatch:

concurrency:
  group: stella-windows-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # Private CI report branch only; no Releases or public publishing.

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-installer/src-tauri
          cache-on-failure: true
      - name: Install build dependencies
        id: dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          python -m pip install -r scripts/windows/requirements-bootstrap.txt -r scripts/windows/requirements-runtime.txt 2>&1 | Tee-Object -FilePath build/windows-dependencies.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | Tee-Object -FilePath build/windows-frontend-dependencies.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location windows-installer
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | Tee-Object -FilePath ../build/windows-npm.log
          Pop-Location
          exit $LASTEXITCODE
      - name: Verify signed installer and platform contracts
        id: tests
        shell: pwsh
        run: |
          python -m unittest tests.test_windows_bootstrap tests.test_windows_telemetry tests.test_manual_judicial_import tests.test_platform_files -v 2>&1 | Tee-Object -FilePath build/windows-tests.log
          exit $LASTEXITCODE
      - name: Use stable production public trust root
        shell: python
        run: |
          import json
          from pathlib import Path
          config = json.loads(Path('scripts/windows/production-trust.json').read_text())
          assert config['catalog_url'].startswith('https://liu-zongjin.github.io/')
          Path('windows-installer/bootstrap-config.json').write_text(json.dumps(config))
          config_path = Path('windows-installer/src-tauri/tauri.conf.json')
          native = json.loads(config_path.read_text())
          native['version'] = '1.1.6'
          config_path.write_text(json.dumps(native))
      - name: Freeze small installation worker
        id: worker
        shell: pwsh
        run: |
          $configPath = (Resolve-Path windows-installer/bootstrap-config.json).Path
          python -m PyInstaller --noconfirm --clean --onefile --console --name bootstrap-engine --distpath windows-installer/src-tauri/resources --workpath build/windows-bootstrap --specpath build --add-data "$configPath;." scripts/windows/bootstrap_engine.py 2>&1 | Tee-Object -FilePath build/windows-worker.log
          exit $LASTEXITCODE
      - name: Build Windows setup executable
        id: setup
        working-directory: windows-installer
        shell: pwsh
        run: |
          npm run build 2>&1 | Tee-Object -FilePath ../build/windows-build.log
          exit $LASTEXITCODE
      - name: Check installer size
        shell: python
        run: |
          import json
          from pathlib import Path
          installers = list(Path('windows-installer/src-tauri/target/release/bundle/nsis').glob('*.exe'))
          assert len(installers) == 1, installers
          size = installers[0].stat().st_size
          assert size < 500_000_000, size
          Path('build/windows-installer-size.json').write_text(json.dumps({'bytes': size, 'development_only': False, 'production_channel_configured': True}))
      - name: Freeze anonymous business runtime
        id: payload
        shell: pwsh
        run: |
          python scripts/windows/build_payload.py --output build/windows-components/server 2>&1 | Tee-Object -FilePath build/windows-payload.log
          exit $LASTEXITCODE
      - name: Smoke test frozen backend with anonymous profile
        id: smoke
        shell: pwsh
        run: |
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/windows/smoke_backend.py build/windows-components/server/StellaServer.exe 2>&1 | Tee-Object -FilePath build/windows-smoke.log
          exit $LASTEXITCODE
      - name: Assemble and exercise every production component
        id: full_install
        shell: pwsh
        run: |
          python scripts/windows/build_components.py 2>&1 | Tee-Object -FilePath build/windows-full-install.log
          exit $LASTEXITCODE
      - name: Retain exact production candidates for local signing
        id: retain_production
        shell: pwsh
        run: |
          python scripts/windows/retain_production.py 2>&1 | Tee-Object -FilePath build/windows-production-transport.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Stella-Windows-development-${{ github.run_number }}
          retention-days: 7
          path: |
            windows-installer/src-tauri/target/release/bundle/nsis/*.exe
            build/windows-installer-size.json
            build/windows-smoke-result.json
            build/windows-smoke.log
            build/windows-build.log
            build/windows-payload.log
          if-no-files-found: warn
      - name: Save private build diagnostics for SSH-only development
        if: always()
        shell: pwsh
        env:
          STELLA_JOB_STATUS: ${{ job.status }}
          STELLA_SOURCE_SHA: ${{ github.sha }}
          STELLA_STEP_STATUS: ${{ toJSON(steps) }}
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'stella-ci-report'
          New-Item -ItemType Directory -Force $report | Out-Null
          @{source=$env:STELLA_SOURCE_SHA;status=$env:STELLA_JOB_STATUS;run=$env:GITHUB_RUN_ID} | ConvertTo-Json | Set-Content (Join-Path $report 'result.json')
          $env:STELLA_STEP_STATUS | Set-Content (Join-Path $report 'steps.json')
          foreach ($file in @('windows-dependencies.log','windows-npm.log','windows-tests.log','windows-worker.log','windows-build.log','windows-payload.log','windows-installer-size.json','windows-smoke-result.json','windows-smoke.log','windows-full-install.log','windows-office-extract.log','windows-production-transport.log')) {
            $path = Join-Path 'build' $file
            if (Test-Path $path) { Get-Content $path -Tail 160 | Set-Content (Join-Path $report $file) }
          }
          # Retain the small anonymous development setup for SSH-only retrieval.
          # These orphan private CI branches are never a public release channel.
          Get-ChildItem windows-installer/src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            if ($_.Length -lt 50000000) { Copy-Item $_.FullName (Join-Path $report 'Stella-development-setup.exe') }
          }
          if (Test-Path windows-installer/src-tauri/Cargo.lock) {
            Copy-Item windows-installer/src-tauri/Cargo.lock (Join-Path $report 'Cargo.lock')
          }
          git -C $report init -q
          git -C $report config user.name 'Stella CI'
          git -C $report config user.email 'ci@example.invalid'
          git -C $report add .
          git -C $report commit -qm 'Windows development build result'
          $commit = git -C $report rev-parse HEAD
          git fetch $report $commit
          git push origin "FETCH_HEAD:refs/heads/ci/windows-production-result-$env:GITHUB_RUN_ID"
